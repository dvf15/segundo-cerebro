<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Nova América × NorteShopping</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel executivo. Uma faixa de leitura no topo (shopping ativo e números), a maquete limpa no palco,
   pisos à esquerda e o caderno de lojas à direita. Azul-marinho sóbrio, um único destaque (âmbar = quiosque). */
:root{
  color-scheme:dark;
  --bg:#0b111b; --panel:#101826; --panel-2:#172235; --line:#223149; --line-2:#33486a;
  --fg:#e8eef6; --muted:#8696ab; --cy:#7fb4e6; --cy-ink:#0b111b;
  --kiosk:#f2b84b; --mine:#4cc38a; --opp:#f08c4a; --ok:#4cc38a; --warn:#f2b84b;
  --display:"IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
p{margin:0}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
h1{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:0;margin:0;line-height:1.2}
h1 small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:6px 13px;font-weight:500;font-size:13px;line-height:1.2;text-align:left;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-weight:400;font-size:11px;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--cy-ink)}
.seg button:disabled{opacity:.35;cursor:default}
.kpis{display:flex;flex-wrap:wrap;gap:6px 22px;margin-left:auto}
.kpi{display:flex;flex-direction:column}
.kpi b{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px}
.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
canvas#gl{touch-action:none}
canvas#ov{pointer-events:none}
.levels,.tools,.more,.walk,.caption,.note,.tip,.empty{z-index:3}
.levels{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 50px);overflow:auto;background:rgba(16,24,38,.88);border:1px solid var(--line);border-radius:7px;padding:4px}
.levels button{display:flex;align-items:baseline;gap:8px;background:none;border:0;border-radius:4px;padding:4px 8px;font-family:var(--mono);font-size:12px;text-align:left;min-width:84px;color:var(--fg)}
.levels button:hover{background:var(--panel-2)}
.levels button i{font-style:normal;color:var(--muted);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}
.levels button[data-step]{color:var(--muted);font-family:var(--body)}
.levels button[aria-pressed="true"]{background:var(--fg);color:var(--cy-ink)}
.levels button[aria-pressed="true"] i{color:inherit}
.tools{position:absolute;right:10px;top:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - 124px)}
.tools>button,.more>button,.more>label{background:rgba(16,24,38,.9);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--muted)}
.tools>button[aria-pressed="true"],.more>button[aria-pressed="true"],.tools>button[aria-expanded="true"]{color:var(--fg);border-color:var(--line-2);background:var(--panel-2)}
.tools .seg button{padding:6px 12px;font-size:12.5px}
.more{position:absolute;right:10px;top:50px;display:flex;flex-direction:column;gap:4px;background:rgba(16,24,38,.96);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:190px}
.more>button,.more>label{border-color:transparent;background:none;justify-content:space-between}
.more>button:hover{background:var(--panel-2)}
.more>button[aria-pressed="true"]::after{content:"ativo";font-size:10.5px;color:var(--cy)}
.more input[type=range]{width:84px;accent-color:var(--cy)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.walk{position:absolute;left:170px;right:60px;bottom:40px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.walk button{pointer-events:auto;background:rgba(16,24,38,.92);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:500;font-size:12.5px}
.walk button.go{background:var(--fg);color:var(--cy-ink);border-color:var(--fg)}
.zoom{position:absolute;right:18px;bottom:92px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:rgba(16,24,38,.92);z-index:3}
.zoom button{width:32px;height:32px;background:none;border:0;font-size:18px;line-height:1;color:var(--fg)}
.zoom button:first-child{border-bottom:1px solid var(--line)}
.zoom button:hover{background:var(--panel-2)}
.caption{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(16,24,38,.95);border:1px solid var(--line-2);border-radius:8px;padding:9px 14px;text-align:center;max-width:min(520px,90%)}
.caption b{font-size:15px;font-weight:600;display:block}
.caption span{color:var(--muted);font-size:12px}
.note{position:absolute;left:12px;right:12px;bottom:8px;font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;pointer-events:none}
.note .lg{display:flex;gap:12px;flex-wrap:wrap}
.note .lg span{display:inline-flex;align-items:center;gap:5px}
.tip{position:absolute;pointer-events:none;background:rgba(16,24,38,.97);border:1px solid var(--line-2);border-radius:6px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translate(14px,14px)}
.tip small{color:var(--muted);display:block}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 150px));background:rgba(16,24,38,.95);border:1px solid var(--line-2);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.empty b{font-size:15px;font-weight:600}
.empty p{font-size:12.5px;color:var(--muted)}

aside{min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font-weight:500;font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--cy)}
.pane{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.pane>*{flex:none}
.search{display:flex;gap:6px}
.search input,.search select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.search input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11.5px;color:var(--fg)}
.chip[aria-pressed="false"]{opacity:.4}
.count{font-size:12px;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li button{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 2px;text-align:left}
ul.list li button:hover{background:var(--panel-2)}
ul.list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
ul.list .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
ul.list .mt{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.detail{border:1px solid var(--line-2);border-radius:8px;padding:12px 13px;background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
.detail h2{font-size:17px;font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
.detail .close{float:right;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.detail a{color:var(--cy);font-size:12px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:12.5px}
dt{color:var(--muted)}
dd{margin:0;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px}
.tag.of{color:var(--ok)} .tag.es{color:var(--warn)} .tag.cm{color:var(--cy)} .tag.op{color:var(--opp)} .tag.mi{color:var(--mine)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 96px;gap:8px;align-items:center;font-size:12px}
.bar .track{height:10px;background:var(--panel-2);border-radius:2px;overflow:hidden;display:block}
.bar .fill{height:100%;display:block;border-radius:2px}
.bar .v{font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr) 62px;gap:4px 8px;align-items:center;font-size:12px}
.duo .tr{display:flex;flex-direction:column;gap:2px}
.duo .tr i{display:block;height:6px;min-width:1px;border-radius:2px}
.duo .v{font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:5px 14px;font-size:12.5px;align-items:baseline}
.score b{font-weight:600;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.score .hd{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.big3 div,.big4 div{border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.big3 b,.big4 b{display:block;font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.big3 span,.big4 span{font-size:11.5px;color:var(--muted)}
.pre{display:flex;flex-wrap:wrap;gap:6px}
.pre button{background:none;border:1px solid var(--line-2);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--fg)}
.pre button[aria-pressed="true"]{background:var(--fg);color:var(--cy-ink);border-color:var(--fg)}
.dec{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.dec button{background:none;border:0;border-right:1px solid var(--line);padding:3px 7px;font-size:11.5px;color:var(--muted)}
.dec button:last-child{border-right:0}
.dec button[aria-pressed="true"]{color:var(--cy-ink);font-weight:600}
.dec button[data-d="pro"][aria-pressed="true"]{background:var(--opp)}
.dec button[data-d="tem"][aria-pressed="true"]{background:var(--mine)}
.dec button[data-d="nao"][aria-pressed="true"]{background:var(--muted)}
ul.pbl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.pbl li{border-bottom:1px solid var(--line);padding:7px 0;display:flex;flex-direction:column;gap:5px}
.pbh{display:flex;align-items:center;gap:8px}
.pbn{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.pbn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.obs{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px}
.pbc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pbc button{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:none;text-align:left;color:var(--fg)}
.pbc button b{display:block;font-size:19px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.pbc button span{font-size:11px;color:var(--muted)}
.pbc button[aria-pressed="true"]{border-color:var(--fg);background:var(--panel-2)}
.ins{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-bottom:1px solid var(--line)}
.ins b{font-weight:600;font-size:13px}
.ins button{align-self:flex-start;background:none;border:0;padding:0;color:var(--cy);font-size:12px}
ul.list li button.fl{grid-template-columns:34px minmax(0,1fr) auto}
ul.list li button.fl .id{font-family:var(--mono);font-size:12px;color:var(--cy)}
ul.list li button.fl .nm{white-space:normal}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 0;font-weight:600}
.pane p,.pane li{font-size:12.5px}
.pane ol,.pane ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:6px 11px;font-size:12px;align-self:flex-start}
.btn.pri{background:var(--fg);color:var(--cy-ink);border-color:var(--fg);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
textarea{width:100%;height:120px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;padding:6px}
.msg{font-size:12px;color:var(--warn)}
@media (max-width:860px){
  html,body{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{height:66vh;min-height:420px}
  .pane{overflow:visible}
  .kpis{margin-left:0}
  .note .lg{display:none}
  .seg button small{display:none}
  .tools{gap:4px}
  .tools>button{padding:5px 9px}
  .walk{left:10px;right:10px;bottom:36px}
}

/* ajustes do modelo com vários shoppings */
header .seg{flex-wrap:wrap}
details{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-top:12px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details[open] summary{margin-bottom:8px;color:var(--fg)}
#impBox:empty{display:none}
#impBox{margin-bottom:12px}
</style>

<header>
  <h1 id="ttl"></h1>
  <div class="seg" id="mallSel" role="group" aria-label="Shopping em análise" hidden></div>
  <div class="kpis" id="kpis"></div>
</header>

<main>
  <section class="stage" id="stage" aria-label="Maquete do shopping">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <nav class="levels" id="levels" aria-label="Pisos"></nav>
    <div class="tools">
      <div class="seg" id="viewSel" role="group" aria-label="Modo de visualização">
        <button data-view="3d" aria-pressed="true">3D</button>
        <button data-view="2d" aria-pressed="false">Planta 2D</button>
        <button data-view="walk" aria-pressed="false">Passeio</button>
      </div>
      <button id="btLabels" aria-pressed="true">Nomes</button>
      <button id="btKiosk" aria-pressed="false"><span class="dot" style="background:var(--kiosk)"></span>Só quiosques</button>
      <button id="btMore" aria-expanded="false" aria-controls="more">Mais opções</button>
    </div>
    <div class="more" id="more" hidden>
      <button id="btTour" aria-pressed="false">Tour pelos pisos</button>
      <button id="btSeg" aria-pressed="false">Cores por segmento</button>
      <button id="btCtx" aria-pressed="false">Prédios do entorno</button>
      <button id="btTower" aria-pressed="false">Torre</button>
      <button id="btFull" aria-pressed="false">Tela cheia</button>
      <label for="rgExp"><span>Afastar pisos</span><input type="range" id="rgExp" min="6" max="36" value="20"></label>
    </div>
    <div class="walk" id="walk" hidden>
      <button id="wkLeft" aria-label="Virar à esquerda">◀ Virar</button>
      <button id="wkBack">▼ Recuar</button>
      <button id="wkGo" class="go">▲ Avançar</button>
      <button id="wkRight" aria-label="Virar à direita">Virar ▶</button>
      <button id="wkDown">▼ Descer piso</button>
      <button id="wkUp">▲ Subir piso</button>
    </div>
    <div class="zoom" id="zoom"><button id="zIn" aria-label="Aumentar o zoom" title="Aumentar o zoom">+</button><button id="zOut" aria-label="Diminuir o zoom" title="Diminuir o zoom">−</button></div>
    <div class="caption" id="caption" hidden></div>
    <div class="tip" id="tip" hidden></div>
    <div class="empty" id="empty" hidden>
      <b id="emptyT">Falta a lista de lojas</b>
      <p>O prédio já está aqui com o contorno e as entradas do mapa. As lojas e os quiosques entram pela relação de lojas do shopping.</p>
      <button class="btn pri" id="btGoImp">Colar a lista de lojas</button>
    </div>
    <div class="note"><span id="hint"></span><span class="lg" id="legend"></span></div>
  </section>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tb-resumo" aria-selected="true" data-tab="resumo">Resumo</button>
      <button role="tab" id="tb-pb" aria-selected="false" data-tab="pb">Prospecção</button>
      <button role="tab" id="tb-lojas" aria-selected="false" data-tab="lojas">Lojas</button>
      <button role="tab" id="tb-mix" aria-selected="false" data-tab="mix">Mix</button>
      <button role="tab" id="tb-cmp" aria-selected="false" data-tab="cmp" hidden>Comparar</button>
      <button role="tab" id="tb-ficha" aria-selected="false" data-tab="ficha">Ficha</button>
    </div>
    <div class="pane" id="pane-resumo"></div>
    <div class="pane" id="pane-pb" hidden></div>
    <div class="pane" id="pane-lojas" hidden>
      <div id="detail"></div>
      <div id="impBox"></div>
      <div class="search">
        <input id="q" type="search" placeholder="Buscar loja ou categoria" aria-label="Buscar loja ou categoria">
        <select id="selTipo" aria-label="Tipo de operação"><option value="">Todos os tipos</option></select>
      </div>
      <div class="chips" id="chips"></div>
      <div class="row"><div class="count" id="count"></div><button class="btn" id="btClear" hidden>Limpar filtros</button></div>
      <ul class="list" id="list"></ul>
    </div>
    <div class="pane" id="pane-mix" hidden></div>
    <div class="pane" id="pane-cmp" hidden></div>
    <div class="pane" id="pane-ficha" hidden></div>
  </aside>
</main>

function criarNucleo(CFG) {

function accHtml(M) {

  const by = t => X.acessos.filter(a => a.t === t), ruas = L => [...new Set(L.map(a => abrev(a.rua)).filter(Boolean))].join(' e '), pts = X.pontos.filter(p => p.d <= 170);
  const rows = [];
  if (by('principal').length) rows.push(['Entrada principal', ruas(by('principal')) + ', no piso térreo (' + M.gl + ')']);
  if (by('entrada').length) rows.push(['Outras entradas de pedestres', by('entrada').length + ' mapeadas: ' + ruas(by('entrada'))]);
  if (by('garagem').length) rows.push(['Acessos de garagem', by('garagem').length + ' mapeados: ' + ruas(by('garagem'))]);
  if (by('cancela').length) rows.push(['Cancelas no mapa', String(by('cancela').length)]);
  if (X.nomes.length) rows.push(['Ruas do entorno', X.nomes.map(s => abrev(s.n)).join(' · ')]);
  if (pts.length) rows.push(['Transporte próximo', pts.map(p => (p.t === 'táxi' ? 'Ponto de táxi' : p.t === 'ônibus' ? 'Ônibus' : 'Metrô') + (p.n ? ' ' + p.n : '') + ' (' + p.d + ' m)').join(' · ')]);
  return `<h3>Acessos e referências · ${esc(M.nome)}</h3><dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>

    <p class="count">Entradas, ruas e prédios vizinhos vêm do OpenStreetMap. No 3D, as setas verdes marcam entradas de pedestres e as azuis, garagem. A altura dos prédios vizinhos é ilustrativa quando o mapa não informa.</p>`;
}
const TAGC = {oficial:'of', real:'of', estimado:'es', 'a confirmar':'es'};
