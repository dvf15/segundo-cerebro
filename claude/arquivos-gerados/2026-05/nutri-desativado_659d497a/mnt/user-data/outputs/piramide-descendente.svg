<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" rx="14" fill="#FAFAF7"/>
  <text x="32" y="42" font-size="22" font-weight="700" fill="#1F2937">Pirâmide descendente (reverse pyramid)</text>
  <text x="32" y="66" font-size="14" fill="#6B7280">Reps decrescentes. Cada "rep" = segurar a posição ~10 s.</text>

  <!-- baseline -->
  <line x1="80" y1="270" x2="600" y2="270" stroke="#C9C7BE" stroke-width="2"/>

  <!-- Set 1: 6 reps -->
  <rect x="110" y="120" width="100" height="150" rx="8" fill="#2563EB"/>
  <text x="160" y="110" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">6 reps</text>
  <text x="160" y="200" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">Série 1</text>
  <text x="160" y="295" font-size="11" fill="#6B7280" text-anchor="middle">~10 s cada</text>

  <!-- Set 2: 4 reps -->
  <rect x="270" y="170" width="100" height="100" rx="8" fill="#3B82F6"/>
  <text x="320" y="160" font-size="15" font-weight="700" fill="#3B82F6" text-anchor="middle">4 reps</text>
  <text x="320" y="225" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">Série 2</text>
  <text x="320" y="295" font-size="11" fill="#6B7280" text-anchor="middle">~10 s cada</text>

  <!-- Set 3: 2 reps -->
  <rect x="430" y="220" width="100" height="50" rx="8" fill="#93C5FD"/>
  <text x="480" y="210" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="middle">2 reps</text>
  <text x="480" y="251" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="600">Série 3</text>
  <text x="480" y="295" font-size="11" fill="#6B7280" text-anchor="middle">~10 s cada</text>

  <!-- descending arrow -->
  <path d="M160 95 q170 -10 320 95" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M480 190 l-2 -13 l11 6 z" fill="#DC2626"/>

  <text x="32" y="325" font-size="12.5" fill="#374151">Descer as reps acompanha a queda natural de endurance → mantém a FORMA até o fim (descanso ~20–30 s entre séries)</text>
</svg>
