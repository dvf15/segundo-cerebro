<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Planning — Quadro em Branco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --line:#cdcdcd;
    --line-strong:#9a9a9a;
    --accent:#1f9e57;
    --paper:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#e9e9e9;font-family:'Schibsted Grotesk',sans-serif;color:var(--ink);}

  /* Toolbar (não imprime) */
  .toolbar{
    position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:8px;
  }
  .toolbar button{
    font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:13px;
    border:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;
    cursor:pointer;letter-spacing:.02em;box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .toolbar button.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink);}

  /* Folha A "paisagem" */
  .sheet{
    width:1120px;max-width:96vw;aspect-ratio:1.45/1;margin:64px auto 48px;
    background:var(--paper);border-radius:18px;border:1px solid #ddd;
    box-shadow:0 18px 50px rgba(0,0,0,.12);
    padding:34px 40px 30px;position:relative;overflow:hidden;
    display:grid;
    grid-template-columns:1.05fr 1.5fr 1.15fr;
    grid-template-rows:auto 1fr auto;
    gap:14px 26px;
  }

  /* ---- Cabeçalho ---- */
  .head-left{grid-column:1;grid-row:1;}
  .head-right{grid-column:3;grid-row:1;text-align:right;}
  .kicker{font-size:11px;letter-spacing:.42em;font-weight:600;color:#666;}
  .title{font-family:'Anton',sans-serif;font-size:40px;line-height:.92;letter-spacing:.01em;}

  /* ---- HABITS ---- */
  .habits{grid-column:1;grid-row:2;align-self:start;}
  .habits h2{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:.04em;margin-bottom:14px;}
  .habits ol{list-style:none;}
  .habits li{display:flex;align-items:flex-end;gap:8px;margin-bottom:15px;}
  .habits li .num{font-weight:700;font-size:14px;width:18px;color:#444;}
  .habits li .ln{flex:1;border-bottom:1.6px solid var(--ink);height:20px;}

  .monthyear{margin-top:26px;}
  .monthyear .lbl{font-weight:700;font-size:13px;letter-spacing:.12em;color:#444;margin-bottom:8px;}
  .monthyear .field{border-bottom:1.6px solid var(--ink);height:24px;width:78%;}
  .monthyear .field+.field{margin-top:14px;}

  /* ---- Roda central ---- */
  .wheel{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;}
  .wheel svg{width:100%;height:auto;max-height:480px;}

  /* ---- Coluna direita ---- */
  .right{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:20px;}
  .bar{background:var(--ink);color:#fff;font-family:'Anton',sans-serif;
       letter-spacing:.08em;font-size:16px;text-align:center;padding:7px 0;}

  .obs .box{border:1.6px solid var(--ink);border-top:none;}
  .obs .box .row{height:34px;border-bottom:1px solid var(--line-strong);}
  .obs .box .row:last-child{border-bottom:none;}

  .goals .grid{
    border:1.6px solid var(--ink);border-top:none;
    display:grid;grid-template-columns:repeat(3,1fr);
  }
  .goals .cell{border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);
       aspect-ratio:1/.92;position:relative;}
  .goals .cell:nth-child(3n){border-right:none;}
  .goals .cell:nth-last-child(-n+3){border-bottom:none;}
  .goals .cell .tick{position:absolute;top:6px;left:6px;width:13px;height:13px;border:1.4px solid var(--ink);}

  /* ---- Rodapé / frase ---- */
  .quote{grid-column:2 / span 2;grid-row:3;align-self:end;text-align:right;padding-top:4px;}
  .quote p{font-style:italic;font-size:12.5px;color:#3a3a3a;line-height:1.45;}
  .quote .big{font-family:'Anton',sans-serif;font-style:normal;font-size:20px;letter-spacing:.05em;display:block;margin-top:4px;}
  .footnote{grid-column:1;grid-row:3;align-self:end;font-size:9px;color:#b3b3b3;}

  @media print{
    @page{size:A4 landscape;margin:8mm;}
    html,body{background:#fff;}
    .toolbar{display:none;}
    .sheet{box-shadow:none;border:none;border-radius:0;margin:0;width:100%;max-width:100%;height:100%;}
  }
  @media(max-width:760px){
    .sheet{grid-template-columns:1fr;grid-template-rows:auto;gap:22px;padding:22px;}
    .head-left,.head-right,.habits,.wheel,.right,.quote,.footnote{grid-column:1;grid-row:auto;text-align:left;}
    .head-right{text-align:left;}
    .quote{text-align:left;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">Imprimir / PDF</button>
</div>

<div class="sheet">
  <div class="head-left">
    <div class="kicker">ORGANIZE YOUR GOALS</div>
  </div>
  <div class="head-right">
    <div class="kicker">MONTHLY</div>
    <div class="title">PLANNING</div>
  </div>

  <!-- HABITS + MONTH/YEAR -->
  <div class="habits">
    <h2>HABITS:</h2>
    <ol id="habitList"></ol>
    <div class="monthyear">
      <div class="lbl">MONTH / YEAR:</div>
      <div class="field"></div>
      <div class="field"></div>
    </div>
  </div>

  <!-- Roda radial -->
  <div class="wheel">
    <svg id="tracker" viewBox="0 0 520 520" role="img" aria-label="Roda de hábitos: 31 dias por 8 hábitos"></svg>
  </div>

  <!-- Observations + Key goals -->
  <div class="right">
    <div class="obs">
      <div class="bar">OBSERVATIONS</div>
      <div class="box">
        <div class="row"></div><div class="row"></div><div class="row"></div>
        <div class="row"></div><div class="row"></div><div class="row"></div>
      </div>
    </div>
    <div class="goals">
      <div class="bar">KEY GOALS</div>
      <div class="grid">
        <div class="cell"><span class="tick"></span></div>
        <div class="cell"><span class="tick"></span></div>
        <div class="cell"><span class="tick"></span></div>
        <div class="cell"><span class="tick"></span></div>
        <div class="cell"><span class="tick"></span></div>
        <div class="cell"><span class="tick"></span></div>
      </div>
    </div>
  </div>

  <!-- Frase -->
  <div class="footnote">Recriação em branco · 31 dias × 8 hábitos</div>
  <div class="quote">
    <p>"Discipline doesn't care how you feel. Discipline is doing what<br>
       needs to be done, even when you don't feel like doing it"…
       <span class="big">DISCIPLINE.</span></p>
  </div>
</div>

<script>
/* ---------- Lista de hábitos (8 linhas em branco) ---------- */
const ol = document.getElementById('habitList');
for(let i=1;i<=8;i++){
  const li=document.createElement('li');
  li.innerHTML=`<span class="num">${i}.</span><span class="ln"></span>`;
  ol.appendChild(li);
}

/* ---------- Roda radial: 31 setores x 8 anéis ---------- */
const SVG_NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('tracker');
const cx=260, cy=260;
const r0=78;          // raio interno (centro vazio p/ mês/ano)
const rMax=222;       // raio externo
const DAYS=31;
const RINGS=8;
const ringStep=(rMax-r0)/RINGS;
const da=360/DAYS;    // ângulo por dia
const angGap=0.7;     // folga angular (deg) entre células
const radGap=1.4;     // folga radial (px) entre anéis

function polar(r,deg){
  const rad=(deg-90)*Math.PI/180;
  return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
}
function sectorPath(rIn,rOut,a0,a1){
  const [x0,y0]=polar(rOut,a0);
  const [x1,y1]=polar(rOut,a1);
  const [x2,y2]=polar(rIn,a1);
  const [x3,y3]=polar(rIn,a0);
  const large=(a1-a0)>180?1:0;
  return `M${x0} ${y0} A${rOut} ${rOut} 0 ${large} 1 ${x1} ${y1} `+
         `L${x2} ${y2} A${rIn} ${rIn} 0 ${large} 0 ${x3} ${y3} Z`;
}
function el(name,attrs){
  const e=document.createElementNS(SVG_NS,name);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}

/* células */
for(let d=0; d<DAYS; d++){
  const a0=d*da+angGap, a1=(d+1)*da-angGap;
  for(let ring=0; ring<RINGS; ring++){
    const rIn=r0+ring*ringStep+radGap;
    const rOut=r0+(ring+1)*ringStep;
    svg.appendChild(el('path',{
      d:sectorPath(rIn,rOut,a0,a1),
      fill:'#ffffff',
      stroke:'#b9b9b9',
      'stroke-width':1
    }));
  }
}

/* números dos dias (1..31) por fora */
for(let d=0; d<DAYS; d++){
  const mid=(d+0.5)*da;
  const [tx,ty]=polar(rMax+16, mid);
  const t=el('text',{
    x:tx, y:ty, 'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Schibsted Grotesk, sans-serif','font-size':12,
    'font-weight':600, fill:'#555'
  });
  t.textContent=d+1;
  svg.appendChild(t);
}

/* numeração dos 8 anéis dentro da 1ª célula (referência p/ os hábitos) */
for(let ring=0; ring<RINGS; ring++){
  const rMidVal=r0+(ring+0.5)*ringStep;
  const [tx,ty]=polar(rMidVal, 0.5*da);
  const t=el('text',{
    x:tx, y:ty, 'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Schibsted Grotesk, sans-serif','font-size':8.5,
    'font-weight':700, fill:'#c8c8c8'
  });
  t.textContent=ring+1;
  svg.appendChild(t);
}

/* texto central MONTH/YEAR */
const c1=el('text',{x:cx,y:cy-8,'text-anchor':'middle','font-family':'Schibsted Grotesk, sans-serif','font-size':11,'font-weight':700,fill:'#666','letter-spacing':'1'});
c1.textContent='MONTH / YEAR';
svg.appendChild(c1);
const line=el('line',{x1:cx-44,y1:cy+12,x2:cx+44,y2:cy+12,stroke:'#1a1a1a','stroke-width':1.4});
svg.appendChild(line);
</script>
</body>
</html>
