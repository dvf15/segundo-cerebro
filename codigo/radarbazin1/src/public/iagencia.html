<style>
:root {
  /* paleta do Radar de Varejo (radarbazin1, public/operacoes.html) */
  color-scheme: light;
  --tinta: #0d454a; --papel: #e5ded4; --cartao: #ffffff; --linha: #ccc5bc; --linha-suave: #e3dccf; --campo: #f1ece3;

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--papel); color: var(--tinta); }

.selo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(63, 158, 106, 0.35); padding: 3px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.selo svg { width: 13px; height: 13px; }
#status { margin-left: auto; font-size: 12px; color: var(--destaque); font-weight: 600; text-align: right; min-width: 0; }

main { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; gap: 20px; padding: 20px; align-items: start; max-width: 1500px; margin: 0 auto; }
.lado, .palco { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; min-width: 0; box-shadow: 0 1px 2px rgba(13,69,74,.05), 0 12px 28px rgba(13,69,74,.06); }

nav button.ativa, nav button.ativa:hover { color: #fff; background: var(--destaque); border-color: var(--destaque); }

h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--destaque); font-weight: 700; margin: 20px 0 8px; }

.linha.fino .campo { flex: 1 1 60px; min-width: 60px; }
.linha.separa { margin-top: 20px; padding-top: 12px; border-top: 1px dashed var(--linha); }
.cresce { flex: 1 1 140px; min-width: 0; }
.campo { display: block; margin: 8px 0; }
.linha > .campo { margin: 0; }
.campo > span { display: block; font-size: 11px; color: var(--suave); margin-bottom: 3px; }

input, select, textarea, button, .botao { font: inherit; color: inherit; }
input:not([type=checkbox]):not([type=color]):not([type=range]), select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--linha); border-radius: 10px; background: #fff; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: none; border-color: var(--destaque); box-shadow: 0 0 0 2px rgba(0,97,111,.18); }
input[type=range] { width: 100%; }
button, .botao { display: inline-block; padding: 7px 12px; border: 1px solid var(--linha); border-radius: 10px; background: #fff; cursor: pointer; font-weight: 700; white-space: nowrap; }
button:hover, .botao:hover { background: var(--campo); }
button.principal, .botao.principal { background: var(--destaque); border-color: var(--destaque); color: #fff; }
button.principal:hover, .botao.principal:hover { background: #0d454a; }
button.sutil { border-color: transparent; color: var(--suave); font-weight: 400; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.check { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; padding-bottom: 7px; }

.item { border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--campo); }
.item.mini { display: flex; gap: 10px; align-items: flex-end; }
.item.mini .campo { margin: 0; }
.item.peca { cursor: pointer; }
.item.peca.ativa { border-color: var(--destaque); box-shadow: inset 4px 0 0 var(--verde); }
.thumb { width: 52px; height: 52px; flex: none; border: 1px solid var(--linha); border-radius: 6px; background: #fff; display: grid; place-items: center; overflow: hidden; }
.thumb img { max-width: 100%; max-height: 100%; }
.tag { font-size: 12px; background: rgba(0,97,111,.1); color: var(--destaque); font-weight: 600; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }

.cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.cor { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.cor input { width: 38px; height: 38px; padding: 0; border: 1px solid var(--linha); border-radius: 6px; background: none; flex: none; }
code { font: 11px ui-monospace, Menlo, monospace; color: var(--suave); }

.nota { font-size: 12px; color: var(--suave); margin: 8px 0; }
.alerta { font-size: 12px; background: var(--atencao-bg); border: 1px solid rgba(192,125,30,.35); border-radius: 10px; padding: 8px 10px; }
.ok { color: var(--ok); } .ruim { color: var(--ruim); }

.foco { position: relative; display: inline-block; margin-top: 10px; cursor: crosshair; line-height: 0; border: 1px solid var(--linha); border-radius: 6px; overflow: hidden; }
.foco img { max-width: 100%; max-height: 240px; }
.foco i { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px var(--destaque), 0 0 0 4px var(--verde); pointer-events: none; }

.barra { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.barra select { flex: 1 1 200px; width: auto; }
.barra .check { padding: 0; }
.legenda { font-size: 12px; color: var(--suave); }
.legenda i { display: inline-block; width: 14px; border-top: 2px dashed; vertical-align: middle; margin: 0 4px 0 8px; }
.legenda .mg { color: #e6007e; } .legenda .cy { color: #00a0c6; }
#previa { display: block; margin: 0 auto; max-width: 100%; box-shadow: 0 1px 10px rgba(0, 0, 0, 0.14); }
#relatorio { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
#relatorio li { padding: 4px 0 4px 18px; position: relative; border-top: 1px solid var(--linha-suave); }
#relatorio li::before { content: "•"; position: absolute; left: 4px; color: var(--suave); }
#relatorio li.ok::before { content: "✓"; color: var(--ok); }
#relatorio li.ruim { color: var(--ruim); }
#relatorio li.ruim::before { content: "!"; color: var(--ruim); font-weight: 700; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  .palco { position: static; }
  header { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
  #status { margin-left: 0; width: 100%; text-align: left; }
  #cab-cluster { display: none; }
}
</style>

<script>
/* IAgencia — gerador de PDF de impressão (sem dependências).
   Cada página leva: a arte em JPEG (até a sangria), marcas de corte vetoriais,
   TrimBox/BleedBox e uma legenda técnica fora da área de sangria. */
(function (root) {
  const IAG = (root.IAG = root.IAG || {});
  const MM = 72 / 25.4; // pontos por milímetro
  const LIMITE_PT = 14400; // limite de página do Acrobat (200 pol.)

  const ascii = (s) =>
    String(s)
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/×/g, 'x')
      .replace(/[^\x20-\x7e]/g, '?')
      .replace(/([\\()])/g, '\\$1');

  const bytes = (s) => {
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 0xff;
    return u;
  };
  const n = (v) => (Math.round(v * 1000) / 1000).toString();

  /* Geometria da página em pontos, a partir das medidas reais em mm.
     escala = 1 (1:1), 10 (1:10)... */
  function geometria(p) {
    const s = 1 / (p.escala || 1);
    const w = p.w * s, h = p.h * s, b = p.sangria * s; // mm de página
    const menor = Math.min(w, h);
    const marca = Math.max(4, Math.min(12, menor * 0.03)); // comprimento da marca
    const recuo = b + 1.5; // a marca começa fora da sangria
    const margem = recuo + marca + 5;
    return {
      s, w, h, b, marca, recuo, margem,
      mediaW: (w + 2 * margem) * MM,
      mediaH: (h + 2 * margem) * MM,
    };
  }

  function escalaMinima(p) {
    for (const e of [1, 2, 5, 10, 20, 50]) {
      const g = geometria({ ...p, escala: e });
      if (g.mediaW <= LIMITE_PT && g.mediaH <= LIMITE_PT) return e;
    }
    return 100;
  }

  /* paginas: [{ w, h, sangria, escala, jpeg:Uint8Array, imgW, imgH, legenda }] (mm reais) */
  function montar(paginas) {
    const partes = [];
    const offsets = [];
    let pos = 0;
    const emit = (d) => {
      const u = typeof d === 'string' ? bytes(d) : d;
      partes.push(u);
      pos += u.length;
    };
    const abre = (id) => {
      offsets[id] = pos;
      emit(id + ' 0 obj\n');
    };

    const total = 3 + paginas.length * 3;
    emit('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    abre(1);
    emit('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    abre(2);
    emit('<< /Type /Pages /Count ' + paginas.length + ' /Kids [' +
      paginas.map((_, i) => 4 + i * 3 + ' 0 R').join(' ') + '] >>\nendobj\n');
    abre(3);
    emit('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n');

    paginas.forEach((p, i) => {
      const idPag = 4 + i * 3, idCont = idPag + 1, idImg = idPag + 2;
      const g = geometria(p);
      const H = g.mediaH;
      // caixas (origem do PDF embaixo, à esquerda)
      const tx0 = g.margem * MM, tx1 = (g.margem + g.w) * MM;
      const ty0 = g.margem * MM, ty1 = (g.margem + g.h) * MM;
      const bp = g.b * MM;
      const caixa = (a, b, c, d) => '[' + [a, b, c, d].map(n).join(' ') + ']';

      let c = 'q ' + n(tx1 - tx0 + 2 * bp) + ' 0 0 ' + n(ty1 - ty0 + 2 * bp) + ' ' +
        n(tx0 - bp) + ' ' + n(ty0 - bp) + ' cm /Im0 Do Q\n';
      // marcas de corte: preto 100% (K), traço fino
      c += '0 0 0 1 K 0.3 w\n';
      const r = g.recuo * MM, m = g.marca * MM;
      const linha = (x1, y1, x2, y2) => { c += n(x1) + ' ' + n(y1) + ' m ' + n(x2) + ' ' + n(y2) + ' l S\n'; };
      for (const x of [tx0, tx1]) {
        linha(x, ty0 - r, x, ty0 - r - m);
        linha(x, ty1 + r, x, ty1 + r + m);
      }
      for (const y of [ty0, ty1]) {
        linha(tx0 - r, y, tx0 - r - m, y);
        linha(tx1 + r, y, tx1 + r + m, y);
      }
      // marcas de centro
      const cx = (tx0 + tx1) / 2, cy = (ty0 + ty1) / 2;
      linha(cx, ty0 - r, cx, ty0 - r - m * 0.6);
      linha(cx, ty1 + r, cx, ty1 + r + m * 0.6);
      linha(tx0 - r, cy, tx0 - r - m * 0.6, cy);
      linha(tx1 + r, cy, tx1 + r + m * 0.6, cy);
      // legenda técnica no rodapé, fora da sangria
      const corpo = 6;
      const maxCar = Math.max(0, Math.floor((tx1 - tx0 - 8 * MM) / (corpo * 0.52)));
      const txt = ascii(p.legenda || '').slice(0, maxCar);
      if (txt) {
        c += '0 0 0 1 k BT /F1 ' + corpo + ' Tf ' + n(tx0 + 4 * MM) + ' ' +
          n(ty0 - r - m * 0.5 - corpo * 0.35) + ' Td (' + txt + ') Tj ET\n';
      }

      abre(idPag);
      emit('<< /Type /Page /Parent 2 0 R /MediaBox ' + caixa(0, 0, g.mediaW, H) +
        ' /BleedBox ' + caixa(tx0 - bp, ty0 - bp, tx1 + bp, ty1 + bp) +
        ' /TrimBox ' + caixa(tx0, ty0, tx1, ty1) +
        ' /Resources << /XObject << /Im0 ' + idImg + ' 0 R >> /Font << /F1 3 0 R >> >>' +
        ' /Contents ' + idCont + ' 0 R >>\nendobj\n');
      abre(idCont);
      emit('<< /Length ' + c.length + ' >>\nstream\n' + c + 'endstream\nendobj\n');
      abre(idImg);
      emit('<< /Type /XObject /Subtype /Image /Width ' + p.imgW + ' /Height ' + p.imgH +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.jpeg.length + ' >>\nstream\n');
      emit(p.jpeg);
      emit('\nendstream\nendobj\n');
    });

    const xref = pos;
    let t = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
    for (let id = 1; id <= total; id++) t += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
    t += 'trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
    emit(t);

    const out = new Uint8Array(pos);
    let o = 0;
    for (const u of partes) { out.set(u, o); o += u.length; }
    return out;
  }

  IAG.pdf = { montar, geometria, escalaMinima, MM, LIMITE_PT };
  if (typeof module !== 'undefined') module.exports = IAG.pdf;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* IAgencia — motor de layout. Recompõe o KV em qualquer formato usando a
   linha criativa do cluster. Desenha em milímetros: (0,0) é o canto superior
   esquerdo do corte; a arte se estende `sangria` mm para fora. */
(function () {
  const IAG = (window.IAG = window.IAG || {});

  /* ---------- imagens e fontes ---------- */
  const cache = new Map();
  IAG.carregarImagem = (src) => {
    if (!src) return Promise.resolve(null);
    if (!cache.has(src)) {
      cache.set(src, new Promise((res) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => res(null);
        i.src = src;
      }));
    }
    return cache.get(src);
  };

  IAG.FONTES = ['Montserrat', 'Poppins', 'Inter', 'Nunito', 'Oswald', 'Bebas Neue', 'Playfair Display', 'DM Serif Display'];
  async function garantirFontes(cluster) {
    const faltou = [];
    for (const [f, peso] of [[cluster.fontes.titulo, 800], [cluster.fontes.titulo, 700], [cluster.fontes.texto, 400], [cluster.fontes.texto, 600]]) {
      try { await document.fonts.load(peso + ' 20px "' + f + '"'); } catch (e) { /* segue */ }
      if (!document.fonts.check(peso + ' 20px "' + f + '"') && !faltou.includes(f)) faltou.push(f);
    }
    return faltou;
  }

  /* ---------- cor ---------- */
  const rgb = (hex) => {
    const h = String(hex || '#000').replace('#', '');
    const v = h.length === 3 ? h.split('').map((c) => c + c).join('') : h.padEnd(6, '0');
    return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16) || 0);
  };
  const lum = (hex) => {
    const [r, g, b] = rgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const contraste = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const sobre = (fundo) => (contraste(fundo, '#111111') >= contraste(fundo, '#ffffff') ? '#111111' : '#ffffff');
  const legivel = (cor, fundo, min) => (contraste(cor, fundo) >= (min || 3) ? cor : sobre(fundo));
  const alfa = (hex, a) => { const [r, g, b] = rgb(hex); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
  IAG.cor = { contraste, sobre, legivel };

  /* ---------- formato ---------- */
  IAG.orientacao = (w, h) => {
    const r = w / h;
    return r < 0.45 ? 'tall' : r < 0.85 ? 'portrait' : r <= 1.2 ? 'square' : r <= 2.6 ? 'landscape' : 'wide';
  };
  IAG.NOME_FORMATO = { tall: 'vertical estreito', portrait: 'vertical', square: 'quadrado', landscape: 'horizontal', wide: 'faixa horizontal' };

  /* ---------- primitivas ---------- */
  function caixaArredondada(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function quebrar(ctx, texto, largura) {
    const linhas = [];
    let estourou = false;
    for (const par of String(texto).split('\n')) {
      let atual = '';
      for (const p of par.split(/\s+/).filter(Boolean)) {
        if (ctx.measureText(p).width > largura) estourou = true;
        const t = atual ? atual + ' ' + p : p;
        if (atual && ctx.measureText(t).width > largura) { linhas.push(atual); atual = p; } else atual = t;
      }
      linhas.push(atual);
    }
    return { linhas, estourou };
  }

  /* Ajusta o corpo do texto à caixa (busca binária) e desenha. Devolve o corpo em mm. */
  function texto(ctx, str, cx, o) {
    if (!str || cx.w <= 0 || cx.h <= 0) return 0;
    const s = o.caixaAlta ? String(str).toUpperCase() : String(str);
    const lh = o.lh || 1.15;
    const fonte = (t) => (o.peso || 400) + ' ' + t + 'px "' + o.familia + '", "Helvetica Neue", Arial, sans-serif';
    let lo = 0.05, hi = Math.min(cx.h / lh, o.max || Infinity), melhor = null;
    for (let i = 0; i < 22; i++) {
      const t = (lo + hi) / 2;
      ctx.font = fonte(t);
      const q = quebrar(ctx, s, cx.w);
      const ok = !q.estourou && q.linhas.length <= (o.linhas || 3) && q.linhas.length * t * lh <= cx.h;
      if (ok) { melhor = { t, linhas: q.linhas }; lo = t; } else hi = t;
    }
    if (!melhor) return 0;
    ctx.font = fonte(melhor.t);
    ctx.fillStyle = o.cor;
    ctx.textBaseline = 'middle';
    ctx.textAlign = o.alinhar || 'left';
    const altura = melhor.linhas.length * melhor.t * lh;
    const y0 = o.vertical === 'topo' ? cx.y : o.vertical === 'base' ? cx.y + cx.h - altura : cx.y + (cx.h - altura) / 2;
    const x = o.alinhar === 'center' ? cx.x + cx.w / 2 : o.alinhar === 'right' ? cx.x + cx.w : cx.x;
    melhor.linhas.forEach((l, i) => ctx.fillText(l, x, y0 + (i + 0.5) * melhor.t * lh));
    return melhor.t;
  }

  function conter(ctx, img, cx) {
    if (!img) return 0;
    const e = Math.min(cx.w / img.naturalWidth, cx.h / img.naturalHeight);
    const w = img.naturalWidth * e, h = img.naturalHeight * e;
    ctx.drawImage(img, cx.x + (cx.w - w) / 2, cx.y + (cx.h - h) / 2, w, h);
    return img.naturalWidth / (w / 25.4); // ppi no tamanho final
  }

  function grade(n, cx, vao, proporcao) {
    let melhor = null;
    for (let c = 1; c <= n; c++) {
      const l = Math.ceil(n / c);
      const cw = (cx.w - vao * (c - 1)) / c, ch = (cx.h - vao * (l - 1)) / l;
      const nota = Math.min(cw, ch * proporcao);
      if (cw > 0 && ch > 0 && (!melhor || nota > melhor.nota)) melhor = { c, l, cw, ch, nota };
    }
    if (!melhor) return [];
    const cw = Math.min(melhor.cw, melhor.ch * proporcao * 1.25);
    const celulas = [];
    for (let i = 0; i < n; i++) {
      const lin = Math.floor(i / melhor.c), col = i % melhor.c;
      const naLinha = lin === melhor.l - 1 ? n - lin * melhor.c : melhor.c;
      const larg = naLinha * cw + (naLinha - 1) * vao;
      celulas.push({ x: cx.x + (cx.w - larg) / 2 + col * (cw + vao), y: cx.y + lin * (melhor.ch + vao), w: cw, h: melhor.ch });
    }
    return celulas;
  }

  /* ---------- composição ---------- */
  function compor(ctx, peca, st, at) {
    const cl = at.cluster, camp = st.campanha;
    const w = peca.w, h = peca.h, b = peca.sangria, m = peca.seguranca;
    const S = Math.min(w, h), o = IAG.orientacao(w, h);
    const empilha = o === 'tall' || o === 'portrait' || o === 'square';
    const C = cl.cores, raio = (cl.raio == null ? 0.3 : cl.raio);
    const rel = { formato: o, avisos: [], kvPpi: null, legalPt: null, tituloPt: null, logoPpi: null };
    const pt = (mm) => (mm * 72) / 25.4;

    // fundo até a sangria
    ctx.fillStyle = C.fundo;
    ctx.fillRect(-b, -b, w + 2 * b, h + 2 * b);

    // divisão KV / painel
    const fracao = { tall: 0.4, portrait: 0.48, square: 0.46, landscape: 0.5, wide: 0.3 }[o];
    const corte = empilha ? h * fracao : w * fracao;
    const amp = cl.forma === 'reta' ? 0 : empilha ? Math.min(h * 0.035, w * 0.09) : Math.min(w * 0.03, h * 0.09);

    // KV (cobre a área, respeitando o ponto focal)
    const hero = empilha ? { x: -b, y: -b, w: w + 2 * b, h: corte + amp + b } : { x: -b, y: -b, w: corte + amp + b, h: h + 2 * b };
    ctx.save();
    ctx.beginPath(); ctx.rect(hero.x, hero.y, hero.w, hero.h); ctx.clip();
    if (at.kv) {
      const iw = at.kv.naturalWidth, ih = at.kv.naturalHeight;
      const e = Math.max(hero.w / iw, hero.h / ih);
      const dw = iw * e, dh = ih * e;
      const f = camp.foco || { x: 0.5, y: 0.5 };
      ctx.drawImage(at.kv, hero.x + (hero.w - dw) * f.x, hero.y + (hero.h - dh) * f.y, dw, dh);
      rel.kvPpi = iw / (dw / 25.4);
    } else {
      const g = ctx.createLinearGradient(hero.x, hero.y, hero.x + hero.w, hero.y + hero.h);
      g.addColorStop(0, C.primaria); g.addColorStop(1, C.secundaria);
      ctx.fillStyle = g; ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
      texto(ctx, 'Insira o KV', { x: hero.x + hero.w * 0.15, y: hero.y + hero.h * 0.4, w: hero.w * 0.7, h: hero.h * 0.2 },
        { familia: cl.fontes.titulo, peso: 700, cor: alfa(sobre(C.primaria), 0.7), alinhar: 'center', linhas: 1 });
      rel.avisos.push('KV não inserido.');
    }
    ctx.restore();

    // painel com a forma do cluster (reta, curva ou diagonal)
    const borda = new Path2D(), painel = new Path2D();
    if (empilha) {
      const y0 = cl.forma === 'diagonal' ? corte + amp : corte + amp, y1 = cl.forma === 'diagonal' ? corte - amp : corte + amp;
      borda.moveTo(-b, y0);
      if (cl.forma === 'curva') borda.quadraticCurveTo(w / 2, corte - amp, w + b, y1); else borda.lineTo(w + b, y1);
      painel.addPath(borda); painel.lineTo(w + b, h + b); painel.lineTo(-b, h + b); painel.closePath();
    } else {
      const x0 = corte + amp, x1 = cl.forma === 'diagonal' ? corte - amp : corte + amp;
      borda.moveTo(x0, -b);
      if (cl.forma === 'curva') borda.quadraticCurveTo(corte - amp, h / 2, x1, h + b); else borda.lineTo(x1, h + b);
      painel.addPath(borda); painel.lineTo(w + b, h + b); painel.lineTo(w + b, -b); painel.closePath();
    }
    ctx.fillStyle = C.fundo; ctx.fill(painel);
    ctx.strokeStyle = C.secundaria; ctx.lineWidth = S * 0.012; ctx.stroke(borda);

    // logo do shopping sobre o KV
    const chipH = S * (o === 'wide' ? 0.16 : 0.085);
    if (at.logoShopping || st.shopping.nome) {
      const pad = chipH * 0.18;
      let cw = chipH * 2.4;
      if (at.logoShopping) cw = Math.min(chipH * 3, Math.max(chipH, (chipH - 2 * pad) * (at.logoShopping.naturalWidth / at.logoShopping.naturalHeight) + 2 * pad));
      const maxW = (empilha ? w : corte) - 2 * m;
      cw = Math.min(cw, maxW);
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      caixaArredondada(ctx, m, m, cw, chipH, chipH * raio * 0.5); ctx.fill();
      const dentro = { x: m + pad, y: m + pad, w: cw - 2 * pad, h: chipH - 2 * pad };
      if (at.logoShopping) rel.logoPpi = conter(ctx, at.logoShopping, dentro);
      else texto(ctx, st.shopping.nome, dentro, { familia: cl.fontes.titulo, peso: 700, cor: '#111111', alinhar: 'center', linhas: 2 });
    }

    // área útil do painel (dentro da margem de segurança)
    const pad = S * 0.035;
    const A = empilha
      ? { x: m, y: corte + amp + pad, w: w - 2 * m, h: h - m - (corte + amp + pad) }
      : { x: corte + amp + pad, y: m, w: w - m - (corte + amp + pad), h: h - 2 * m };
    if (A.w <= 0 || A.h <= 0) { rel.avisos.push('Margem de segurança grande demais para este formato.'); return rel; }
    const vao = Math.min(A.w, A.h) * 0.045;
    const alinhar = cl.alinhamento === 'center' ? 'center' : 'left';

    // faixas: legal embaixo, depois marcas, prêmios e texto
    let base = A.y + A.h;
    if (camp.legal) {
      const lh = Math.max(A.h * (o === 'wide' ? 0.12 : 0.075), Math.min(A.h * 0.12, 6));
      const cx = { x: A.x, y: base - lh, w: A.w, h: lh };
      const t = texto(ctx, camp.legal, cx, { familia: cl.fontes.texto, peso: 400, cor: alfa(legivel(C.texto, C.fundo, 4.5), 0.9), linhas: 5, lh: 1.2, alinhar, vertical: 'base' });
      rel.legalPt = pt(t);
      base -= lh + vao * 0.6;
    }
    let txt, premiosCx, marcasCx;
    const temPremios = at.premios.length > 0, temMarcas = at.marcas.length > 0;
    if (o === 'wide') {
      const colTxt = temPremios || temMarcas ? A.w * 0.52 : A.w;
      txt = { x: A.x, y: A.y, w: colTxt - vao, h: base - A.y };
      const dir = { x: A.x + colTxt, y: A.y, w: A.w - colTxt, h: base - A.y };
      const hm = temMarcas ? (temPremios ? dir.h * 0.34 : dir.h * 0.6) : 0;
      if (temMarcas) marcasCx = { x: dir.x, y: dir.y + dir.h - hm, w: dir.w, h: hm };
      if (temPremios) premiosCx = { x: dir.x, y: dir.y, w: dir.w, h: dir.h - hm - (temMarcas ? vao : 0) };
    } else {
      const util = base - A.y;
      if (temMarcas) { const hm = util * 0.15; marcasCx = { x: A.x, y: base - hm, w: A.w, h: hm }; base -= hm + vao; }
      if (temPremios) { const hp = util * (o === 'tall' ? 0.3 : 0.33); premiosCx = { x: A.x, y: base - hp, w: A.w, h: hp }; base -= hp + vao; }
      txt = { x: A.x, y: A.y, w: A.w, h: base - A.y };
    }

    // bloco de texto: título, chamada, período (pílula) e CTA
    const partes = [];
    if (camp.titulo) partes.push(['titulo', 0.5]);
    if (camp.chamada) partes.push(['chamada', 0.27]);
    if (camp.periodo || camp.cta) partes.push(['rodape', 0.2]);
    const soma = partes.reduce((a, p) => a + p[1], 0) || 1;
    const vt = txt.h * 0.04;
    let y = txt.y;
    const utilTxt = txt.h - vt * Math.max(0, partes.length - 1);
    for (const [tipo, peso] of partes) {
      const cx = { x: txt.x, y, w: txt.w, h: (utilTxt * peso) / soma };
      if (tipo === 'titulo') {
        const t = texto(ctx, camp.titulo, cx, { familia: cl.fontes.titulo, peso: 800, cor: legivel(C.primaria, C.fundo, 3), linhas: o === 'tall' ? 4 : 3, lh: 1.02, alinhar, caixaAlta: cl.caixaAlta, vertical: 'base' });
        rel.tituloPt = pt(t);
      } else if (tipo === 'chamada') {
        texto(ctx, camp.chamada, cx, { familia: cl.fontes.texto, peso: 400, cor: legivel(C.texto, C.fundo, 4.5), linhas: 4, lh: 1.22, alinhar, vertical: 'topo', max: (rel.tituloPt ? (rel.tituloPt * 25.4) / 72 : cx.h) * 0.62 });
      } else {
        const emLinha = camp.periodo && camp.cta && cx.w / cx.h > 9;
        const ph = emLinha || !(camp.periodo && camp.cta) ? cx.h : cx.h * 0.52;
        if (camp.periodo) {
          const corpo = ph * 0.48;
          ctx.font = '700 ' + corpo + 'px "' + cl.fontes.texto + '", Arial, sans-serif';
          const pw = Math.min(emLinha ? cx.w * 0.55 : cx.w, ctx.measureText(camp.periodo).width + ph * 0.9);
          const px = alinhar === 'center' && !emLinha ? cx.x + (cx.w - pw) / 2 : cx.x;
          ctx.fillStyle = C.acento;
          caixaArredondada(ctx, px, cx.y, pw, ph, ph * raio); ctx.fill();
          texto(ctx, camp.periodo, { x: px + ph * 0.3, y: cx.y + ph * 0.18, w: pw - ph * 0.6, h: ph * 0.64 }, { familia: cl.fontes.texto, peso: 700, cor: sobre(C.acento), alinhar: 'center', linhas: 1 });
          if (camp.cta && emLinha) texto(ctx, camp.cta, { x: px + pw + vao, y: cx.y, w: cx.w - pw - vao, h: ph }, { familia: cl.fontes.texto, peso: 600, cor: legivel(C.secundaria, C.fundo, 3), linhas: 2, max: corpo });
        }
        if (camp.cta && !(camp.periodo && emLinha)) {
          const cy = camp.periodo ? cx.y + ph + cx.h * 0.08 : cx.y;
          texto(ctx, camp.cta, { x: cx.x, y: cy, w: cx.w, h: cx.y + cx.h - cy }, { familia: cl.fontes.texto, peso: 600, cor: legivel(C.secundaria, C.fundo, 3), linhas: 2, alinhar, vertical: 'topo' });
        }
      }
      y += cx.h + vt;
    }
    if (!camp.titulo) rel.avisos.push('Título da campanha vazio.');

    // prêmios
    if (premiosCx) {
      let menor = Infinity;
      grade(at.premios.length, premiosCx, vao * 0.7, 1).forEach((c, i) => {
        const p = at.premios[i];
        ctx.fillStyle = 'rgba(255,255,255,0.96)';
        caixaArredondada(ctx, c.x, c.y, c.w, c.h, Math.min(c.w, c.h) * raio * 0.35); ctx.fill();
        ctx.strokeStyle = alfa(C.secundaria, 0.55); ctx.lineWidth = S * 0.003; ctx.stroke();
        const pi = Math.min(c.w, c.h) * 0.08;
        const hl = p.legenda ? c.h * 0.22 : 0;
        if (p.img) menor = Math.min(menor, conter(ctx, p.img, { x: c.x + pi, y: c.y + pi, w: c.w - 2 * pi, h: c.h - 2 * pi - hl }));
        if (p.legenda) texto(ctx, p.legenda, { x: c.x + pi, y: c.y + c.h - hl - pi * 0.5, w: c.w - 2 * pi, h: hl }, { familia: cl.fontes.texto, peso: 600, cor: '#1a1a1a', alinhar: 'center', linhas: 2 });
      });
      if (menor !== Infinity) rel.premioPpi = menor;
    }

    // régua de marcas (fundo branco: logos costumam ser desenhadas para ele)
    if (marcasCx) {
      ctx.fillStyle = '#ffffff';
      caixaArredondada(ctx, marcasCx.x, marcasCx.y, marcasCx.w, marcasCx.h, marcasCx.h * raio * 0.4); ctx.fill();
      const n = at.marcas.length, pi = marcasCx.h * 0.16;
      const cw = Math.min((marcasCx.w - 2 * pi) / n, marcasCx.h * 2.6);
      const x0 = marcasCx.x + (marcasCx.w - cw * n) / 2;
      let menor = Infinity;
      at.marcas.forEach((mk, i) => {
        const cx = { x: x0 + i * cw + pi * 0.6, y: marcasCx.y + pi, w: cw - pi * 1.2, h: marcasCx.h - 2 * pi };
        if (mk.img) menor = Math.min(menor, conter(ctx, mk.img, cx));
        else if (mk.nome) texto(ctx, mk.nome, cx, { familia: cl.fontes.texto, peso: 700, cor: '#1a1a1a', alinhar: 'center', linhas: 2 });
      });
      if (menor !== Infinity) rel.marcaPpi = menor;
    }
    return rel;
  }

  /* ---------- API ---------- */
  IAG.ativos = async (st) => {
    const cluster = st.clusters.find((c) => c.id === st.clusterId) || st.clusters[0];
    const c = st.campanha;
    const [kv, logoShopping] = await Promise.all([IAG.carregarImagem(c.kv), IAG.carregarImagem(st.shopping.logo)]);
    const premios = await Promise.all(c.premios.map(async (p) => ({ ...p, img: await IAG.carregarImagem(p.img) })));
    const marcas = await Promise.all(c.marcas.map(async (p) => ({ ...p, img: await IAG.carregarImagem(p.img) })));
    const fontesFaltando = await garantirFontes(cluster);
    return { cluster, kv, logoShopping, premios, marcas, fontesFaltando };
  };

  /* Renderiza a arte (corte + sangria) num canvas. pxPorMm define a resolução. */
  IAG.renderizarArte = (peca, st, at, pxPorMm) => {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round((peca.w + 2 * peca.sangria) * pxPorMm));
    cv.height = Math.max(1, Math.round((peca.h + 2 * peca.sangria) * pxPorMm));
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.scale(cv.width / (peca.w + 2 * peca.sangria), cv.height / (peca.h + 2 * peca.sangria));
    ctx.translate(peca.sangria, peca.sangria);
    const relatorio = compor(ctx, peca, st, at);
    if (at.fontesFaltando.length) relatorio.avisos.push('Fonte não carregada (usando substituta): ' + at.fontesFaltando.join(', ') + '.');
    return { canvas: cv, relatorio };
  };

  /* Resolução efetiva de exportação, respeitando limites do navegador. */
  IAG.LIMITE_LADO = 12000;
  IAG.LIMITE_AREA = 60e6;
  IAG.dpiEfetivo = (peca, alvo) => {
    const wp = (peca.w + 2 * peca.sangria) / 25.4, hp = (peca.h + 2 * peca.sangria) / 25.4;
    return Math.min(alvo, IAG.LIMITE_LADO / Math.max(wp, hp), Math.sqrt(IAG.LIMITE_AREA / (wp * hp)));
  };
})();
</script>
<script>
/* IAgencia — interface, estado e exportação. */
(function () {
  const IAG = window.IAG;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const num = (v) => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; };
  const fmt = (v, d) => v.toLocaleString('pt-BR', { maximumFractionDigits: d == null ? 1 : d });

  /* ---------- dados iniciais ---------- */
  // Cores, fontes e formas abaixo são PROPOSTAS de partida (status "rascunho").
  // Personas e conceito ficam como [FALTA] até o marketing preencher.
  const novoCluster = (nome, cores, fontes, extra) => Object.assign({
    id: uid(), nome, status: 'rascunho',
    conceito: '[FALTA: conceito da linha criativa do cluster]',
    tom: '[FALTA: tom de voz]',
    palavras: '',
    personas: [{ id: uid(), nome: '[FALTA: persona]', descricao: '[FALTA: descrição validada pelo marketing]' }],
    cores, fontes, forma: 'reta', raio: 0.3, caixaAlta: false, alinhamento: 'left',
  }, extra || {});

  const estadoInicial = () => {
    const clusters = [
      novoCluster('Sofisticados', { fundo: '#F6F1E7', primaria: '#1F2A2E', secundaria: '#B08D57', acento: '#7A1F2B', texto: '#2A2A2A' }, { titulo: 'Playfair Display', texto: 'Inter' }, { forma: 'reta', raio: 0.08 }),
      novoCluster('Compactos de Alto Padrão', { fundo: '#FFFFFF', primaria: '#14342B', secundaria: '#C9A66B', acento: '#E4572E', texto: '#22302B' }, { titulo: 'DM Serif Display', texto: 'Poppins' }, { forma: 'curva', raio: 0.5 }),
      novoCluster('Modelo (renomeie)', { fundo: '#FFF7EC', primaria: '#5B2A86', secundaria: '#FF8A00', acento: '#E6007E', texto: '#2B1B3D' }, { titulo: 'Montserrat', texto: 'Nunito' }, { forma: 'diagonal', raio: 1, caixaAlta: true }),
    ];
    return {
      versao: 1, clusters, clusterId: clusters[0].id,
      shopping: { nome: '', logo: '' },
      campanha: { titulo: '', chamada: '', periodo: '', cta: '', legal: '', kv: '', foco: { x: 0.5, y: 0.5 }, premios: [], marcas: [] },
      pecas: [peca('Cartaz A3', 297, 420, 3)],
      opcoes: { dpi: 150, guias: true },
    };
  };

  function peca(nome, w, h, sangria, extra) {
    return Object.assign({ id: uid(), nome, w, h, sangria, seguranca: Math.max(5, Math.round(Math.min(w, h) * 0.04)), qtd: 1, material: '', obs: '', escala: 0 }, extra || {});
  }

  // A3/A4 seguem a ISO 216. Os demais são exemplos editáveis, não padrões:
  // medida e sangria finais são sempre as que a gráfica pedir.
  const PREDEFINIDOS = [
    ['Cartaz A4 (ISO 216)', 210, 297, 3], ['Cartaz A3 (ISO 216)', 297, 420, 3],
    ['Banner vertical 80 × 120 cm (exemplo)', 800, 1200, 20], ['Totem 60 × 180 cm (exemplo)', 600, 1800, 20],
    ['Adesivo de piso 100 × 100 cm (exemplo)', 1000, 1000, 10], ['Faixa 300 × 80 cm (exemplo)', 3000, 800, 30],
    ['Painel 200 × 100 cm (exemplo)', 2000, 1000, 20], ['Display de mesa 10 × 15 cm (exemplo)', 100, 150, 3],
  ];

  let st = estadoInicial();
  let aba = 'cluster';
  let pecaId = null;
  const cluster = () => st.clusters.find((c) => c.id === st.clusterId) || st.clusters[0];

  /* ---------- persistência (IndexedDB: guarda as imagens em alta) ---------- */
  const banco = () => new Promise((res, rej) => {
    const r = indexedDB.open('iagencia', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function ler() {
    try {
      const db = await banco();
      return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get('estado'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
    } catch (e) { return null; }
  }
  let tSalvar;
  function salvar() {
    clearTimeout(tSalvar);
    tSalvar = setTimeout(async () => {
      try { const db = await banco(); db.transaction('kv', 'readwrite').objectStore('kv').put(st, 'estado'); } catch (e) { aviso('Não consegui salvar neste navegador: ' + e.message); }
    }, 400);
  }

  /* ---------- utilidades de UI ---------- */
  function aviso(msg) { const el = $('#status'); el.textContent = msg; clearTimeout(aviso.t); aviso.t = setTimeout(() => (el.textContent = ''), 6000); }
  const medida = (p) => {
    const g = Math.max(p.w, p.h) >= 1000;
    return g ? fmt(p.w / 1000, 2) + ' × ' + fmt(p.h / 1000, 2) + ' m' : fmt(p.w / 10) + ' × ' + fmt(p.h / 10) + ' cm';
  };
  const baixar = (dados, nome, tipo) => {
    const url = URL.createObjectURL(dados instanceof Blob ? dados : new Blob([dados], { type: tipo }));
    const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  const slug = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'peca';
  const lerArquivo = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
  const campo = (rot, html, cls) => '<label class="campo ' + (cls || '') + '"><span>' + rot + '</span>' + html + '</label>';
  const entrada = (caminho, valor, extra) => '<input data-bind="' + caminho + '" value="' + esc(valor) + '" ' + (extra || '') + '>';
  const area = (caminho, valor, linhas) => '<textarea data-bind="' + caminho + '" rows="' + (linhas || 2) + '">' + esc(valor) + '</textarea>';

  /* ---------- abas ---------- */

  const TELAS = { cluster: telaCluster, campanha: telaCampanha, pecas: telaPecas, entrega: telaEntrega };

  function desenhar() {
    if (!st.pecas.some((p) => p.id === pecaId)) pecaId = st.pecas[0] ? st.pecas[0].id : null;
    $('#abas').innerHTML = ABAS.map(([k, r]) => '<button data-aba="' + k + '" class="' + (k === aba ? 'ativa' : '') + '">' + r + '</button>').join('');
    $('#painel').innerHTML = TELAS[aba]();
    $('#qual-peca').innerHTML = st.pecas.map((p) => '<option value="' + p.id + '"' + (p.id === pecaId ? ' selected' : '') + '>' + esc(p.nome) + ' — ' + medida(p) + '</option>').join('');
    $('#guias').checked = st.opcoes.guias;
    $('#cab-cluster').textContent = cluster().nome + (st.shopping.nome ? ' · ' + st.shopping.nome : '');
    previa();
  }

  /* ---------- prévia ---------- */
  let tPrevia, seq = 0;
  function previa() { clearTimeout(tPrevia); tPrevia = setTimeout(desenharPrevia, 120); }

  async function desenharPrevia() {
    const meu = ++seq;
    const cv = $('#previa'), rel = $('#relatorio');
    const p = st.pecas.find((x) => x.id === pecaId);
    if (!p || !(p.w > 0 && p.h > 0)) { cv.width = cv.height = 0; rel.innerHTML = '<li>Adicione uma peça na aba Peças.</li>'; return; }
    const at = await IAG.ativos(st);
    if (meu !== seq) return;
    const b = p.sangria, borda = Math.max(b * 1.2, Math.max(p.w, p.h) * 0.03) + b;
    const totalW = p.w + 2 * borda, totalH = p.h + 2 * borda;
    const caixa = $('#palco').getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const esc2 = Math.min((caixa.width - 24) / totalW, (Math.max(320, window.innerHeight - 250)) / totalH);
    const { canvas, relatorio } = IAG.renderizarArte(p, st, at, esc2 * dpr);
    if (meu !== seq) return;
    cv.width = Math.round(totalW * esc2 * dpr); cv.height = Math.round(totalH * esc2 * dpr);
    cv.style.width = cv.width / dpr + 'px'; cv.style.height = cv.height / dpr + 'px';
    const ctx = cv.getContext('2d');
    const k = esc2 * dpr, o = borda * k;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(canvas, o - b * k, o - b * k, (p.w + 2 * b) * k, (p.h + 2 * b) * k);
    if (st.opcoes.guias) {
      // marcas de corte
      const r = (b + (borda - b) * 0.15) * k, m = (borda - b) * 0.7 * k;
      ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1, dpr * 0.75);
      const L = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
      for (const x of [o, o + p.w * k]) { L(x, o - r, x, o - r - m); L(x, o + p.h * k + r, x, o + p.h * k + r + m); }
      for (const y of [o, o + p.h * k]) { L(o - r, y, o - r - m, y); L(o + p.w * k + r, y, o + p.w * k + r + m, y); }
      // corte (magenta) e segurança (ciano)
      ctx.setLineDash([6 * dpr, 4 * dpr]);
      ctx.strokeStyle = '#e6007e'; ctx.strokeRect(o, o, p.w * k, p.h * k);
      ctx.strokeStyle = '#00a0c6'; ctx.strokeRect(o + p.seguranca * k, o + p.seguranca * k, (p.w - 2 * p.seguranca) * k, (p.h - 2 * p.seguranca) * k);
      ctx.setLineDash([]);
    }
    rel.innerHTML = revisao(p, relatorio).map(([t, msg]) => '<li class="' + t + '">' + msg + '</li>').join('');
    const info = $('#kvinfo');
    if (info && at.kv) info.textContent = 'Arquivo: ' + at.kv.naturalWidth + ' × ' + at.kv.naturalHeight + ' px.';
  }

  // Limiares da revisão são regras práticas deste app, não norma: 100 ppi para
  // imagem vista de perto e 6 pt para texto legal. A gráfica dá a palavra final.
  function revisao(p, r) {
    const itens = [['info', 'Formato ' + IAG.NOME_FORMATO[r.formato] + ' · ' + medida(p) + ' · sangria ' + fmt(p.sangria) + ' mm']];
    const ppi = (rot, v) => { if (v != null) itens.push([v < 100 ? 'ruim' : 'ok', rot + ' sai a ' + fmt(v, 0) + ' ppi no tamanho final' + (v < 100 ? ' — baixa para leitura de perto; peça o arquivo em maior resolução' : '')]); };
    ppi('KV', r.kvPpi); ppi('Prêmio com menor resolução', r.premioPpi); ppi('Logo de marca com menor resolução', r.marcaPpi); ppi('Logo do shopping', r.logoPpi);
    if (r.legalPt != null) itens.push([r.legalPt < 6 ? 'ruim' : 'ok', 'Texto legal com corpo ' + fmt(r.legalPt, 1) + ' pt' + (r.legalPt < 6 ? ' — confira a legibilidade ou encurte o texto' : '')]);
    else if (!st.campanha.legal) itens.push(['ruim', 'Sem texto legal.']);
    if (p.sangria <= 0) itens.push(['ruim', 'Peça sem sangria.']);
    r.avisos.forEach((a) => itens.push(['ruim', a]));
    return itens;
  }

  /* ---------- exportação ---------- */
  const jpegDe = (canvas) => new Promise((res, rej) => canvas.toBlob(async (b) => (b ? res(new Uint8Array(await b.arrayBuffer())) : rej(new Error('o navegador não conseguiu gerar a imagem neste tamanho'))), 'image/jpeg', 0.93));

  async function pagina(p, at) {
    const dpi = IAG.dpiEfetivo(p, st.opcoes.dpi);
    const { canvas } = IAG.renderizarArte(p, st, at, dpi / 25.4);
    const escala = p.escala || IAG.pdf.escalaMinima(p);
    const jpeg = await jpegDe(canvas);
    const legenda = [st.shopping.nome, p.nome, fmt(p.w) + ' x ' + fmt(p.h) + ' mm', 'sangria ' + fmt(p.sangria) + ' mm', 'escala 1:' + escala, Math.round(dpi) + ' dpi', 'RGB', p.qtd + ' un.', p.material].filter(Boolean).join(' | ');
    const pg = { w: p.w, h: p.h, sangria: p.sangria, escala, jpeg, imgW: canvas.width, imgH: canvas.height, legenda };
    canvas.width = canvas.height = 0;
    return pg;
  }

  async function exportarPdf(pecas, nome) {
    try {
      const at = await IAG.ativos(st), paginas = [];
      for (let i = 0; i < pecas.length; i++) {
        aviso('Gerando ' + (i + 1) + ' de ' + pecas.length + ': ' + pecas[i].nome + '…');
        await new Promise((r) => setTimeout(r, 30));
        paginas.push(await pagina(pecas[i], at));
      }
      baixar(IAG.pdf.montar(paginas), nome, 'application/pdf');
      aviso('PDF gerado: ' + nome);
    } catch (e) { aviso('Falha ao gerar o PDF: ' + e.message); }
  }

  async function exportarPng(p) {
    const at = await IAG.ativos(st);
    const { canvas } = IAG.renderizarArte({ ...p, sangria: 0 }, st, at, IAG.dpiEfetivo(p, st.opcoes.dpi) / 25.4);
    canvas.toBlob((b) => (b ? baixar(b, slug(p.nome) + '.png') : aviso('Falha ao gerar o PNG.')), 'image/png');
  }

  function exportarCsv() {
    const cab = ['Peça', 'Largura (mm)', 'Altura (mm)', 'Sangria (mm)', 'Segurança (mm)', 'Qtd.', 'Material / acabamento', 'Observações', 'Escala do PDF', 'dpi de saída'];
    const linhas = st.pecas.map((p) => [p.nome, p.w, p.h, p.sangria, p.seguranca, p.qtd, p.material, p.obs, '1:' + (p.escala || IAG.pdf.escalaMinima(p)), Math.round(IAG.dpiEfetivo(p, st.opcoes.dpi))]);
    const csv = [cab].concat(linhas).map((l) => l.map((v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    baixar('﻿' + csv, 'ficha-de-producao.csv', 'text/csv;charset=utf-8');
  }

  /* ---------- exemplo fictício (gera imagens no próprio navegador) ---------- */
  function exemplo() {
    const c = cluster().cores;
    const tela = (w, h, fn) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; fn(cv.getContext('2d'), w, h); return cv.toDataURL('image/png'); };
    const kv = tela(2400, 2400, (x, w, h) => {
      const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, c.primaria); g.addColorStop(1, c.acento); x.fillStyle = g; x.fillRect(0, 0, w, h);
      for (let i = 0; i < 28; i++) { x.fillStyle = i % 2 ? c.secundaria : '#ffffff'; x.globalAlpha = 0.12 + (i % 5) * 0.05; x.beginPath(); x.arc((i * 733) % w, (i * 419) % h, 60 + ((i * 97) % 260), 0, 7); x.fill(); }
      x.globalAlpha = 1; x.fillStyle = c.secundaria; x.fillRect(w * 0.36, h * 0.44, w * 0.28, h * 0.26); x.fillStyle = '#ffffff'; x.fillRect(w * 0.485, h * 0.38, w * 0.03, h * 0.32); x.fillRect(w * 0.33, h * 0.4, w * 0.34, h * 0.06);
      x.font = '700 90px sans-serif'; x.textAlign = 'center'; x.fillText('KV DE EXEMPLO', w / 2, h * 0.85);
    });
    const item = (rot, cor) => tela(600, 600, (x, w, h) => { x.fillStyle = cor; x.beginPath(); x.arc(w / 2, h / 2, w * 0.42, 0, 7); x.fill(); x.fillStyle = '#fff'; x.font = '700 80px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(rot, w / 2, h / 2); });
    const logo = (rot) => tela(600, 240, (x, w, h) => { x.fillStyle = '#111'; x.font = '800 96px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(rot, w / 2, h / 2); });
    st.shopping.nome = st.shopping.nome || 'Shopping Exemplo';
    Object.assign(st.campanha, {
      titulo: 'Título da campanha', chamada: '[FALTA: mecânica da promoção]', periodo: '[FALTA: período]', cta: '[FALTA: como participar]',
      legal: 'Certificado de Autorização nº [FALTA: número]. Consulte o regulamento em [FALTA: endereço]. Imagens meramente ilustrativas.',
      kv, foco: { x: 0.5, y: 0.5 },
      premios: [1, 2, 3].map((i) => ({ id: uid(), img: item('P' + i, [c.primaria, c.acento, c.secundaria][i - 1]), legenda: 'Prêmio ' + i })),
      marcas: ['MARCA A', 'MARCA B', 'MARCA C', 'MARCA D'].map((n) => ({ id: uid(), img: logo(n), nome: n })),
    });
  }

  /* ---------- eventos ---------- */
  function resolver(caminho) {
    const partes = caminho.split('.');
    let alvo = partes[0] === 'cluster' ? cluster() : st[partes[0]];
    for (let i = 1; i < partes.length - 1; i++) alvo = alvo[partes[i]];
    return [alvo, partes[partes.length - 1]];
  }

  document.addEventListener('input', (e) => {
    const el = e.target, caminho = el.dataset.bind;
    if (!caminho) return;
    const [alvo, chave] = resolver(caminho);
    alvo[chave] = el.type === 'checkbox' ? el.checked : 'num' in el.dataset ? num(el.value) : el.value;
    if (caminho.startsWith('cluster.cores.')) {
      const hex = $('[data-hex="' + chave + '"]'); if (hex) hex.textContent = el.value;
    }
    salvar();
    if ('redesenha' in el.dataset) desenhar(); else previa();
  });

  document.addEventListener('change', async (e) => {
    const el = e.target;
    if (el.id === 'qual-peca') { pecaId = el.value; desenhar(); return; }
    if (el.id === 'guias') { st.opcoes.guias = el.checked; salvar(); previa(); return; }
    if (el.dataset.bind && (el.type === 'color' || /^pecas\.\d+\.(w|h)$/.test(el.dataset.bind) || el.dataset.bind === 'cluster.nome')) { desenhar(); return; }
    if (el.name === 'modelo' && el.value !== '') {
      const [nome, w, h, s] = PREDEFINIDOS[+el.value], f = el.form;
      f.nome.value = nome.replace(/ \((exemplo|ISO 216)\)/, ''); f.un.value = '10'; f.w.value = fmt(w / 10); f.h.value = fmt(h / 10); f.sangria.value = s;
      return;
    }
    if (el.dataset.acao === 'trocar-cluster') { st.clusterId = el.value; salvar(); desenhar(); return; }
    if (el.type !== 'file' || !el.files.length) return;
    try {
      if (el.dataset.arquivo) { const [alvo, chave] = resolver(el.dataset.arquivo); alvo[chave] = await lerArquivo(el.files[0]); }
      else if (el.dataset.arquivos) {
        for (const f of el.files) {
          const img = await lerArquivo(f), nome = f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
          st.campanha[el.dataset.arquivos].push(el.dataset.arquivos === 'premios' ? { id: uid(), img, legenda: '' } : { id: uid(), img, nome });
        }
      } else if (el.dataset.acao === 'importar-cluster') {
        const c = JSON.parse(await el.files[0].text());
        if (!c.cores || !c.fontes || !c.nome) throw new Error('arquivo não é um guia de cluster');
        c.id = uid(); c.personas = c.personas || []; st.clusters.push(c); st.clusterId = c.id;
      } else if (el.dataset.acao === 'importar-pedido') {
        const p = JSON.parse(await el.files[0].text());
        if (!p.clusters || !p.campanha || !p.pecas) throw new Error('arquivo não é um pedido do IAgencia');
        if (!confirm('Abrir este pedido substitui o trabalho atual neste navegador. Continuar?')) return;
        st = Object.assign(estadoInicial(), p);
      }
      salvar(); desenhar();
    } catch (err) { aviso('Não consegui ler o arquivo: ' + err.message); }
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'nova-peca') return;
    e.preventDefault();
    const f = e.target, un = num(f.un.value), w = num(f.w.value) * un, h = num(f.h.value) * un;
    if (!(w > 0 && h > 0)) { aviso('Informe largura e altura maiores que zero.'); return; }
    const p = peca(f.nome.value.trim(), w, h, Math.max(0, num(f.sangria.value)), { qtd: Math.max(1, Math.round(num(f.qtd.value)) || 1), material: f.material.value.trim(), obs: f.obs.value.trim() });
    if (f.seguranca.value.trim()) p.seguranca = Math.max(0, num(f.seguranca.value));
    st.pecas.push(p); pecaId = p.id; salvar(); desenhar();
  });

  document.addEventListener('click', (e) => {
    const abaEl = e.target.closest('[data-aba]');
    if (abaEl) { aba = abaEl.dataset.aba; desenhar(); return; }
    const el = e.target.closest('[data-acao]');
    if (!el || el.tagName === 'SELECT' || el.type === 'file') return;
    const a = el.dataset.acao;
    if (a === 'selecionar') { if (e.target.closest('input,button,select,textarea')) return; pecaId = el.dataset.id; desenhar(); return; }
    if (a === 'foco') {
      const r = el.querySelector('img').getBoundingClientRect();
      st.campanha.foco = { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
    } else if (a === 'remover') {
      const [alvo, chave] = resolver(el.dataset.lista + '.x'); void chave;
      if (!confirm('Remover este item?')) return;
      alvo.splice(+el.dataset.i, 1);
    } else if (a === 'nova-persona') cluster().personas.push({ id: uid(), nome: '', descricao: '' });
    else if (a === 'novo-cluster') {
      const nome = prompt('Nome do novo cluster:'); if (!nome) return;
      const base = JSON.parse(JSON.stringify(cluster()));
      const c = novoCluster(nome.trim(), base.cores, base.fontes, { forma: base.forma, raio: base.raio, caixaAlta: base.caixaAlta, alinhamento: base.alinhamento });
      st.clusters.push(c); st.clusterId = c.id;
    } else if (a === 'excluir-cluster') {
      if (st.clusters.length < 2) { aviso('É preciso manter ao menos um cluster.'); return; }
      if (!confirm('Excluir o cluster "' + cluster().nome + '"?') || !confirm('Confirma de novo? O guia deste cluster será apagado deste navegador.')) return;
      st.clusters = st.clusters.filter((c) => c.id !== st.clusterId); st.clusterId = st.clusters[0].id;
    } else if (a === 'exportar-cluster') { baixar(JSON.stringify(cluster(), null, 2), 'guia-' + slug(cluster().nome) + '.json', 'application/json'); return; }
    else if (a === 'exportar-pedido') { baixar(JSON.stringify(st), 'pedido-' + slug(st.shopping.nome || 'shopping') + '.json', 'application/json'); return; }
    else if (a === 'exemplo') {
      const c = st.campanha;
      if ((c.kv || c.titulo || c.premios.length || c.marcas.length) && !confirm('Isso substitui KV, textos, prêmios e marcas atuais pelo exemplo. Continuar?')) return;
      exemplo();
    } else if (a === 'zerar') {
      if (!confirm('Apagar campanha, peças e guias deste navegador?') || !confirm('Confirma de novo? Não dá para desfazer.')) return;
      st = estadoInicial();
    } else if (a === 'pdf') { const p = st.pecas.find((x) => x.id === el.dataset.id); exportarPdf([p], slug(p.nome) + '.pdf'); return; }
    else if (a === 'png') { exportarPng(st.pecas.find((x) => x.id === el.dataset.id)); return; }
    else if (a === 'pdf-todas') { exportarPdf(st.pecas, 'desdobramentos-' + slug(st.shopping.nome || 'shopping') + '.pdf'); return; }
    else if (a === 'csv') { exportarCsv(); return; }
    else return;
    salvar(); desenhar();
  });

  window.addEventListener('resize', previa);

  (async function iniciar() {
    const salvo = await ler();
    if (salvo && salvo.clusters && salvo.clusters.length) st = Object.assign(estadoInicial(), salvo);
    desenhar();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(previa);
  })();

  IAG._estado = () => st; // para testes
})();
</script>
