    <line x1="66" y1="114" x2="114" y2="66" stroke-width="12"/>
    <line x1="53" y1="101" x2="79" y2="127" stroke-width="18"/>
    <line x1="101" y1="53" x2="127" y2="79" stroke-width="18"/>
