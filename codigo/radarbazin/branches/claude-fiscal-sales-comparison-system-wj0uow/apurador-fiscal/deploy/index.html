/* ===== src/parsers.js ===== */
/**
 * Parsers de livros fiscais. Tudo aqui é função pura sobre texto/linhas —
 * a leitura de arquivo (PDF, XLSX, OCR) fica em ingest.js, que só roda no browser.
 *
 * Saída padronizada: lista de LANCAMENTOS
 * {
 *   cnpj, empresa, ie, competencia:'AAAA-MM', livro:'entradas'|'saidas',
 *   cfop, cst, valorContabil, baseCalculo, icms, isentas, outras,
 *   origem:{ formato, arquivo, referencia }, confianca:'alta'|'media'|'baixa'
 * }
 */

/* ---------------------------------------------------------------- utilidades */

/** "1.234.567,89" | "1234567.89" | "1234,5" -> number. Retorna NaN se não parecer número. */
function numeroBR (bruto) {
  if (typeof bruto === 'number') return Number.isFinite(bruto) ? bruto : NaN
  if (bruto == null) return NaN
  let s = String(bruto).trim()
  if (!s) return NaN
  let negativo = false
  if (/^\(.*\)$/.test(s)) { negativo = true; s = s.slice(1, -1) }
  s = s.replace(/[R$\s ]/g, '')
  if (/^-/.test(s)) { negativo = true; s = s.slice(1) }
  if (!/^[\d.,]+$/.test(s)) return NaN
  const temVirgula = s.includes(',')
  const temPonto = s.includes('.')
  if (temVirgula && temPonto) {
    // o separador decimal é o último que aparece
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(',', '.')
      : s.replace(/,/g, '')
  } else if (temVirgula) {
    s = s.replace(/\./g, '').replace(',', '.')
  } else if (temPonto) {
    // "1.234" é milhar; "1.23" é decimal
    const partes = s.split('.')
    const ultimo = partes[partes.length - 1]
    s = (partes.length > 1 && ultimo.length === 3 && partes[0].length <= 3 && partes.every((p, i) => i === 0 || p.length === 3))
      ? partes.join('')
      : s
  }
  const n = Number(s)
  if (!Number.isFinite(n)) return NaN
  return negativo ? -n : n
}

/** Extrai só dígitos e valida tamanho de CNPJ (14) ou CPF (11). */
function normalizarCnpj (bruto) {
  if (bruto == null) return null
  const d = String(bruto).replace(/\D/g, '')
  if (d.length === 14 || d.length === 11) return d
  if (d.length > 0 && d.length < 14) return d.padStart(14, '0')
  return null
}

function formatarCnpj (d) {
  if (!d) return ''
  if (d.length === 14) return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12)}`
  if (d.length === 11) return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`
  return d
}

const MESES_PT = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 }

/**
 * Converte várias formas para 'AAAA-MM':
 * '01/2025', '1/2025', '2025-01', '15/01/2025', '01012025' (ddmmaaaa),
 * 'jan/25', Date, serial de Excel.
 */
function normalizarCompetencia (bruto) {
  if (bruto == null || bruto === '') return null
  if (bruto instanceof Date && !isNaN(bruto)) {
    return `${bruto.getUTCFullYear()}-${String(bruto.getUTCMonth() + 1).padStart(2, '0')}`
  }
  if (typeof bruto === 'number' && bruto > 20000 && bruto < 80000) {
    // serial de data do Excel (base 1899-12-30)
    const ms = Math.round(bruto) * 86400000 + Date.UTC(1899, 11, 30)
    return normalizarCompetencia(new Date(ms))
  }
  const s = String(bruto).trim()
  let m
  if ((m = s.match(/^(\d{4})[-/](\d{1,2})$/))) return mm(m[1], m[2])
  if ((m = s.match(/^(\d{1,2})[-/.](\d{4})$/))) return mm(m[2], m[1])
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) return mm(m[3], m[2])
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return mm(m[1], m[2])
  if ((m = s.match(/^(\d{2})(\d{2})(\d{4})$/))) return mm(m[3], m[2])   // ddmmaaaa (SPED)
  if ((m = s.match(/^(\d{1,2})[-/.](\d{2})$/))) return mm('20' + m[2], m[1])
  if ((m = s.match(/^([a-zç]{3})[a-zç]*[-/. ]+(\d{2,4})$/i))) {
    const mes = MESES_PT[m[1].toLowerCase()]
    if (mes) return mm(m[2].length === 2 ? '20' + m[2] : m[2], mes)
  }
  return null
  function mm (ano, mes) {
    const a = Number(ano); const b = Number(mes)
    if (!(a >= 1900 && a <= 2200) || !(b >= 1 && b <= 12)) return null
    return `${a}-${String(b).padStart(2, '0')}`
  }
}

/** Formata em reais para as mensagens dos parsers. */
function moedaBR (n) {
  return (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
}

/** Percentual com vírgula, como o dinheiro: "16,29%" e não "16.29%". */
function percentBR (n, casas = 2, sinal = false) {
  if (n == null || !Number.isFinite(Number(n))) return '—'
  const v = Number(n)
  const t = v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }) + '%'
  return sinal && v > 0 ? '+' + t : t
}

function competenciaLabel (c) {
  if (!c) return '—'
  const [a, m] = c.split('-')
  return `${m}/${a}`
}

function lanc (base) {
  return {
    cnpj: null, empresa: null, ie: null, competencia: null, livro: null,
    cfop: null, cst: null, valorContabil: 0, baseCalculo: 0, icms: 0,
    isentas: 0, outras: 0, confianca: 'alta', origem: {}, ...base,
  }
}

/* ------------------------------------------------------- 1. SPED EFD ICMS/IPI */

const COD_SIT_CANCELADO = new Set(['02', '03', '04', '05'])

/**
 * EFD ICMS/IPI (arquivo .txt delimitado por "|").
 * Registros usados: 0000 (contribuinte/período), C100+C190, C500+C590,
 * C400+C490 (ECF), C800+C850 (SAT/CF-e), D100+D190, D500+D590.
 * Documentos com COD_SIT de cancelamento/denegação são descartados.
 */
function parseSpedEfd (texto, arquivo = '') {
  const linhas = String(texto).split(/\r?\n/)
  const out = []
  const avisos = []
  let ctx = { cnpj: null, empresa: null, ie: null, competencia: null }
  let pai = null           // documento corrente { livro, cancelado }
  let descartados = 0

  for (let i = 0; i < linhas.length; i++) {
    const linha = linhas[i]
    if (!linha || linha.indexOf('|') === -1) continue
    const f = linha.split('|')
    const reg = (f[1] || '').trim().toUpperCase()

    switch (reg) {
      case '0000': {
        ctx = {
          cnpj: normalizarCnpj(f[7]) || normalizarCnpj(f[8]),
          empresa: (f[6] || '').trim() || null,
          ie: (f[10] || '').trim() || null,
          competencia: normalizarCompetencia(f[4]) || normalizarCompetencia(f[5]),
        }
        if (!ctx.cnpj) avisos.push(`Registro 0000 sem CNPJ legível (linha ${i + 1}).`)
        if (!ctx.competencia) avisos.push(`Registro 0000 sem período legível (linha ${i + 1}).`)
        break
      }
      case 'C100': case 'C500': case 'D100': case 'D500': {
        const indOper = (f[2] || '').trim()
        const codSit = (f[6] || '').trim().padStart(2, '0')
        pai = {
          livro: indOper === '1' ? 'saidas' : 'entradas',
          cancelado: reg === 'C100' && COD_SIT_CANCELADO.has(codSit),
          reg,
        }
        break
      }
      case 'C400': case 'C800': case 'C860': {
        pai = { livro: 'saidas', cancelado: false, reg } // ECF / SAT: sempre saída
        break
      }
      case 'C190': case 'C590': case 'D190': case 'D590': {
        if (!pai) { avisos.push(`${reg} sem documento pai na linha ${i + 1} — ignorado.`); continue }
        if (pai.cancelado) { descartados++; continue }
        out.push(lanc({
          ...ctx, livro: pai.livro,
          cst: (f[2] || '').trim() || null,
          cfop: (f[3] || '').trim() || null,
          valorContabil: numeroBR(f[5]) || 0,
          baseCalculo: numeroBR(f[6]) || 0,
          icms: numeroBR(f[7]) || 0,
          origem: { formato: 'SPED EFD', arquivo, referencia: `${reg} linha ${i + 1}` },
        }))
        break
      }
      case 'C490': case 'C850': {
        if (!pai) pai = { livro: 'saidas', cancelado: false, reg }
        out.push(lanc({
          ...ctx, livro: 'saidas',
          cst: (f[2] || '').trim() || null,
          cfop: (f[3] || '').trim() || null,
          valorContabil: numeroBR(f[5]) || 0,
          baseCalculo: numeroBR(f[6]) || 0,
          icms: numeroBR(f[7]) || 0,
          origem: { formato: 'SPED EFD', arquivo, referencia: `${reg} linha ${i + 1}` },
        }))
        break
      }
    }
  }
  if (descartados) avisos.push(`${descartados} lançamento(s) de documento cancelado/denegado foram descartados.`)
  return { lancamentos: out, avisos, formato: 'SPED EFD ICMS/IPI' }
}

/* ------------------------------------------- 2. Livro clássico (PDF impresso) */

const RX_CNPJ = /C\.?N\.?P\.?J\.?[\s.:/]*([\d]{2}[.\s]?\d{3}[.\s]?\d{3}[/\s]?\d{4}[-\s]?\d{2})/i
const RX_CPF_CNPJ2 = /CNPJ\s*\/?\s*CPF\s*:?\s*([\d.\-/]{11,20})/i
const RX_IE = /INSCR(?:I[ÇC][ÃA]O)?\.?\s*EST(?:ADUAL)?\.?\s*:?\s*([\d.\-/]{6,20})/i

/**
 * Livro Registro de Entradas/Saídas impresso (modelo P1/P2), no qual cada
 * mês termina com "RESUMO MENSAL DE OPERAÇÕES E PRESTAÇÃO POR CÓDIGO FISCAL".
 * Recebe o texto do PDF; se `paginas` for um array, cada item é uma página.
 */
function parseLivroClassico (entrada, arquivo = '') {
  const paginas = Array.isArray(entrada) ? entrada : dividirPaginas(String(entrada))
  const out = []
  const avisos = []
  const mesesSemResumo = new Map()
  const somaDetalhe = new Map()   // chave -> soma das linhas de detalhe (fora as canceladas)
  const cancelados = new Map()    // chave -> { qtd, valor }
  let achouCabecalho = false

  for (let p = 0; p < paginas.length; p++) {
    const texto = paginas[p] || ''
    const livro = /REGISTRO\s+DE\s+SA[IÍ]DAS/i.test(texto) ? 'saidas'
      : /REGISTRO\s+DE\s+ENTRADAS/i.test(texto) ? 'entradas' : null
    if (!livro) continue
    achouCabecalho = true

    const cnpj = normalizarCnpj((texto.match(RX_CNPJ) || [])[1])
    const ie = ((texto.match(RX_IE) || [])[1] || '').replace(/\D/g, '') || null
    const empresa = limparRazaoSocial((texto.match(/FIRMA\s*:?\s*(.+)/i) || [])[1])
    const compBruta = (texto.match(/M[EÊ]S\s+OU\s+PER[IÍ]ODO\s*\/?\s*ANO\s*:?\s*([\d]{1,2}\s*\/\s*[\d]{4})/i) || [])[1]
    const competencia = normalizarCompetencia((compBruta || '').replace(/\s/g, ''))
    const ctx = { cnpj, ie, empresa, competencia, livro }
    const chave = `${cnpj}|${competencia}|${livro}`

    if (!competencia) { avisos.push(`Página ${p + 1}: não foi possível ler a competência.`); continue }
    if (!cnpj) avisos.push(`Página ${p + 1} (${compBruta}): não foi possível ler o CNPJ.`)

    if (/SEM\s+MOVIMENTO/i.test(texto) && !/RESUMO\s+MENSAL/i.test(texto)) {
      out.push(lanc({ ...ctx, cfop: null, valorContabil: 0, semMovimento: true,
        origem: { formato: 'Livro clássico', arquivo, referencia: `pág. ${p + 1} — SEM MOVIMENTO` } }))
      continue
    }

    // soma das linhas de detalhe (conferência interna do livro)
    const det = valoresDetalheLivro(texto)
    if (det.valores.length) somaDetalhe.set(chave, (somaDetalhe.get(chave) || 0) + det.valores.reduce((a, b) => a + b, 0))
    if (det.canceladosQtd) {
      const c = cancelados.get(chave) || { qtd: 0, valor: 0, ctx }
      c.qtd += det.canceladosQtd; c.valor += det.canceladosValor
      cancelados.set(chave, c)
    }

    const idx = texto.search(/RESUMO\s+MENSAL/i)
    if (idx === -1) {
      if (!mesesSemResumo.has(chave)) mesesSemResumo.set(chave, ctx)
      continue
    }
    mesesSemResumo.delete(chave)

    const bloco = texto.slice(idx)
    let achouLinha = false
    for (const linha of bloco.split(/\n/)) {
      if (/SUB\s*TOTAL|^\s*TOTAL\b/i.test(linha)) continue
      // "5.102 66.468,00 66.468,00 0,00 0,00 0,00"
      const m = linha.match(/^\s*([1-7])\.?(\d{3})\s+((?:-?[\d.]+,\d{2}\s+){2,5}-?[\d.]+,\d{2})\s*$/)
      if (!m) continue
      const vals = m[3].trim().split(/\s+/).map(numeroBR)
      achouLinha = true
      out.push(lanc({
        ...ctx,
        cfop: m[1] + m[2],
        valorContabil: vals[0] ?? 0,
        baseCalculo: vals[1] ?? 0,
        icms: vals[2] ?? 0,
        isentas: vals[3] ?? 0,
        outras: vals[4] ?? 0,
        origem: { formato: 'Livro clássico', arquivo, referencia: `pág. ${p + 1} — resumo mensal` },
      }))
    }
    if (!achouLinha) avisos.push(`Página ${p + 1} (${compBruta}): "RESUMO MENSAL" encontrado, mas nenhuma linha de CFOP foi lida.`)
  }

  for (const [chave, ctx] of mesesSemResumo) {
    avisos.push(`${competenciaLabel(ctx.competencia)} (${ctx.livro}): nenhum "RESUMO MENSAL" no arquivo. ` +
      (somaDetalhe.has(chave)
        ? `Somando as linhas de detalhe daria ${moedaBR(somaDetalhe.get(chave))} — confira manualmente.`
        : 'Nada foi apurado para esse mês.'))
  }
  if (!achouCabecalho) avisos.push('Nenhum cabeçalho "REGISTRO DE ENTRADAS/SAÍDAS" foi encontrado.')

  // conferência: resumo x detalhe
  const porChave = new Map()
  for (const l of out) {
    const k = `${l.cnpj}|${l.competencia}|${l.livro}`
    porChave.set(k, (porChave.get(k) || 0) + l.valorContabil)
  }
  for (const [k, somaDet] of somaDetalhe) {
    const somaRes = porChave.get(k)
    if (somaRes == null) continue
    if (Math.abs(somaRes - somaDet) > 0.05) {
      const [, comp, livro] = k.split('|')
      avisos.push(`Conferência interna ${competenciaLabel(comp)} (${livro}): resumo mensal ${moedaBR(somaRes)} ` +
        `x soma das linhas de detalhe ${moedaBR(somaDet)} — diferença de ${moedaBR(somaRes - somaDet)}.`)
    }
  }
  for (const [, c] of cancelados) {
    avisos.push(`${competenciaLabel(c.ctx.competencia)} (${c.ctx.livro}): ${c.qtd} documento(s) cancelado(s) somando ` +
      `${moedaBR(c.valor)} ficaram fora da apuração (constam só no detalhe do livro).`)
  }
  return { lancamentos: out, avisos, formato: 'Livro fiscal impresso (modelo P1/P2)' }
}

/**
 * Linhas de detalhe do livro impresso: "... 358,00 5.102Icms 358,00 0,00 0,00 0,00".
 * Documentos marcados como cancelados são separados — eles constam do detalhe
 * mas, corretamente, ficam de fora do resumo mensal.
 */
function valoresDetalheLivro (texto) {
  const valores = []
  let canceladosQtd = 0; let canceladosValor = 0
  const rx = /(-?[\d.]+,\d{2})\s*([1-7]\.\d{3})\s*Icms/i
  for (const linha of String(texto).split(/\n/)) {
    const m = linha.match(rx)
    if (!m) continue
    const v = numeroBR(m[1])
    if (!Number.isFinite(v)) continue
    if (/cancelad/i.test(linha)) { canceladosQtd++; canceladosValor += v } else valores.push(v)
  }
  return { valores, canceladosQtd, canceladosValor }
}

/**
 * No livro impresso a legenda dos códigos fiscais fica na mesma linha da razão
 * social, à direita. Sem isto o nome da empresa sai grudado em "1 - Operacoes
 * com Credito do Imposto".
 */
function limparRazaoSocial (bruto) {
  if (!bruto) return null
  let s = String(bruto).split(/\s{3,}/)[0]
  s = s.replace(/\s+\d\s*[-–]\s*Opera[cç][õo]es\b.*$/i, '')
       .replace(/\s+(?:C\.?N\.?P\.?J|INSCR|CNPJ|UF|MUNIC[IÍ]PIO|IE|PER[IÍ]ODO)\b.*$/i, '')
       .replace(/\s+\d\s*[-–]\s*[A-ZÀ-Ú].{0,60}$/, '')
  return s.trim() || null
}

function dividirPaginas (texto) {
  const partes = texto.split(/(?=REGISTRO\s+DE\s+(?:ENTRADAS|SA[IÍ]DAS))/i)
  return partes.length > 1 ? partes : [texto]
}

/* ------------------------------ 3. Resumo por CST/CFOP (relatório tipo SPED) */

/**
 * "REGISTROS FISCAIS DOS DOCUMENTOS DE ENTRADAS/SAÍDAS ..." — relatório de
 * conferência do SPED, com bloco "RESUMO - TOTAIS" por CST/CFOP.
 * Também é o formato mais comum quando o livro chega como foto (via OCR).
 */
function parseResumoCstCfop (entrada, arquivo = '', confianca = 'alta') {
  const paginas = Array.isArray(entrada) ? entrada : [String(entrada)]
  const out = []
  const avisos = []

  for (let p = 0; p < paginas.length; p++) {
    const texto = paginas[p] || ''
    const livro = /DOCUMENTOS\s+DE\s+SA[IÍ]DAS|REGISTRO\s+DE\s+SA[IÍ]DAS/i.test(texto) ? 'saidas'
      : /DOCUMENTOS\s+DE\s+ENTRADAS|REGISTRO\s+DE\s+ENTRADAS/i.test(texto) ? 'entradas' : null
    if (!livro) { avisos.push(`Página ${p + 1}: não identifiquei se é livro de entradas ou de saídas.`); continue }

    const cnpj = normalizarCnpj((texto.match(RX_CPF_CNPJ2) || [])[1]) ||
                 normalizarCnpj((texto.match(RX_CNPJ) || [])[1])
    const ie = ((texto.match(RX_IE) || [])[1] || '').replace(/\D/g, '') || null
    const empresa = limparRazaoSocial((texto.match(/CONTRIBUINTE\s*:?\s*(.+)/i) || [])[1])
    const periodo = texto.match(/PER[IÍ]ODO\s+DE\s+APURA[ÇC][ÃA]O\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i)
    const competencia = normalizarCompetencia(periodo ? periodo[1] : null)
    if (!competencia) { avisos.push(`Página ${p + 1}: não foi possível ler o período de apuração.`); continue }
    if (!cnpj) avisos.push(`Página ${p + 1}: não foi possível ler o CNPJ.`)

    const linhas = texto.split(/\n/)
    const candidatas = linhas.filter(l => !/^\s*(?:SUB\s*)?TOTAL\b/i.test(l) && contarColunas(l) !== null)
    // Quantas colunas numéricas a página usa. Uma linha sem alíquota traz uma a
    // menos; é a maioria que define o padrão, não a primeira linha encontrada.
    const esperado = moda(candidatas.map(contarColunas))

    let achou = false
    for (const linha of linhas) {
      if (/^\s*(?:SUB\s*)?TOTAL\b/i.test(linha)) continue
      const reg = lerLinhaCstCfop(linha, esperado)
      if (!reg) continue
      achou = true
      out.push(lanc({
        cnpj, ie, empresa, competencia, livro,
        confianca: reg.consistente ? confianca : (confianca === 'alta' ? 'media' : 'baixa'),
        cst: reg.cst,
        cfop: reg.cfop,
        aliquota: reg.aliquota,
        valorContabil: reg.valores[0] ?? 0,
        baseCalculo: reg.valores[1] ?? 0,
        icms: reg.valores[2] ?? 0,
        origem: { formato: 'Resumo CST/CFOP', arquivo, referencia: `pág. ${p + 1}` },
      }))
      if (!reg.consistente) {
        avisos.push(`Página ${p + 1}, CFOP ${reg.cfop}: não consegui confirmar a ordem das colunas pela conta ` +
          `"base × alíquota = ICMS". Valores lidos como Total/Base/ICMS = ${reg.valores.slice(0, 3).join(' / ')} — confira.`)
      }
    }
    if (!achou) { avisos.push(`Página ${p + 1}: nenhuma linha CST/CFOP foi reconhecida.`); continue }

    // Conferência contra o TOTAL impresso na própria página.
    const impresso = totalImpresso(linhas)
    if (impresso != null) {
      const lido = out.filter(l => l.competencia === competencia && l.livro === livro &&
                                   l.origem.referencia === `pág. ${p + 1}`)
                      .reduce((a, l) => a + l.valorContabil, 0)
      if (Math.abs(lido - impresso) > 0.05) {
        avisos.push(`Página ${p + 1}: a soma das linhas deu ${moedaBR(lido)}, mas o TOTAL impresso é ` +
          `${moedaBR(impresso)} — diferença de ${moedaBR(lido - impresso)}. Confira antes de usar este mês.`)
      }
    } else {
      avisos.push(`Página ${p + 1}: não achei a linha TOTAL para conferir a leitura.`)
    }
  }
  return { lancamentos: out, avisos, formato: 'Resumo fiscal por CST/CFOP' }
}

/** Primeiro valor da linha "TOTAL ..." — o total da coluna Total Operação. */
function totalImpresso (linhas) {
  for (const l of linhas) {
    if (!/^\s*TOTAL\b/i.test(l)) continue
    const m = String(l).trim().split(/[\s|]+/).filter(t => RX_MOEDA.test(t))
    if (m.length) return numeroBR(m[0])
  }
  return null
}

/** Quantos valores monetários a linha traz depois do CST, ou null se não for linha de CFOP. */
function contarColunas (linha) {
  const tokens = String(linha).trim().split(/[\s|]+/).filter(Boolean)
  if (tokens.length < 5) return null
  const i = tokens.findIndex(t => RX_CFOP_TOKEN.test(t))
  if (i === -1) return null
  const n = tokens.filter(t => RX_MOEDA.test(t)).length
  return n >= 3 ? n : null
}

function moda (lista) {
  const c = new Map()
  for (const v of lista) c.set(v, (c.get(v) || 0) + 1)
  let melhor = null; let max = 0
  for (const [v, n] of c) if (n > max || (n === max && v > melhor)) { melhor = v; max = n }
  return melhor
}

/* ------------------------------ 3b. Extrato do Simples Nacional (PGDAS-D) */

/**
 * Extrato do Simples Nacional (PGDAS-D).
 *
 * Não é livro fiscal: não tem CFOP e não se separa em entradas e saídas. É a
 * RECEITA DECLARADA à Receita Federal, então entra do lado das vendas
 * informadas — é a versão oficial do "quanto a empresa disse que vendeu".
 *
 * Duas escalas convivem no documento, e misturá-las dá erro:
 *  - a seção 3 traz a receita POR ESTABELECIMENTO, com CNPJ completo;
 *  - a seção 2.2 traz o histórico mensal CONSOLIDADO da empresa inteira.
 * O histórico só é atribuído a um CNPJ quando o extrato tem um único
 * estabelecimento; havendo mais de um, ele não tem como ser repartido.
 *
 * A leitura se confere sozinha contra três números impressos: o RBA
 * (acumulado do ano), o RBT12 (doze meses anteriores) e a soma das receitas
 * por atividade de cada estabelecimento.
 */
function parsePgdasD (entrada, arquivo = '') {
  const texto = Array.isArray(entrada) ? entrada.join('\n') : String(entrada)
  const linhas = texto.split(/\r?\n/)
  const avisos = []

  const pa = normalizarCompetencia((texto.match(/Per[ií]odo\s+de\s+Apura[çc][ãa]o\s*\(PA\)\s*:?\s*(\d{1,2}\/\d{4})/i) || [])[1])
  if (!pa) return { registros: [], avisos: ['Não encontrei o "Período de Apuração (PA)" — este arquivo não parece um extrato do PGDAS-D.'], formato: 'PGDAS-D' }

  const empresa = ((texto.match(/Nome\s+Empresarial\s*:?\s*(.+)/i) || [])[1] || '').trim() || null
  const rpa = numerosAposRotulo(linhas, /Receita\s+Bruta\s+do\s+PA\s*\(RPA\)/i)
  const rbt12 = numerosAposRotulo(linhas, /doze\s+meses\s+anteriores\s+ao\s+PA\s*$|\(RBT12\)/i)
  const rba = numerosAposRotulo(linhas, /ano-calend[áa]rio\s+corrente\s*\(RBA\)/i)

  /* --- seção 3: receita por estabelecimento --- */
  const blocos = texto.split(/CNPJ\s+Estabelecimento\s*:/i).slice(1)
  const estabelecimentos = []
  for (const bloco of blocos) {
    const cnpj = normalizarCnpj((bloco.match(/^\s*([\d./-]{14,20})/) || [])[1])
    if (!cnpj) continue
    const atividades = []
    for (const parte of bloco.split(/Valor\s+do\s+D[ée]bito\s+por\s+Tributo\s+para\s+a\s+Atividade/i).slice(1)) {
      const m = parte.match(/Receita\s+Bruta\s+Informada\s*:?\s*R?\$?\s*(-?[\d.]+,\d{2})/i)
      if (!m) continue
      atividades.push({ valor: numeroBR(m[1]), tipo: tipoDeAtividade(parte.slice(0, m.index)) })
    }
    const declarado = numeroBR((bloco.match(/Valor\s+Informado\s*:?\s*R?\$?\s*(-?[\d.]+,\d{2})/i) || [])[1])
    const somaAtiv = round2c(atividades.reduce((a, x) => a + x.valor, 0))
    const total = Number.isFinite(declarado) ? declarado : somaAtiv
    if (Number.isFinite(declarado) && atividades.length && Math.abs(somaAtiv - declarado) > 0.05) {
      avisos.push(`${formatarCnpj(cnpj)}: a soma das receitas por atividade (${moedaBR(somaAtiv)}) não bate com o ` +
        `"Valor Informado" (${moedaBR(declarado)}) — diferença de ${moedaBR(somaAtiv - declarado)}.`)
    }
    estabelecimentos.push({
      cnpj, total,
      mercadoria: round2c(atividades.filter(a => a.tipo === 'mercadoria').reduce((a, x) => a + x.valor, 0)),
      servico: round2c(atividades.filter(a => a.tipo === 'servico').reduce((a, x) => a + x.valor, 0)),
      outros: round2c(atividades.filter(a => a.tipo === 'outro').reduce((a, x) => a + x.valor, 0)),
    })
  }
  if (!estabelecimentos.length) {
    return { registros: [], avisos: ['Não encontrei nenhum "CNPJ Estabelecimento" na seção 3 do extrato.'], formato: 'PGDAS-D' }
  }

  const registros = []
  for (const e of estabelecimentos) {
    registros.push({
      cnpj: e.cnpj, competencia: pa, valor: e.total, empresa,
      arquivo, linha: null, fonte: 'PGDAS-D', escopo: 'estabelecimento',
      detalhe: { mercadoria: e.mercadoria, servico: e.servico, outros: e.outros },
    })
  }

  const somaEstab = round2c(estabelecimentos.reduce((a, e) => a + e.total, 0))
  if (rpa != null && Math.abs(somaEstab - rpa) > 0.05) {
    avisos.push(`A soma dos estabelecimentos (${moedaBR(somaEstab)}) não bate com a Receita Bruta do PA ` +
      `(${moedaBR(rpa)}) — diferença de ${moedaBR(somaEstab - rpa)}.`)
  }

  /* --- seção 2.2: histórico mensal, consolidado da empresa --- */
  const historico = somarSeries(
    mesesDoBloco(texto, /2\.2\.1\)/, /2\.2\.2\)/),
    mesesDoBloco(texto, /2\.2\.2\)/, /2\.3\)|Folha\s+de\s+Sal/i))

  if (historico.size) {
    if (estabelecimentos.length === 1) {
      const cnpj = estabelecimentos[0].cnpj
      for (const [comp, valor] of [...historico].sort()) {
        if (comp === pa) continue   // o mês do PA já veio da seção 3, com o detalhe por atividade
        registros.push({
          cnpj, competencia: comp, valor, empresa, arquivo, linha: null,
          fonte: 'PGDAS-D (histórico)', escopo: 'empresa',
        })
      }
    } else {
      avisos.push(`O histórico mensal do extrato é consolidado da empresa e este PA tem ` +
        `${estabelecimentos.length} estabelecimentos — não dá para reparti-lo por CNPJ. ` +
        `Só ${competenciaLabel(pa)} foi aproveitado; para os outros meses, carregue o extrato de cada PA.`)
    }
    conferirAcumulados(historico, pa, rpa, rba, rbt12, avisos)
  }

  return { registros, avisos, formato: 'Extrato do Simples Nacional (PGDAS-D)', competencia: pa }
}

function tipoDeAtividade (texto) {
  if (/Revenda\s+de\s+mercadorias|Venda\s+de\s+mercadorias|Ind[úu]stria/i.test(texto)) return 'mercadoria'
  if (/Presta[çc][ãa]o\s+de\s+Servi[çc]os|Loca[çc][ãa]o/i.test(texto)) return 'servico'
  return 'outro'
}

/** Valores da linha do rótulo; quando o rótulo quebra a linha, olha as seguintes. */
function numerosAposRotulo (linhas, rx, janela = 2) {
  for (let i = 0; i < linhas.length; i++) {
    if (!rx.test(linhas[i])) continue
    for (let j = i; j <= i + janela && j < linhas.length; j++) {
      const m = String(linhas[j]).match(/-?[\d.]+,\d{2}/g)
      if (m && m.length) return numeroBR(m[0])
    }
  }
  return null
}

/** Pares "MM/AAAA valor" de um trecho delimitado do documento. */
function mesesDoBloco (texto, de, ate) {
  const i = texto.search(de)
  if (i === -1) return new Map()
  const resto = texto.slice(i)
  const j = resto.slice(1).search(ate)
  const bloco = j === -1 ? resto : resto.slice(0, j + 1)
  const mapa = new Map()
  const rx = /(\d{2})\/(\d{4})\s+(-?[\d.]+,\d{2})/g
  let m
  while ((m = rx.exec(bloco))) {
    const comp = normalizarCompetencia(`${m[1]}/${m[2]}`)
    if (comp) mapa.set(comp, numeroBR(m[3]))
  }
  return mapa
}

function somarSeries (a, b) {
  const out = new Map(a)
  for (const [k, v] of b) out.set(k, round2c((out.get(k) || 0) + v))
  return out
}

/** Confere a série lida contra o RBA e o RBT12 impressos no próprio extrato. */
function conferirAcumulados (historico, pa, rpa, rba, rbt12, avisos) {
  const [ano, mes] = pa.split('-').map(Number)
  if (rba != null && rpa != null) {
    let soma = rpa
    for (const [c, v] of historico) if (c.startsWith(ano + '-') && c !== pa) soma += v
    if (Math.abs(round2c(soma) - rba) > 0.05) {
      avisos.push(`A série mensal lida soma ${moedaBR(soma)} no ano, mas o RBA impresso é ${moedaBR(rba)} — ` +
        `diferença de ${moedaBR(soma - rba)}. Confira antes de usar estes meses.`)
    }
  }
  if (rbt12 != null) {
    let soma = 0
    for (let k = 1; k <= 12; k++) {
      const d = new Date(Date.UTC(ano, mes - 1 - k, 1))
      const c = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`
      soma += historico.get(c) || 0
    }
    if (Math.abs(round2c(soma) - rbt12) > 0.05) {
      avisos.push(`Os doze meses anteriores lidos somam ${moedaBR(soma)}, mas o RBT12 impresso é ` +
        `${moedaBR(rbt12)} — diferença de ${moedaBR(soma - rbt12)}.`)
    }
  }
}

const round2c = (n) => Math.round((Number(n) || 0) * 100) / 100

/** Reconhece um extrato do PGDAS-D pelo conteúdo. */
function ehPgdasD (texto) {
  const t = String(texto)
  return /Extrato\s+do\s+Simples\s+Nacional/i.test(t) ||
    (/PGDAS-D/i.test(t) && /Per[ií]odo\s+de\s+Apura[çc][ãa]o/i.test(t))
}

/* ------------------------------------------------- 4. Tabular (CSV / XLSX) */

const SINONIMOS = {
  cnpj: ['cnpj', 'cnpjcpf', 'cnpj/cpf', 'cnpjempresa', 'documento', 'cnpjestabelecimento', 'estabelecimento'],
  empresa: ['empresa', 'razaosocial', 'razao', 'contribuinte', 'firma', 'nome', 'loja', 'filial'],
  competencia: ['competencia', 'mes', 'mesano', 'periodo', 'mesreferencia', 'referencia', 'data', 'dataemissao', 'datasaida', 'dtdoc', 'anomes'],
  cfop: ['cfop', 'codigofiscal', 'codfisc', 'codfiscal', 'cfo', 'naturezaoperacao'],
  cst: ['cst', 'csticms', 'cstc', 'situacaotributaria'],
  livro: ['livro', 'tipo', 'tipooperacao', 'entradasaida', 'operacao', 'indoper', 'esentrada'],
  valorContabil: ['valorcontabil', 'vlrcontabil', 'valortotal', 'totaloperacao', 'valoroperacao', 'vloperacao', 'vlropr', 'valor', 'vldoc', 'valordocumento', 'total'],
  baseCalculo: ['basecalculo', 'basedecalculo', 'basecalc', 'bc', 'vlbcicms', 'basecalculoicms'],
  icms: ['icms', 'valoricms', 'vlicms', 'impostodebitado', 'imposto', 'impostocreditado'],
  isentas: ['isentas', 'isentasnaotributadas', 'isentonaotributado', 'isentonaotrib'],
  outras: ['outras', 'outrasoperacoes'],
  valorInformado: ['vendas', 'vendainformada', 'vendasinformadas', 'valorvenda', 'faturamento', 'receita', 'valorinformado', 'totalvendas', 'vendabruta', 'vendaliquida'],
}

const chaveNorm = (s) => String(s ?? '').toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9]/g, '')

/** Descobre, a partir do cabeçalho, qual coluna é o quê. */
function mapearColunas (cabecalho, sinonimos = SINONIMOS) {
  const mapa = {}
  const usadas = new Set()
  const normalizado = cabecalho.map(chaveNorm)
  for (const [campo, nomes] of Object.entries(sinonimos)) {
    for (const nome of nomes) {
      const i = normalizado.findIndex((h, idx) => !usadas.has(idx) && (h === nome || (h.length > 3 && h.startsWith(nome))))
      if (i !== -1) { mapa[campo] = i; usadas.add(i); break }
    }
  }
  return mapa
}

/**
 * Muita planilha traz o CNPJ num bloco solto acima do cabeçalho —
 * "CNPJ | 11.222.333/0001-81" numa linha de rótulo e valor — em vez de numa
 * coluna. Sem isto o arquivo inteiro entra sem CNPJ e não encontra as outras
 * fontes na hora de cruzar.
 */
function cnpjNoCabecalho (linhas, ateLinha = 12) {
  for (let i = 0; i < Math.min(linhas.length, ateLinha); i++) {
    for (const celula of linhas[i] || []) {
      const t = String(celula ?? '')
      const m = t.match(/\b\d{2}[.\s]?\d{3}[.\s]?\d{3}[/\s]?\d{4}[-\s]?\d{2}\b/)
      if (m) { const c = normalizarCnpj(m[0]); if (c && c.length === 14) return c }
    }
  }
  return null
}

/** Acha a linha de cabeçalho num bloco de linhas (pula títulos soltos). */
function acharCabecalho (linhas, sinonimos = SINONIMOS) {
  let melhor = { i: -1, n: 0, mapa: {} }
  for (let i = 0; i < Math.min(linhas.length, 30); i++) {
    const mapa = mapearColunas(linhas[i].map(c => String(c ?? '')), sinonimos)
    const n = Object.keys(mapa).length
    if (n > melhor.n) melhor = { i, n, mapa }
  }
  return melhor
}

/**
 * Linhas tabulares de LIVRO FISCAL (uma linha por CFOP/documento).
 * @param {any[][]} linhas matriz já lida do CSV/XLSX
 * @param {{livroPadrao?:string, mapa?:object, arquivo?:string}} opts
 */
function parseTabularLivro (linhas, opts = {}) {
  const avisos = []
  const { i: iCab, mapa: mapaAuto } = acharCabecalho(linhas)
  const mapa = opts.mapa || mapaAuto
  if (iCab === -1 || mapa.cfop == null) {
    return { lancamentos: [], avisos: ['Não encontrei uma coluna de CFOP nesta planilha. Use o mapeamento manual de colunas.'], mapa, formato: 'Tabular' }
  }
  const out = []
  for (let r = iCab + 1; r < linhas.length; r++) {
    const linha = linhas[r]
    if (!linha || linha.every(c => c === '' || c == null)) continue
    const cfop = linha[mapa.cfop]
    if (cfop == null || String(cfop).trim() === '') continue
    const cfopDig = String(cfop).replace(/\D/g, '')
    if (cfopDig.length < 4) continue

    let livro = opts.livroPadrao || null
    if (mapa.livro != null) {
      const v = chaveNorm(linha[mapa.livro])
      if (/^(s|saida|saidas|1|venda|vendas)$/.test(v)) livro = 'saidas'
      else if (/^(e|entrada|entradas|0|compra|compras)$/.test(v)) livro = 'entradas'
    }
    if (!livro) livro = /^[567]/.test(cfopDig) ? 'saidas' : 'entradas'

    const comp = normalizarCompetencia(mapa.competencia != null ? linha[mapa.competencia] : opts.competenciaPadrao)
    out.push(lanc({
      cnpj: normalizarCnpj(mapa.cnpj != null ? linha[mapa.cnpj] : opts.cnpjPadrao),
      empresa: mapa.empresa != null ? String(linha[mapa.empresa] ?? '').trim() || null : null,
      competencia: comp,
      livro,
      cfop: cfopDig,
      cst: mapa.cst != null ? String(linha[mapa.cst] ?? '').trim() || null : null,
      valorContabil: valOu0(linha, mapa.valorContabil),
      baseCalculo: valOu0(linha, mapa.baseCalculo),
      icms: valOu0(linha, mapa.icms),
      isentas: valOu0(linha, mapa.isentas),
      outras: valOu0(linha, mapa.outras),
      origem: { formato: 'Tabular', arquivo: opts.arquivo || '', referencia: `linha ${r + 1}` },
    }))
  }
  const semComp = out.filter(l => !l.competencia).length
  if (semComp) avisos.push(`${semComp} linha(s) sem competência legível — informe a competência padrão ou corrija a coluna de data.`)
  const semCnpj = out.filter(l => !l.cnpj).length
  if (semCnpj) avisos.push(`${semCnpj} linha(s) sem CNPJ legível — informe o CNPJ padrão do arquivo.`)
  return { lancamentos: out, avisos, mapa, formato: 'Tabular (livro fiscal)' }
}

function valOu0 (linha, i) {
  if (i == null) return 0
  const n = numeroBR(linha[i])
  return Number.isFinite(n) ? n : 0
}

/**
 * Planilha de VENDAS INFORMADAS: CNPJ, competência, valor.
 * @returns {{registros: Array<{cnpj,empresa,competencia,valor,linha}>, avisos, mapa}}
 */
function parseVendasInformadas (linhas, opts = {}) {
  const avisos = []
  const { i: iCab, mapa: mapaAuto } = acharCabecalho(linhas)
  const mapa = opts.mapa || mapaAuto
  const colValor = mapa.valorInformado ?? mapa.valorContabil
  if (iCab === -1 || colValor == null) {
    return { registros: [], avisos: ['Não encontrei uma coluna de valor de vendas. Use o mapeamento manual de colunas.'], mapa }
  }
  const registros = []
  for (let r = iCab + 1; r < linhas.length; r++) {
    const linha = linhas[r]
    if (!linha || linha.every(c => c === '' || c == null)) continue
    const valor = numeroBR(linha[colValor])
    if (!Number.isFinite(valor)) continue
    const cnpj = normalizarCnpj(mapa.cnpj != null ? linha[mapa.cnpj] : opts.cnpjPadrao)
    const competencia = normalizarCompetencia(mapa.competencia != null ? linha[mapa.competencia] : opts.competenciaPadrao)
    if (!cnpj || !competencia) {
      avisos.push(`Linha ${r + 1}: ${!cnpj ? 'CNPJ' : 'competência'} ilegível — linha ignorada.`)
      continue
    }
    registros.push({
      cnpj, competencia, valor,
      empresa: mapa.empresa != null ? String(linha[mapa.empresa] ?? '').trim() || null : null,
      linha: r + 1, arquivo: opts.arquivo || '',
    })
  }
  return { registros, avisos, mapa }
}

/* ------------------------------------------------------------- 5. dispatcher */

/** Descobre o formato pelo conteúdo e chama o parser certo. */
function parseTexto (texto, arquivo = '', opts = {}) {
  const t = String(texto)
  if (/^\|(0000|9999|0001)\|/m.test(t) || /\|C190\|/.test(t) || /\|C490\|/.test(t)) {
    return parseSpedEfd(t, arquivo)
  }
  if (/RESUMO\s+MENSAL\s+DE\s+OPERA/i.test(t) || /M[EÊ]S\s+OU\s+PER[IÍ]ODO/i.test(t)) {
    return parseLivroClassico(opts.paginas || t, arquivo)
  }
  if (/PER[IÍ]ODO\s+DE\s+APURA[ÇC][ÃA]O/i.test(t) || /RESUMO\s*[-–]\s*TOTAIS/i.test(t)) {
    return parseResumoCstCfop(opts.paginas || t, arquivo, opts.confianca || 'alta')
  }
  return {
    lancamentos: [],
    avisos: ['Formato não reconhecido automaticamente. Converta para CSV/XLSX ou use o SPED EFD (.txt).'],
    formato: 'desconhecido',
  }
}

const RX_MOEDA = /^-?\d{1,3}(?:\.\d{3})*,\d{2}$|^-?\d+,\d{2}$/
const RX_CFOP_TOKEN = /^([1-7])\.?(\d{3})$/

/**
 * Lê uma linha do bloco "RESUMO - TOTAIS" por CST/CFOP.
 * A ordem das colunas varia entre sistemas: umas trazem CST | CFOP | Alíquota | valores,
 * outras CST | Alíquota | CFOP | valores. A ordem é decidida pela conta
 * "base de cálculo x alíquota = ICMS"; quando ela não fecha, a linha é marcada
 * como não confirmada em vez de ser adivinhada em silêncio.
 */
function lerLinhaCstCfop (linha, esperado = null) {
  const tokens = String(linha).trim().split(/[\s|]+/).filter(Boolean)
  if (tokens.length < 5) return null
  const iCfop = tokens.findIndex(t => RX_CFOP_TOKEN.test(t))
  if (iCfop === -1) return null
  const mc = tokens[iCfop].match(RX_CFOP_TOKEN)
  const cfop = mc[1] + mc[2]

  const antes = tokens.slice(0, iCfop)
  const depois = tokens.slice(iCfop + 1)
  while (depois.length && !RX_MOEDA.test(depois[depois.length - 1])) depois.pop()
  if (depois.length < 3 || !depois.every(t => RX_MOEDA.test(t))) return null

  const moedaAntes = antes.filter(t => RX_MOEDA.test(t))
  const inteirosAntes = antes.filter(t => /^\d{1,3}$/.test(t))
  const cst = inteirosAntes.length ? inteirosAntes[inteirosAntes.length - 1].padStart(3, '0') : null
  const total = moedaAntes.length + depois.length

  const opcoes = []
  if (moedaAntes.length) {
    // layout com a alíquota antes do CFOP
    opcoes.push({ aliquota: numeroBR(moedaAntes[moedaAntes.length - 1]), valores: depois.map(numeroBR) })
  } else if (esperado != null && total === esperado - 1) {
    /*
     * Uma coluna a menos que o resto da página: a alíquota veio em branco
     * (acontece em CST 090). Tomar o primeiro número como alíquota zeraria o
     * valor da operação — e a conta "0 x alíquota = 0" confirmaria o erro.
     */
    opcoes.push({ aliquota: null, valores: depois.map(numeroBR) })
  } else {
    if (depois.length >= 4) opcoes.push({ aliquota: numeroBR(depois[0]), valores: depois.slice(1).map(numeroBR) })
    opcoes.push({ aliquota: null, valores: depois.map(numeroBR) })
  }

  for (const o of opcoes) {
    if (o.valores.length < 3) continue
    const [, base, icms] = o.valores
    const esperadoIcms = (base || 0) * (o.aliquota || 0) / 100
    const ok = Math.abs(esperadoIcms - (icms || 0)) <= Math.max(0.02, Math.abs(icms || 0) * 0.01) ||
               ((o.aliquota === 0 || o.aliquota == null) && (icms || 0) === 0)
    if (ok) return { cst, cfop, aliquota: o.aliquota, valores: o.valores, consistente: true }
  }
  const o = opcoes[0]
  if (!o || o.valores.length < 3) return null
  return { cst, cfop, aliquota: o.aliquota, valores: o.valores, consistente: false }
}


/* ===== src/triangulacao.js ===== */
/**
 * Triangulação de auditoria de vendas.
 *
 * Três fontes que deveriam contar a mesma história e quase nunca contam:
 *
 *   Redução Z   o que o equipamento fiscal registrou (ECF). É o número que o
 *               fisco enxerga, e o único que a loja não consegue reescrever
 *               depois — o Grande Total é acumulador e não zera.
 *   PDV         o que o sistema comercial registrou. É o que a loja de fato
 *               vendeu, cupom emitido ou não.
 *   Declarado   o que foi informado (ao shopping, na planilha, ou ao fisco no
 *               extrato do Simples).
 *
 * A direção da diferença é que diz o que aconteceu:
 *   PDV > Z         venda sem documento fiscal
 *   Z > PDV         cupom sem venda correspondente, ou exportação do PDV incompleta
 *   Declarado < Z   informou a menor o que o próprio equipamento fiscal registrou
 *
 * Nada aqui é opinião sobre a loja: são subtrações entre números que ela mesma
 * produziu, e cada uma aparece com as duas parcelas à vista.
 */

const FONTES = {
  z: 'Redução Z (equipamento fiscal)',
  pdv: 'Relatório de PDV',
  napp: 'NAPP',
  declarado: 'Declarado / informado',
}
/** Nome curto de cada tipo de lançamento, como aparece nas tabelas. */
const NOME_FONTE_TRI = { z: 'Redução Z', pdv: 'PDV', napp: 'NAPP', declarado: 'Declarado' }

/**
 * Limites da triangulação em reais — a leitura é pela maior variação em R$
 * entre os tipos de lançamento, não pelo percentual. No mês: até `coerente`
 * fecha, até `atencao` pede atenção, acima disso é DISPERSO. No dia: até `dia`
 * fecha, acima é DISPERSO. Os valores padrão são ponto de partida e ficam
 * editáveis na aba.
 */
function limitesTri (opts = {}) {
  return {
    coerente: Number(opts.triCoerenteReais ?? 100),
    atencao: Number(opts.triAtencaoReais ?? 1000),
    dia: Number(opts.triDiaReais ?? 100),
  }
}

/**
 * O resumo de um conjunto de lançamentos (Z, PDV, NAPP, declarado) de um mesmo
 * lojista e período: o maior valor e de qual tipo ele vem, a variação em R$
 * entre o maior e o menor, quanto o maior passa do declarado e o status. É a
 * mesma conta no mês, no dia, no fechamento e na base fictícia.
 */
function resumirFontes (fontes, opts = {}) {
  const { coerente, atencao } = limitesTri(opts)
  const presentes = Object.entries(fontes).filter(([, v]) => v != null && Number.isFinite(Number(v)))
  const valores = presentes.map(([, v]) => Number(v))
  const maior = valores.length ? Math.max(...valores) : null
  const menor = valores.length ? Math.min(...valores) : null
  const fonteMaior = presentes.filter(([, v]) => Number(v) === maior).map(([k]) => k)
  const declarado = fontes.declarado ?? null
  if (valores.length < 2) {
    return { maior, menor, fonteMaior, amplitude: null, dispersao: null, naoDeclarado: null, status: STATUS_TRI.FONTE_UNICA }
  }
  const amplitude = arred2(maior - menor)
  return {
    maior, menor, fonteMaior, amplitude,
    // o percentual continua calculado para o detalhe, mas não decide nada
    dispersao: maior > 0 ? arred2(amplitude / maior * 100) : 0,
    naoDeclarado: declarado == null ? null : arred2(Math.max(0, maior - declarado)),
    status: amplitude <= coerente ? STATUS_TRI.COERENTE : amplitude <= atencao ? STATUS_TRI.ATENCAO : STATUS_TRI.DISPERSO,
  }
}

const arred2 = (n) => Math.round((Number(n) || 0) * 100) / 100

/* ------------------------------------------------------------------- datas */

/** Converte para 'AAAA-MM-DD'. Aceita ddmmaaaa do SPED, dd/mm/aaaa, ISO e serial do Excel. */
function normalizarData (bruto) {
  if (bruto == null || bruto === '') return null
  if (bruto instanceof Date && !isNaN(bruto)) return iso(bruto.getUTCFullYear(), bruto.getUTCMonth() + 1, bruto.getUTCDate())
  if (typeof bruto === 'number' && bruto > 20000 && bruto < 80000) {
    return normalizarData(new Date(Math.round(bruto) * 86400000 + Date.UTC(1899, 11, 30)))
  }
  const s = String(bruto).trim()
  let m
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return iso(m[1], m[2], m[3])
  if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/))) return iso(m[3], m[2], m[1])
  if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2})$/))) return iso('20' + m[3], m[2], m[1])
  if ((m = s.match(/^(\d{8})$/))) {
    /*
     * Oito dígitos são ambíguos: 15032025 é ddmmaaaa (o do SPED) e 20250315 é
     * aaaammdd. Vale a ordem que produzir uma data válida; havendo empate, ganha
     * aaaammdd, porque aí os quatro primeiros dígitos são um ano plausível.
     */
    const d = m[1]
    const comoDDMM = iso(d.slice(4), d.slice(2, 4), d.slice(0, 2))
    const comoAAAA = iso(d.slice(0, 4), d.slice(4, 6), d.slice(6))
    return comoAAAA || comoDDMM
  }
  return null
  function iso (a, mes, d) {
    const A = Number(a); const M = Number(mes); const D = Number(d)
    if (!(A >= 1900 && A <= 2200) || !(M >= 1 && M <= 12) || !(D >= 1 && D <= 31)) return null
    return `${A}-${String(M).padStart(2, '0')}-${String(D).padStart(2, '0')}`
  }
}

const dataLabel = (d) => d ? d.split('-').reverse().join('/') : '—'
const competenciaDe = (data) => data ? data.slice(0, 7) : null

function mov (base) {
  return { cnpj: null, data: null, competencia: null, valor: 0, fonte: null,
    crz: null, cro: null, gt: null, coo: null, equipamento: null, origem: {}, ...base }
}

/* --------------------------------------------- 1. Redução Z via SPED EFD */

/**
 * Registros C400 (identificação do ECF) e C405 (a redução Z do dia).
 * Layout do C405: DT_DOC | CRO | CRZ | NUM_COO_FIN | GT_FIN | VL_BRT
 * (Guia Prático da EFD ICMS/IPI, bloco C.)
 */
function parseReducaoZSped (texto, arquivo = '') {
  const linhas = String(texto).split(/\r?\n/)
  const out = []
  const avisos = []
  let cnpj = null; let equipamento = null

  for (let i = 0; i < linhas.length; i++) {
    const f = linhas[i].split('|')
    const reg = (f[1] || '').trim().toUpperCase()
    if (reg === '0000') { cnpj = normalizarCnpj(f[7]) || normalizarCnpj(f[8]); continue }
    if (reg === 'C400') {
      // COD_MOD | ECF_MOD | ECF_FAB | ECF_CX
      equipamento = [(f[3] || '').trim(), (f[4] || '').trim(), (f[5] || '').trim()].filter(Boolean).join(' ') || null
      continue
    }
    if (reg !== 'C405') continue
    const data = normalizarData(f[2])
    if (!data) { avisos.push(`C405 na linha ${i + 1} sem data legível — ignorado.`); continue }
    out.push(mov({
      cnpj, data, competencia: competenciaDe(data), fonte: 'z', equipamento,
      cro: inteiro(f[3]), crz: inteiro(f[4]), coo: inteiro(f[5]),
      gt: numeroFinito(f[6]), valor: numeroFinito(f[7]) || 0,
      origem: { formato: 'SPED EFD (C405)', arquivo, referencia: `linha ${i + 1}` },
    }))
  }
  if (!out.length) avisos.push('Nenhum registro C405 (redução Z) encontrado neste arquivo.')
  return { movimentos: out, avisos, formato: 'Redução Z — SPED EFD (C405)' }
}

const inteiro = (x) => { const n = parseInt(String(x ?? '').replace(/\D/g, ''), 10); return Number.isFinite(n) ? n : null }
const numeroFinito = (x) => { const n = numeroBR(x); return Number.isFinite(n) ? n : null }

/* ------------------------------------- 2. Redução Z impressa (PDF/texto) */

const RX_Z_BLOCO = /REDU[ÇC][ÃA]O\s*[- ]?\s*Z/i

/**
 * Cupom de redução Z impresso. O layout muda de fabricante para fabricante, então
 * a leitura é por rótulo e não por posição: cada bloco que começa em "REDUÇÃO Z"
 * é varrido atrás da data, da venda bruta diária, do CRZ e do Grande Total.
 */
function parseReducaoZImpressa (entrada, arquivo = '') {
  const texto = Array.isArray(entrada) ? entrada.join('\n') : String(entrada)
  if (!RX_Z_BLOCO.test(texto)) {
    return { movimentos: [], avisos: ['Não encontrei nenhum bloco "REDUÇÃO Z" neste arquivo.'], formato: 'Redução Z impressa' }
  }
  const cnpjDoc = normalizarCnpj((texto.match(/C\.?N\.?P\.?J\.?[\s.:/]*([\d]{2}[.\s]?\d{3}[.\s]?\d{3}[/\s]?\d{4}[-\s]?\d{2})/i) || [])[1])
  const partes = texto.split(new RegExp(`(?=${RX_Z_BLOCO.source})`, 'i')).filter(p => RX_Z_BLOCO.test(p))
  const out = []
  const avisos = []

  for (let i = 0; i < partes.length; i++) {
    const b = partes[i]
    const valor = rotulo(b, /VENDA\s+BRUTA\s+DI[ÁA]RIA/i) ?? rotulo(b, /VENDA\s+BRUTA/i)
    const data = normalizarData((b.match(/(\d{2}\/\d{2}\/\d{4})/) || [])[1]) ||
                 normalizarData((b.match(/(\d{4}-\d{2}-\d{2})/) || [])[1])
    if (valor == null || !data) {
      avisos.push(`Bloco ${i + 1} de redução Z: ${!data ? 'sem data' : 'sem "venda bruta diária"'} legível — ignorado.`)
      continue
    }
    out.push(mov({
      cnpj: normalizarCnpj((b.match(/C\.?N\.?P\.?J\.?[\s.:/]*([\d./-]{14,20})/i) || [])[1]) || cnpjDoc,
      data, competencia: competenciaDe(data), fonte: 'z', valor,
      crz: inteiroRotulo(b, /(?:CRZ|CONTADOR\s+DE\s+REDU[ÇC][ÃA]O)/i),
      cro: inteiroRotulo(b, /(?:CRO|CONTADOR\s+DE\s+REIN[ÍI]CIO)/i),
      coo: inteiroRotulo(b, /COO/i),
      gt: rotulo(b, /GRANDE\s+TOTAL/i),
      equipamento: ((b.match(/N[ºO°]?\s*DE\s+S[ÉE]RIE\s*:?\s*(\S+)/i) || [])[1] || '').trim() || null,
      origem: { formato: 'Redução Z impressa', arquivo, referencia: `bloco ${i + 1}` },
    }))
  }
  if (!out.length) avisos.push('Nenhum bloco de redução Z pôde ser lido por completo.')
  return { movimentos: out, avisos, formato: 'Redução Z impressa' }
}

/** Primeiro número monetário que aparece depois do rótulo. */
function rotulo (texto, rx) {
  const m = texto.match(new RegExp(rx.source + '[^\\d\\n-]{0,40}(-?[\\d.]+,\\d{2})', 'i'))
  return m ? numeroBR(m[1]) : null
}
function inteiroRotulo (texto, rx) {
  const m = texto.match(new RegExp(rx.source + '[^\\d\\n]{0,20}(\\d{1,9})', 'i'))
  return m ? Number(m[1]) : null
}

/* ------------------------------------------------- 3. Tabular (Z ou PDV) */

const SINONIMOS_MOV = {
  cnpj: ['cnpj', 'cnpjcpf', 'cnpj/cpf', 'estabelecimento', 'documento'],
  luc: ['luc', 'numeroloja', 'numerodaloja', 'nloja', 'numloja', 'codigoloja', 'codloja', 'loja'],
  data: ['data', 'dia', 'datavenda', 'datamovimento', 'datareducao', 'dtdoc', 'dataemissao', 'competencia', 'periodo'],
  valor: ['valor', 'vendabruta', 'vendabrutadiaria', 'total', 'totalvendas', 'valortotal', 'venda', 'vendas',
    'faturamento', 'receita', 'vlbrt', 'valorbruto', 'totalliquido', 'valorvenda'],
  crz: ['crz', 'contadorreducaoz', 'reducaoz', 'numeroz', 'nz'],
  cro: ['cro', 'contadorreinicio'],
  gt: ['grandetotal', 'gt', 'gtfin', 'totalizadorgeral'],
  coo: ['coo', 'contadorordemoperacao'],
  equipamento: ['ecf', 'equipamento', 'caixa', 'pdv', 'terminal', 'serie', 'numeroserie'],
  cancelamentos: ['cancelamentos', 'cancelados', 'valorcancelado', 'cancelamento'],
  descontos: ['descontos', 'desconto', 'valordesconto'],
}

/**
 * Planilha ou CSV de redução Z / PDV: uma linha por dia (ou por dia e terminal).
 * Linhas do mesmo dia são somadas — é o caso de relatório quebrado por forma de
 * pagamento ou por caixa.
 */
function parseMovimentoTabular (linhas, opts = {}) {
  const fonte = opts.fonte || 'pdv'
  const avisos = []
  const { i: iCab, mapa: mapaAuto } = acharCabecalho(linhas, SINONIMOS_MOV)
  const mapa = opts.mapa || mapaAuto
  if (iCab === -1 || mapa.valor == null) {
    return { movimentos: [], avisos: ['Não encontrei uma coluna de valor nesta planilha. Use o mapeamento de colunas.'], mapa, formato: 'Tabular' }
  }
  if (mapa.data == null) {
    return { movimentos: [], avisos: ['Não encontrei uma coluna de data. Use o mapeamento de colunas.'], mapa, formato: 'Tabular' }
  }
  // sem coluna de CNPJ, procura um no bloco de rótulos acima do cabeçalho
  const cnpjArquivo = normalizarCnpj(opts.cnpjPadrao) || (mapa.cnpj == null ? cnpjNoCabecalho(linhas, iCab + 1) : null)
  const out = []
  let semData = 0
  for (let r = iCab + 1; r < linhas.length; r++) {
    const linha = linhas[r]
    if (!linha || linha.every(c => c === '' || c == null)) continue
    const valor = numeroBR(linha[mapa.valor])
    if (!Number.isFinite(valor)) continue
    const data = normalizarData(linha[mapa.data])
    if (!data) { semData++; continue }
    const cnpjLido = mapa.cnpj != null ? String(linha[mapa.cnpj] ?? '').replace(/\D/g, '') : ''
    out.push(mov({
      // só vale como CNPJ o que tem 14 dígitos; o resto é tratado pela LUC
      cnpj: (cnpjLido.length === 14 ? cnpjLido : null) || cnpjArquivo,
      luc: mapa.luc != null ? String(linha[mapa.luc] ?? '').trim() || null : null,
      data, competencia: competenciaDe(data), fonte, valor,
      crz: mapa.crz != null ? inteiro(linha[mapa.crz]) : null,
      cro: mapa.cro != null ? inteiro(linha[mapa.cro]) : null,
      gt: mapa.gt != null ? numeroFinito(linha[mapa.gt]) : null,
      coo: mapa.coo != null ? inteiro(linha[mapa.coo]) : null,
      equipamento: mapa.equipamento != null ? String(linha[mapa.equipamento] ?? '').trim() || null : null,
      cancelamentos: mapa.cancelamentos != null ? numeroFinito(linha[mapa.cancelamentos]) : null,
      descontos: mapa.descontos != null ? numeroFinito(linha[mapa.descontos]) : null,
      origem: { formato: 'Tabular', arquivo: opts.arquivo || '', referencia: `linha ${r + 1}` },
    }))
  }
  if (semData) avisos.push(`${semData} linha(s) sem data legível foram ignoradas.`)
  const semCnpj = out.filter(m => !m.cnpj && !m.luc).length
  if (semCnpj) avisos.push(`${semCnpj} linha(s) sem CNPJ nem número da loja — informe o CNPJ padrão do arquivo.`)
  return { movimentos: out, avisos, mapa, formato: `Tabular (${NOME_FONTE_TRI[fonte] || fonte})` }
}

/* ------------------------------------------ 4. Relatório de PDV impresso */

const RX_DATA_LINHA = /\b(\d{2}\/\d{2}\/\d{4})\b/
const RX_VALORES = /-?\d{1,3}(?:\.\d{3})*,\d{2}\b/g

/**
 * Relatório de vendas do PDV em PDF ou foto: uma linha por dia (ou por dia e
 * caixa, ou por dia e forma de pagamento), cada uma com a data e um valor. O
 * layout muda de sistema para sistema, então a leitura é por padrão e não por
 * posição: em cada linha com data, o último número monetário é o valor da
 * linha, e as linhas do mesmo dia são somadas. Linhas de total são ignoradas
 * para não dobrar o mês.
 */
function parsePdvImpresso (entrada, arquivo = '', opts = {}) {
  const texto = Array.isArray(entrada) ? entrada.join('\n') : String(entrada)
  const fonte = opts.fonte || 'pdv'
  const cnpjDoc = normalizarCnpj((texto.match(/C\.?N\.?P\.?J\.?[\s.:/]*([\d]{2}[.\s]?\d{3}[.\s]?\d{3}[/\s]?\d{4}[-\s]?\d{2})/i) || [])[1]) ||
    normalizarCnpj(opts.cnpjPadrao)
  const porDia = new Map()
  const avisos = []
  let linhasComData = 0
  for (const linha of texto.split(/\r?\n/)) {
    if (/\b(sub)?total\b|acumulad|somat[óo]rio/i.test(linha)) continue
    const md = linha.match(RX_DATA_LINHA)
    if (!md) continue
    const data = normalizarData(md[1])
    if (!data) continue
    const valores = (linha.slice(md.index + md[1].length).match(RX_VALORES) || [])
    if (!valores.length) continue
    linhasComData++
    const valor = numeroBR(valores[valores.length - 1])
    if (!Number.isFinite(valor)) continue
    const eq = (linha.match(/\b(PDV|CAIXA|TERMINAL|ECF)\s*-?\s*(\d{1,3})\b/i) || [])
    const chave = data
    const acc = porDia.get(chave) || { data, valor: 0, linhas: 0, equipamentos: new Set() }
    acc.valor = Math.round((acc.valor + valor) * 100) / 100
    acc.linhas++
    if (eq.length) acc.equipamentos.add(eq[1].toUpperCase() + eq[2])
    porDia.set(chave, acc)
  }
  if (!porDia.size) {
    return { movimentos: [], avisos: ['Não encontrei linhas com data e valor neste relatório de PDV.'], formato: 'PDV impresso' }
  }
  const movimentos = [...porDia.values()].sort((a, b) => a.data.localeCompare(b.data)).map(d => mov({
    cnpj: cnpjDoc, data: d.data, competencia: competenciaDe(d.data), fonte, valor: d.valor,
    equipamento: d.equipamentos.size === 1 ? [...d.equipamentos][0] : null,
    origem: { formato: 'PDV impresso', arquivo, referencia: `${d.linhas} linha(s) do dia` },
  }))
  if (!cnpjDoc) avisos.push('O relatório não traz CNPJ — informe o CNPJ padrão do arquivo ou escolha o lojista.')
  return { movimentos, avisos, formato: 'PDV impresso', linhasLidas: linhasComData }
}

/** Escolhe o parser pelo conteúdo. */
function parseMovimentoTexto (texto, arquivo = '', opts = {}) {
  const t = String(texto)
  if (/\|C405\|/.test(t) || (/^\|0000\|/m.test(t) && /\|C400\|/.test(t))) return parseReducaoZSped(t, arquivo)
  if (RX_Z_BLOCO.test(t)) return parseReducaoZImpressa(opts.paginas || t, arquivo)
  const pdv = parsePdvImpresso(opts.paginas || t, arquivo, opts)
  if (pdv.movimentos.length) return pdv
  return { movimentos: [], avisos: ['Formato não reconhecido: esperava um cupom de redução Z ou um relatório de PDV com data e valor por linha.'], formato: 'desconhecido' }
}

/* ======================================================= motor da triangulação */

const STATUS_TRI = {
  COERENTE: 'COERENTE',
  ATENCAO: 'ATENÇÃO',
  DISPERSO: 'DISPERSO',
  FONTE_UNICA: 'FONTE ÚNICA',
}

/**
 * Cruza os tipos de lançamento de venda — redução Z, PDV, NAPP e declarado —
 * por CNPJ e competência, e também dia a dia. A leitura é pelo MAIOR valor e
 * pela maior variação em reais entre os tipos (maior − menor), não pelo
 * percentual. Com um tipo só não há triangulação — a linha é marcada como tal
 * em vez de fingir concordância.
 *
 * @param {Array} movimentos  saída dos parsers (fonte 'z', 'pdv' e 'napp')
 * @param {Array} declarados  registros mensais { cnpj, competencia, valor }
 */
function triangular (movimentos, declarados = [], opts = {}) {
  const lim = limitesTri(opts)

  /* --- diário: Z x PDV x NAPP --- */
  const dias = new Map()
  for (const m of movimentos) {
    if (!m || !m.data) continue
    const k = `${m.cnpj || 'SEM-CNPJ'}|${m.data}`
    if (!dias.has(k)) dias.set(k, { cnpj: m.cnpj, data: m.data, competencia: m.competencia, z: null, pdv: null, napp: null, registros: [] })
    const d = dias.get(k)
    d[m.fonte] = arred2((d[m.fonte] || 0) + (Number(m.valor) || 0))
    d.registros.push(m)
  }
  const porDia = [...dias.values()].map(d => {
    const dif = (d.z != null && d.pdv != null) ? arred2(d.z - d.pdv) : null
    const base = Math.max(Math.abs(d.z || 0), Math.abs(d.pdv || 0))
    const percent = dif == null ? null : (base > 0 ? arred2(dif / base * 100) : 0)
    const r = resumirFontes({ z: d.z, pdv: d.pdv, napp: d.napp }, { triCoerenteReais: lim.dia, triAtencaoReais: lim.dia })
    return { ...d, dif, percent, maior: r.maior, fonteMaior: r.fonteMaior, variacao: r.amplitude, status: r.status }
  }).sort(ordenarDia)

  /* --- mensal: Z x PDV x declarado --- */
  const meses = new Map()
  const chaveMes = (cnpj, comp) => `${cnpj || 'SEM-CNPJ'}|${comp}`
  const pegar = (cnpj, comp) => {
    const k = chaveMes(cnpj, comp)
    if (!meses.has(k)) {
      meses.set(k, { chave: k, cnpj, cnpjFmt: formatarCnpj(cnpj), competencia: comp,
        competenciaLabel: competenciaLabel(comp), z: null, pdv: null, napp: null, declarado: null,
        diasZ: 0, diasPdv: 0, diasNapp: 0, alertas: [], equipamentos: new Set(), arquivos: new Set() })
    }
    return meses.get(k)
  }
  for (const d of porDia) {
    const p = pegar(d.cnpj, d.competencia)
    if (d.z != null) { p.z = arred2((p.z || 0) + d.z); p.diasZ++ }
    if (d.pdv != null) { p.pdv = arred2((p.pdv || 0) + d.pdv); p.diasPdv++ }
    if (d.napp != null) { p.napp = arred2((p.napp || 0) + d.napp); p.diasNapp++ }
    for (const r of d.registros) {
      if (r.equipamento) p.equipamentos.add(r.equipamento)
      if (r.origem && r.origem.arquivo) p.arquivos.add(r.origem.arquivo)
    }
  }
  for (const r of declarados) {
    if (!r || !r.cnpj || !r.competencia) continue
    const p = pegar(r.cnpj, r.competencia)
    p.declarado = arred2((p.declarado || 0) + (Number(r.valor) || 0))
  }

  const porMes = [...meses.values()].map(p => {
    const r = resumirFontes({ z: p.z, pdv: p.pdv, napp: p.napp, declarado: p.declarado }, opts)
    const difZP = (p.z != null && p.pdv != null) ? arred2(p.z - p.pdv) : null
    const difDZ = (p.declarado != null && p.z != null) ? arred2(p.declarado - p.z) : null
    const difDP = (p.declarado != null && p.pdv != null) ? arred2(p.declarado - p.pdv) : null

    const alertas = [...p.alertas]
    if (difZP != null && -difZP > lim.coerente) {
      alertas.push({ tipo: 'venda_sem_documento', grave: true,
        texto: `O PDV registra ${moedaBR(Math.abs(difZP))} a mais do que a redução Z. ` +
          'A leitura direta é venda sem documento fiscal — confira antes de concluir.' })
    }
    if (difZP != null && difZP > lim.coerente) {
      alertas.push({ tipo: 'z_maior_que_pdv',
        texto: `A redução Z registra ${moedaBR(difZP)} a mais do que o PDV. ` +
          'Costuma ser exportação incompleta do PDV, não venda a mais.' })
    }
    if (r.naoDeclarado != null && r.naoDeclarado > lim.coerente) {
      alertas.push({ tipo: 'declarado_a_menor', grave: true,
        texto: `Foi declarado ${moedaBR(r.naoDeclarado)} a menos do que o maior valor registrado ` +
          `(${nomesFonte(r.fonteMaior)} ${moedaBR(r.maior)}).` })
    }
    return { ...p, equipamentos: [...p.equipamentos], arquivos: [...p.arquivos],
      difZP, difDZ, difDP, ...r, alertas, explicacao: explicarTri(p, r) }
  }).sort(ordenarMes)

  return { porDia, porMes, sequencia: conferirSequencia(movimentos), resumo: resumirTri(porMes) }
}

/** "PDV", "PDV e NAPP" — quando dois tipos empatam no maior valor, os dois aparecem. */
const nomesFonte = (lista) => (lista || []).map(k => NOME_FONTE_TRI[k] || k).join(' e ')

function explicarTri (p, r) {
  if (r.status === STATUS_TRI.FONTE_UNICA) {
    const curto = { z: 'a redução Z', pdv: 'o PDV', napp: 'o NAPP', declarado: 'o declarado' }
    const tem = ['z', 'pdv', 'napp', 'declarado'].filter(f => p[f] != null)
    return tem.length ? `Só ${curto[tem[0]]}. Falta uma segunda fonte.` : 'Nenhuma fonte com valor.'
  }
  const partes = [`Maior valor: ${nomesFonte(r.fonteMaior)} ${moedaBR(r.maior)}`]
  if (r.status === STATUS_TRI.COERENTE) return `${partes[0]}. Os tipos de lançamento variam ${moedaBR(r.amplitude)}, dentro do limite.`
  partes.push(`variação de ${moedaBR(r.amplitude)} entre os tipos de lançamento`)
  if (r.naoDeclarado) partes.push(`${moedaBR(r.naoDeclarado)} acima do declarado`)
  const difZP = (p.z != null && p.pdv != null) ? arred2(p.z - p.pdv) : null
  if (difZP != null && Math.abs(difZP) > 0.05) {
    partes.push(difZP < 0 ? `PDV acima da Z em ${moedaBR(Math.abs(difZP))}` : `Z acima do PDV em ${moedaBR(difZP)}`)
  }
  return partes.join('; ') + '.'
}

/**
 * Duas conferências que só a redução Z permite, e que pegam o que a subtração
 * entre fontes não pega:
 *
 *  CRZ  o contador de reduções Z sobe de um em um. Um salto significa que a
 *       redução daquele dia não está no material entregue.
 *  GT   o Grande Total é acumulador e não zera. A diferença entre o GT de duas
 *       reduções seguidas tem de ser igual à venda bruta da segunda; quando não
 *       é, houve movimento entre elas que não aparece na sequência.
 */
function conferirSequencia (movimentos) {
  const alertas = []
  const grupos = new Map()
  for (const m of movimentos) {
    if (m.fonte !== 'z') continue
    const k = `${m.cnpj || 'SEM-CNPJ'}|${m.equipamento || 'ECF'}`
    if (!grupos.has(k)) grupos.set(k, [])
    grupos.get(k).push(m)
  }
  for (const [k, lista] of grupos) {
    const [cnpj, equipamento] = k.split('|')
    const ordenada = [...lista].sort((a, b) => (a.data || '').localeCompare(b.data || '') || (a.crz || 0) - (b.crz || 0))
    let anterior = null
    for (const m of ordenada) {
      if (anterior) {
        if (m.crz != null && anterior.crz != null && m.crz - anterior.crz > 1) {
          alertas.push({ tipo: 'crz_com_salto', grave: true, cnpj, equipamento, data: m.data,
            texto: `${formatarCnpj(cnpj)} · ${equipamento}: o contador de redução Z pula de ${anterior.crz} ` +
              `(${dataLabel(anterior.data)}) para ${m.crz} (${dataLabel(m.data)}). ` +
              `Falta${m.crz - anterior.crz - 1 > 1 ? 'm' : ''} ${m.crz - anterior.crz - 1} redução(ões) no material entregue.` })
        }
        if (m.gt != null && anterior.gt != null) {
          const esperado = arred2(m.gt - anterior.gt)
          const dif = arred2(esperado - (m.valor || 0))
          if (Math.abs(dif) > 0.05) {
            alertas.push({ tipo: 'grande_total_nao_fecha', grave: true, cnpj, equipamento, data: m.data,
              texto: `${formatarCnpj(cnpj)} · ${equipamento}: entre ${dataLabel(anterior.data)} e ${dataLabel(m.data)} ` +
                `o Grande Total avançou ${moedaBR(esperado)}, mas a venda bruta do dia é ${moedaBR(m.valor)} — ` +
                `sobra ${moedaBR(dif)} sem redução Z correspondente.` })
          }
        }
        if (m.gt != null && anterior.gt != null && m.gt < anterior.gt) {
          alertas.push({ tipo: 'grande_total_retrocede', grave: true, cnpj, equipamento, data: m.data,
            texto: `${formatarCnpj(cnpj)} · ${equipamento}: o Grande Total caiu de ${moedaBR(anterior.gt)} ` +
              `para ${moedaBR(m.gt)}. Ele é acumulador e não deveria diminuir nunca.` })
        }
      }
      anterior = m
    }
  }
  return alertas
}

function resumirTri (porMes) {
  const r = { competencias: porMes.length, coerente: 0, atencao: 0, disperso: 0, fonteUnica: 0,
    totalZ: 0, totalPdv: 0, totalNapp: 0, totalDeclarado: 0, totalNaoDeclarado: 0, maiorDispersao: null, maiorVariacao: null, alertasGraves: 0 }
  for (const p of porMes) {
    if (p.status === STATUS_TRI.COERENTE) r.coerente++
    else if (p.status === STATUS_TRI.ATENCAO) r.atencao++
    else if (p.status === STATUS_TRI.DISPERSO) r.disperso++
    else r.fonteUnica++
    r.totalZ += p.z || 0; r.totalPdv += p.pdv || 0; r.totalNapp += p.napp || 0
    // o declarado só entra no total onde há Z, PDV ou NAPP para comparar: somar o
    // ano inteiro declarado contra um mês de Z faria o card mentir
    if (p.z != null || p.pdv != null || p.napp != null) { r.totalDeclarado += p.declarado || 0; r.totalNaoDeclarado += p.naoDeclarado || 0 }
    if (p.amplitude != null && (!r.maiorVariacao || p.amplitude > r.maiorVariacao.amplitude)) r.maiorVariacao = p
    r.alertasGraves += (p.alertas || []).filter(a => a.grave).length
    if (p.dispersao != null && (!r.maiorDispersao || p.dispersao > r.maiorDispersao.dispersao)) r.maiorDispersao = p
  }
  r.totalZ = arred2(r.totalZ); r.totalPdv = arred2(r.totalPdv); r.totalNapp = arred2(r.totalNapp)
  r.totalDeclarado = arred2(r.totalDeclarado); r.totalNaoDeclarado = arred2(r.totalNaoDeclarado)
  return r
}

const ordenarDia = (a, b) => (a.cnpj || '').localeCompare(b.cnpj || '') || (a.data || '').localeCompare(b.data || '')
const ordenarMes = (a, b) => (a.cnpj || '').localeCompare(b.cnpj || '') || (a.competencia || '').localeCompare(b.competencia || '')

/* ================== cruzamento final: triangulação x auditoria fiscal ===== */

const VEREDITO = {
  COERENTE: 'TUDO FECHA',
  PARCIAL: 'FONTES DE MENOS',
  ATENCAO: 'ATENÇÃO',
  GRAVE: 'INVESTIGAR',
}

/**
 * Junta as quatro fontes numa linha só por CNPJ e competência:
 *
 *   Apurado    o que sai do livro fiscal (CFOP) ou do extrato do Simples
 *   Redução Z  o que o equipamento fiscal registrou
 *   PDV        o que o sistema comercial registrou
 *   Informado  o que foi declarado na planilha
 *
 * A referência é o apurado quando existe, porque é a peça que o fisco já tem;
 * sem ele, a redução Z assume. Toda diferença é medida contra essa referência,
 * e a linha diz qual fonte é a referência para ninguém comparar contra o que não
 * imagina.
 */
function cruzarComAuditoria (periodosFiscais, porMes, opts = {}) {
  // mesma régua da triangulação: a maior diferença em reais contra a referência
  const lim = limitesTri(opts)

  const linhas = new Map()
  const pegar = (cnpj, comp, empresa) => {
    const k = `${cnpj || 'SEM-CNPJ'}|${comp}`
    if (!linhas.has(k)) {
      linhas.set(k, { chave: k, cnpj, cnpjFmt: formatarCnpj(cnpj), competencia: comp,
        competenciaLabel: competenciaLabel(comp), empresa: empresa || null,
        apurado: null, tipoApurado: null, z: null, pdv: null, napp: null, informado: null, alertas: [] })
    }
    const l = linhas.get(k)
    if (!l.empresa && empresa) l.empresa = empresa
    return l
  }

  for (const p of periodosFiscais || []) {
    const l = pegar(p.cnpj, p.competencia, p.empresa)
    // sem o livro de saídas o "apurado" seria zero por falta de arquivo, não por falta de venda
    const semSaidas = p.tipo !== 'declaracao' && Array.isArray(p.livros) && p.livros.length > 0 && !p.livros.includes('saidas')
    l.apurado = semSaidas ? null : (p.vendasLiquidas ?? null)
    if (semSaidas) l.alertas.push({ tipo: 'livro_incompleto', texto: 'Livro de saídas não carregado: o apurado desta competência fica fora do cruzamento.' })
    l.tipoApurado = p.tipo === 'declaracao' ? 'extrato do Simples' : 'livro fiscal'
    l.informado = p.informado ?? null
    if (p.alertas) l.alertas.push(...p.alertas.filter(a => a.tipo === 'exige_revisao' || a.tipo === 'cfop_desconhecido'))
  }
  for (const t of porMes || []) {
    const l = pegar(t.cnpj, t.competencia)
    l.z = t.z; l.pdv = t.pdv; l.napp = t.napp ?? null
    if (t.fechado !== undefined) l.fechado = t.fechado   // veio do histórico mensal (fechado) ou da sessão (aberto)
    if (t.declarado != null && l.informado == null) l.informado = t.declarado
    if (t.alertas) l.alertas.push(...t.alertas)
  }

  const out = [...linhas.values()].map(l => {
    const referencia = l.apurado != null ? 'apurado' : l.z != null ? 'z' : null
    const base = referencia ? l[referencia] : null
    const campos = ['apurado', 'z', 'pdv', 'napp', 'informado']
    const presentes = campos.filter(c => l[c] != null)

    const desvios = {}
    for (const c of campos) {
      desvios[c] = (base == null || l[c] == null || c === referencia) ? null
        : { valor: arred2(l[c] - base), percent: base !== 0 ? arred2((l[c] - base) / Math.abs(base) * 100) : null }
    }
    const piorPercent = Math.max(0, ...Object.values(desvios).filter(Boolean).map(d => Math.abs(d.percent ?? 0)))
    const piorValor = Math.max(0, ...Object.values(desvios).filter(Boolean).map(d => Math.abs(d.valor)))

    const grave = l.alertas.some(a => a.grave)
    const veredito = presentes.length < 2 ? VEREDITO.PARCIAL
      : grave ? VEREDITO.GRAVE
      : piorValor <= lim.coerente ? VEREDITO.COERENTE
      : piorValor <= lim.atencao ? VEREDITO.ATENCAO : VEREDITO.GRAVE
    const valoresPresentes = presentes.map(c => l[c])
    const maior = valoresPresentes.length ? Math.max(...valoresPresentes) : null

    return { ...l, referencia, desvios, piorPercent: arred2(piorPercent), piorValor: arred2(piorValor),
      maior, fonteMaior: presentes.filter(c => l[c] === maior),
      fontes: presentes.length, veredito, leitura: lerCruzamento(l, desvios, referencia, presentes) }
  }).sort(ordenarMes)

  return { linhas: out, resumo: resumirCruzamento(out) }
}

const NOME_FONTE = { apurado: 'apurado', z: 'redução Z', pdv: 'PDV', napp: 'NAPP', informado: 'informado' }

function lerCruzamento (l, desvios, referencia, presentes) {
  if (!referencia) {
    return presentes.length
      ? `Só ${presentes.map(c => 'o ' + NOME_FONTE[c]).join(' e ')} — sem apurado nem redução Z não há referência para cruzar.`
      : 'Nenhuma fonte com valor nesta competência.'
  }
  if (presentes.length < 2) {
    return `Só o ${NOME_FONTE[referencia]} tem valor aqui. Carregue ao menos mais uma fonte para cruzar.`
  }
  const partes = []
  for (const [campo, d] of Object.entries(desvios)) {
    if (!d || Math.abs(d.valor) <= 0.05) continue
    partes.push(`${NOME_FONTE[campo]} ${d.valor > 0 ? 'acima' : 'abaixo'} do ${NOME_FONTE[referencia]} em ` +
      `${moedaBR(Math.abs(d.valor))}${d.percent != null ? ` (${percentBR(Math.abs(d.percent))})` : ''}`)
  }
  if (!partes.length) return `As ${presentes.length} fontes fecham com o ${NOME_FONTE[referencia]}.`
  return partes.join('; ') + '.'
}

function resumirCruzamento (linhas) {
  const r = { competencias: linhas.length, coerente: 0, atencao: 0, grave: 0, parcial: 0, pior: null }
  for (const l of linhas) {
    if (l.veredito === VEREDITO.COERENTE) r.coerente++
    else if (l.veredito === VEREDITO.ATENCAO) r.atencao++
    else if (l.veredito === VEREDITO.GRAVE) r.grave++
    else r.parcial++
    if (l.fontes >= 2 && (!r.pior || l.piorValor > r.pior.piorValor)) r.pior = l
  }
  return r
}

/* ------------------------------------------------------------------ export */

const escCsv = (v) => v == null ? '' : typeof v === 'number' ? String(v).replace('.', ',')
  : /[";\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v)

function triangulacaoCsv (porMes) {
  const cab = ['CNPJ', 'Competência', 'Redução Z', 'PDV', 'NAPP', 'Declarado', 'Maior valor', 'Tipo do maior valor',
    'Variação R$ (maior − menor)', 'Não declarado R$ (maior − declarado)', 'Z − PDV', 'Dispersão %',
    'Dias com Z', 'Dias com PDV', 'Dias com NAPP', 'Status', 'Leitura']
  const linhas = [cab.join(';')]
  for (const p of porMes) {
    linhas.push([p.cnpjFmt, p.competenciaLabel, p.z, p.pdv, p.napp, p.declarado, p.maior, nomesFonte(p.fonteMaior),
      p.amplitude, p.naoDeclarado, p.difZP, p.dispersao, p.diasZ, p.diasPdv, p.diasNapp, p.status, p.explicacao].map(escCsv).join(';'))
  }
  return '\ufeff' + linhas.join('\r\n')
}

function cruzamentoCsv (linhas) {
  const cab = ['CNPJ', 'Empresa', 'Competência', 'Referência', 'Apurado (livro/extrato)', 'Redução Z',
