/** O roteiro de testes da base fictícia em Markdown. */
function roteiroMarkdown (base) {
  const fmt = (c) => c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5')
  return `# Roteiro de testes — base fictícia do Radar de Auditoria\n\nGerada em ${base.geradaEm.split('-').reverse().join('/')}. ` +
    `${base.lojistas.length} lojistas inventados; os ${base.cenarios.length} cenários abaixo são fixos (sempre iguais), os demais lojistas são aleatórios para dar volume.\n\n` +
    '| # | Loja | CNPJ | Processo | O que deve aparecer | Onde |\n|---|---|---|---|---|---|\n' +
    base.cenarios.map((c, i) => `| ${i + 1} | ${c.loja} | ${fmt(c.cnpj)} | ${c.processo} | ${c.situacao} | ${c.onde} |`).join('\n') + '\n'
}

/** A carteira da base fictícia em CSV, no formato que a aba Lojistas importa. */
function lojistasFicticiosCsv (base) {
  const cel = (v) => /[;"]/.test(String(v ?? '')) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v ?? '')
  const fmtCnpj = (c) => c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5')
  const linhas = [['LUC', 'Loja', 'Razão Social', 'CNPJ', 'UF', 'Início do contrato', 'E-mail', 'WhatsApp', 'Regime', 'Segmento'],
    ...base.lojistas.map(l => [l.luc, l.nome, l.razao, fmtCnpj(l.cnpj), l.uf, (l.inicioContrato || '').split('-').reverse().join('/'), l.email, l.telefone,
      l.regime === 'simples' ? 'Simples Nacional' : 'Lucro presumido', l.segmento])]
  return '﻿' + linhas.map(l => l.map(cel).join(';')).join('\r\n') + '\r\n'
}


/* ===== src/apurar.js ===== */
/**
 * Motor de apuração de vendas e conciliação com a planilha informada.
 * Puro: recebe lançamentos já parseados, devolve números e divergências.
 */


const BASE_DECLARACAO = {
  total: 'Receita bruta total declarada',
  mercadoria: 'Só revenda de mercadorias (exclui serviço com ISS)',
}

const MEDIDA = {
  valorContabil: 'Valor contábil / total da operação',
  baseCalculo: 'Base de cálculo do ICMS',
}

const CHAVE = (l) => `${l.cnpj || 'SEM-CNPJ'}|${l.competencia || 'SEM-COMP'}`

/**
 * @param {Array} lancamentos
 * @param {object} opts
 *   medida: 'valorContabil' | 'baseCalculo'
 *   overrides: { [cfop]: { natureza, descricao } }
 *   fontePreferida: { [`cnpj|comp|livro`]: fonteId }  — desempate quando há duas origens
 */
function apurar (lancamentos, opts = {}) {
  const medida = opts.medida || 'valorContabil'
  const overrides = opts.overrides || {}
  const preferida = opts.fontePreferida || {}

  const conflitos = detectarConflitos(lancamentos)
  const usados = lancamentos.filter(l => {
    const k = `${l.cnpj}|${l.competencia}|${l.livro}`
    const c = conflitos.get(k)
    if (!c) return true
    const escolhida = preferida[k] || c.fontes[0].fonteId
    return (l.origem && l.origem.fonteId) === escolhida
  })

  const periodos = new Map()
  for (const l of usados) {
    const k = CHAVE(l)
    if (!periodos.has(k)) {
      periodos.set(k, {
        chave: k,
        cnpj: l.cnpj, cnpjFmt: formatarCnpj(l.cnpj),
        empresa: l.empresa || null,
        competencia: l.competencia,
        competenciaLabel: competenciaLabel(l.competencia),
        vendasBrutas: 0, devolucoes: 0, vendasLiquidas: 0,
        ativo: 0, servicoIss: 0, naoVenda: 0, naoVendaSaidas: 0, naoVendaEntradas: 0, contraLancamento: 0,
        revisar: 0, desconhecido: 0,
        totalEntradas: 0, totalSaidas: 0,
        porCfop: new Map(), alertas: [], livros: new Set(), fontes: new Set(),
        confiancaMinima: 'alta',
      })
    }
    const p = periodos.get(k)
    if (!p.empresa && l.empresa) p.empresa = l.empresa
    if (l.livro) p.livros.add(l.livro)
    if (l.origem && l.origem.arquivo) p.fontes.add(l.origem.arquivo)
    if (l.confianca === 'baixa') p.confiancaMinima = 'baixa'
    else if (l.confianca === 'media' && p.confiancaMinima === 'alta') p.confiancaMinima = 'media'

    if (l.semMovimento || !l.cfop) continue

    const cls = classificarCfop(l.cfop, overrides)
    const valor = Number(l[medida]) || 0

    // coerência entre o CFOP e o livro em que ele foi lançado
    if (l.livro && cls.sentido && ((cls.sentido === 'saida') !== (l.livro === 'saidas'))) {
      p.alertas.push({
        tipo: 'cfop_no_livro_errado', cfop: cls.cfop, valor,
        texto: `CFOP ${cls.cfop} (${cls.sentido}) aparece no livro de ${l.livro}. ${cls.descricao}`,
      })
    }

    if (l.livro === 'entradas') p.totalEntradas += valor
    if (l.livro === 'saidas') p.totalSaidas += valor

    switch (cls.natureza) {
      case NATUREZA.VENDA: p.vendasBrutas += valor; break
      case NATUREZA.DEVOLUCAO_VENDA:
      case NATUREZA.ANULACAO_SAIDA: p.devolucoes += valor; break
      case NATUREZA.ATIVO: p.ativo += valor; break
      case NATUREZA.SERVICO_ISS: p.servicoIss += valor; break
      case NATUREZA.CONTRA_LANCAMENTO: p.contraLancamento += valor; break
      case NATUREZA.REVISAR:
        p.revisar += valor
        p.alertas.push({ tipo: 'exige_revisao', cfop: cls.cfop, valor,
          texto: `CFOP ${cls.cfop} é genérico (${cls.descricao}). ${fmt(valor)} ficou FORA das vendas — confira se deveria entrar.` })
        break
      case NATUREZA.DESCONHECIDO:
        p.desconhecido += valor
        p.alertas.push({ tipo: 'cfop_desconhecido', cfop: cls.cfop, valor,
          texto: `CFOP ${cls.cfop} não está na tabela. ${fmt(valor)} ficou FORA das vendas até você classificá-lo.` })
        break
      default:
        p.naoVenda += valor
        if (l.livro === 'entradas') p.naoVendaEntradas += valor
        else p.naoVendaSaidas += valor
    }

    const pc = p.porCfop.get(cls.cfop) || { cfop: cls.cfop, natureza: cls.natureza, descricao: cls.descricao,
      sentido: cls.sentido, livro: l.livro, valor: 0, base: 0, icms: 0, qtd: 0, fonte: cls.fonte }
    pc.valor += valor
    pc.base += Number(l.baseCalculo) || 0
    pc.icms += Number(l.icms) || 0
    pc.qtd += 1
    p.porCfop.set(cls.cfop, pc)
  }

  for (const p of periodos.values()) {
    p.vendasLiquidas = round2(p.vendasBrutas - p.devolucoes)
    p.vendasBrutas = round2(p.vendasBrutas)
    p.devolucoes = round2(p.devolucoes)
    for (const campo of ['ativo', 'servicoIss', 'naoVenda', 'naoVendaSaidas', 'naoVendaEntradas',
      'contraLancamento', 'revisar', 'desconhecido', 'totalEntradas', 'totalSaidas']) {
      p[campo] = round2(p[campo])
    }
    p.livros = [...p.livros]
    p.fontes = [...p.fontes]
    p.cfops = [...p.porCfop.values()].sort((a, b) => b.valor - a.valor)
    delete p.porCfop
    if (!p.livros.includes('saidas')) {
      p.alertas.push({ tipo: 'sem_livro_saidas',
        texto: 'Nenhum livro de SAÍDAS foi carregado para esta competência — as vendas apuradas podem estar incompletas.' })
    }
    if (!p.livros.includes('entradas')) {
      p.alertas.push({ tipo: 'sem_livro_entradas',
        texto: 'Nenhum livro de ENTRADAS foi carregado — devoluções de venda (que reduzem o faturamento) não foram deduzidas.' })
    }
  }

  return {
    periodos: [...periodos.values()].sort(ordenar),
    conflitos: [...conflitos.values()],
    medida,
  }
}

/**
 * Monta períodos a partir de declarações do Simples Nacional (PGDAS-D).
 *
 * Para empresa do Simples é o extrato — e não o livro de ICMS — que serve de
 * referência contra a venda informada. Não há CFOP aqui: a receita já vem
 * apurada, então não há o que somar ou subtrair por código.
 */
function apurarDeclaracoes (registros, opts = {}) {
  const base = opts.baseDeclaracao || 'total'
  const periodos = new Map()
  for (const r of registros || []) {
    if (!r || !r.cnpj || !r.competencia) continue
    const k = `${r.cnpj}|${r.competencia}`
    const d = r.detalhe || null
    const temQuebra = !!d && (d.mercadoria || d.servico || d.outros)
    const valor = (base === 'mercadoria' && temQuebra) ? round2(d.mercadoria) : round2(r.valor)

    const anterior = periodos.get(k)
    // entre duas declarações do mesmo mês, vale a que traz o detalhe por atividade
    if (anterior && !(temQuebra && !anterior.temQuebra)) continue

    const alertas = []
    if (base === 'mercadoria' && !temQuebra) {
      alertas.push({ tipo: 'sem_quebra_por_atividade',
        texto: 'Este mês veio do histórico consolidado do extrato, que não separa mercadoria de serviço. ' +
          `Foi usada a receita bruta total (${fmt(r.valor)}).` })
    }
    periodos.set(k, {
      chave: k, tipo: 'declaracao',
      cnpj: r.cnpj, cnpjFmt: formatarCnpj(r.cnpj), empresa: r.empresa || null,
      competencia: r.competencia, competenciaLabel: competenciaLabel(r.competencia),
      vendasBrutas: valor, devolucoes: 0, vendasLiquidas: valor,
      ativo: 0, servicoIss: d ? round2(d.servico) : 0, naoVenda: 0, naoVendaSaidas: 0, naoVendaEntradas: 0,
      contraLancamento: 0, revisar: 0, desconhecido: 0, totalEntradas: 0, totalSaidas: 0,
      cfops: [], livros: [], fontes: [r.arquivo || '—'], confiancaMinima: 'alta',
      declarado: { total: round2(r.valor), mercadoria: d ? round2(d.mercadoria) : null,
        servico: d ? round2(d.servico) : null, escopo: r.escopo || null, rotulo: r.fonte || 'PGDAS-D' },
      temQuebra, alertas,
    })
  }
  return { periodos: [...periodos.values()].sort(ordenar), base }
}

/**
 * Junta o que veio dos livros fiscais com o que veio das declarações.
 * Havendo os dois para a mesma competência, o livro continua sendo a base —
 * é dele que sai o detalhe por CFOP — e o valor declarado vira alerta, que é
 * uma terceira conferência de graça.
 */
function mesclarApuracao (deLivros, deDeclaracoes) {
  const out = new Map()
  for (const p of deLivros) out.set(`${p.cnpj}|${p.competencia}`, p)
  for (const d of deDeclaracoes) {
    const k = `${d.cnpj}|${d.competencia}`
    const livro = out.get(k)
    if (!livro) { out.set(k, d); continue }
    const dif = round2(livro.vendasLiquidas - d.vendasLiquidas)
    livro.declarado = d.declarado
    livro.alertas = [...(livro.alertas || []), { tipo: 'livro_x_declaracao',
      texto: Math.abs(dif) <= 0.05
        ? `O livro fiscal e o extrato do Simples batem (${fmt(d.vendasLiquidas)}).`
        : `O extrato do Simples declara ${fmt(d.vendasLiquidas)} nesta competência — ` +
          `${fmt(Math.abs(dif))} ${dif > 0 ? 'a menos que' : 'a mais que'} o livro fiscal.` }]
  }
  return [...out.values()].sort(ordenar)
}

function detectarConflitos (lancamentos) {
  const mapa = new Map()
  for (const l of lancamentos) {
    if (!l.cnpj || !l.competencia || !l.livro) continue
    const k = `${l.cnpj}|${l.competencia}|${l.livro}`
    const fonteId = (l.origem && l.origem.fonteId) || (l.origem && l.origem.arquivo) || '?'
    if (!mapa.has(k)) mapa.set(k, new Map())
    const m = mapa.get(k)
    if (!m.has(fonteId)) m.set(fonteId, { fonteId, arquivo: (l.origem && l.origem.arquivo) || '?', formato: (l.origem && l.origem.formato) || '?', qtd: 0, total: 0 })
    const f = m.get(fonteId)
    f.qtd++; f.total += Number(l.valorContabil) || 0
  }
  const conflitos = new Map()
  for (const [k, m] of mapa) {
    if (m.size > 1) {
      const [cnpj, competencia, livro] = k.split('|')
      conflitos.set(k, { chave: k, cnpj, competencia, livro, fontes: [...m.values()] })
    }
  }
  return conflitos
}

/* ------------------------------------------------------------- conciliação */

const STATUS = {
  OK: 'OK',
  ATENCAO: 'ATENÇÃO',
  DIVERGENTE: 'DIVERGENTE',
  SO_LIVRO: 'SÓ NA APURAÇÃO',
  SO_PLANILHA: 'SÓ NO INFORMADO',
  INCOMPLETO: 'LIVRO INCOMPLETO',
}

/**
 * Cruza a apuração dos livros com a planilha de vendas informadas.
 * @param {Array} periodos saída de apurar().periodos
 * @param {Array} informadas saída de parseVendasInformadas().registros
 * @param {{toleranciaReais?:number, toleranciaPercent?:number}} opts
 */
function conciliar (periodos, informadasBrutas, opts = {}) {
  const tolR = opts.toleranciaReais ?? 0.05
  const tolP = opts.toleranciaPercent ?? 0.5   // %
  const atencaoP = opts.atencaoPercent ?? 2    // %
  const { informadas, conflitosVendas } = resolverFontesDeVenda(informadasBrutas)

  const porChave = new Map()
  for (const p of periodos) porChave.set(CHAVE(p), { ...p, informado: null, linhasPlanilha: [] })

  for (const r of informadas) {
    const k = `${r.cnpj}|${r.competencia}`
    if (!porChave.has(k)) {
      porChave.set(k, {
        chave: k, cnpj: r.cnpj, cnpjFmt: formatarCnpj(r.cnpj), empresa: r.empresa,
        competencia: r.competencia, competenciaLabel: competenciaLabel(r.competencia),
        vendasBrutas: null, devolucoes: null, vendasLiquidas: null,
        alertas: [], cfops: [], livros: [], fontes: [], informado: 0, linhasPlanilha: [],
      })
    }
    const p = porChave.get(k)
    if (!p.empresa && r.empresa) p.empresa = r.empresa
    p.informado = round2((p.informado || 0) + r.valor)
    p.linhasPlanilha.push(r)
  }

  const linhas = []
  // a chave vem do próprio mapa: o objeto do período pode não carregar o campo
  for (const [chave, p] of porChave) {
    const temLivro = p.vendasLiquidas !== null && p.vendasLiquidas !== undefined
    const temPlanilha = p.informado !== null && p.informado !== undefined
    let status, diferenca = null, percent = null

    if (temLivro && temPlanilha) {
      diferenca = round2(p.vendasLiquidas - p.informado)
      const base = Math.max(Math.abs(p.vendasLiquidas), Math.abs(p.informado))
      percent = base > 0 ? round2((diferenca / base) * 100) : 0
      const dentro = Math.abs(diferenca) <= tolR || Math.abs(percent) <= tolP
      /*
       * Sem o livro de saídas da competência não há venda para comparar: a
       * diferença é falta de arquivo, não divergência. Chamar isso de
       * DIVERGENTE afogaria as divergências de verdade no relatório.
       */
      status = (p.tipo !== 'declaracao' && !(p.livros || []).includes('saidas')) ? STATUS.INCOMPLETO
        : dentro ? STATUS.OK
        : (Math.abs(percent) <= atencaoP ? STATUS.ATENCAO : STATUS.DIVERGENTE)
    } else if (temLivro) {
      status = STATUS.SO_LIVRO
    } else {
      status = STATUS.SO_PLANILHA
    }

    if (p.linhasPlanilha.length > 1) {
      const onde = p.linhasPlanilha.map(l => l.linha).filter(Boolean)
      p.alertas = [...(p.alertas || []), { tipo: 'planilha_duplicada',
        texto: `A mesma origem traz ${p.linhasPlanilha.length} linhas para este CNPJ/competência` +
          (onde.length ? ` (linhas ${onde.join(', ')})` : '') + ' — foram somadas.' }]
    }
    const conf = conflitosVendas.get(chave)
    if (conf) p.alertas = [...(p.alertas || []), conf]
    const dec = p.declarado
    if (dec && dec.servico > 0 && dec.mercadoria != null && temPlanilha) {
      const difMerc = round2(dec.mercadoria - p.informado)
      p.alertas = [...(p.alertas || []), { tipo: 'receita_de_servico',
        texto: `A receita declarada inclui ${fmt(dec.servico)} de serviço tributado pelo ISS. ` +
          `Considerando só revenda de mercadorias (${fmt(dec.mercadoria)}), a diferença seria ${fmt(difMerc)}.` }]
    }

    linhas.push({ ...p, status, diferenca, percent,
      explicacao: explicar(p, diferenca, status) })
  }

  linhas.sort(ordenar)
  return { linhas, resumo: resumir(linhas) }
}

/**
 * Peso de cada origem de venda informada quando duas cobrem o mesmo mês.
 * A declaração por estabelecimento é a mais forte: é o número entregue à
 * Receita para aquele CNPJ. Depois vem o histórico do extrato, que é
 * consolidado da empresa. Por último a planilha, que é mantida à mão.
 */
const PESO_FONTE = (r) => r.escopo === 'estabelecimento' ? 3 : r.escopo === 'empresa' ? 2 : 1

/**
 * Duas origens para o mesmo CNPJ e competência não podem ser somadas — isso
 * dobraria a venda informada. Fica a de maior peso, e a divergência entre
 * elas vira alerta em vez de sumir na conta.
 */
function resolverFontesDeVenda (registros) {
  const porChaveFonte = new Map()
  for (const r of registros || []) {
    const chave = `${r.cnpj}|${r.competencia}`
    const fonte = r.fonteId || r.arquivo || 'origem'
    if (!porChaveFonte.has(chave)) porChaveFonte.set(chave, new Map())
    const m = porChaveFonte.get(chave)
    if (!m.has(fonte)) m.set(fonte, { fonte, arquivo: r.arquivo || '—', rotulo: r.fonte || 'planilha', peso: PESO_FONTE(r), total: 0, itens: [] })
    const f = m.get(fonte)
    f.total = round2(f.total + (Number(r.valor) || 0))
    f.itens.push(r)
  }

  const informadas = []
  const conflitosVendas = new Map()
  for (const [chave, m] of porChaveFonte) {
    const fontes = [...m.values()].sort((a, b) => b.peso - a.peso)
    const escolhida = fontes[0]
    informadas.push(...escolhida.itens)
    if (fontes.length > 1) {
      const divergem = fontes.some(f => Math.abs(f.total - escolhida.total) > 0.01)
      if (divergem) {
        conflitosVendas.set(chave, { tipo: 'fontes_de_venda_divergem',
          texto: `Mais de uma origem informa esta competência: ` +
            fontes.map(f => `${f.arquivo} (${f.rotulo}) ${fmt(f.total)}`).join(' · ') +
            `. Usei ${escolhida.arquivo}; as outras foram ignoradas para não somar duas vezes.` })
      }
    }
  }
  return { informadas, conflitosVendas }
}

function explicar (p, diferenca, status) {
  if (status === STATUS.INCOMPLETO) {
    return 'O livro de SAÍDAS desta competência não foi carregado — sem ele não há venda para comparar. ' +
      'Carregue o livro de saídas do mês antes de tirar conclusão desta linha.'
  }
  if (status === STATUS.SO_LIVRO) {
    return p.tipo === 'declaracao'
      ? 'Há receita declarada no extrato do Simples e nenhuma venda informada para esta competência.'
      : 'Existe movimento no livro fiscal e nenhuma venda informada para esta competência.'
  }
  if (status === STATUS.SO_PLANILHA) return 'Há venda informada e nenhuma apuração (livro fiscal ou extrato) para esta competência.'
  if (status === STATUS.OK) return 'A apuração e o informado batem dentro da tolerância.'
  const pistas = []
  if (diferenca < 0) {
    pistas.push(p.tipo === 'declaracao'
      ? 'o informado é MAIOR do que a receita declarada no Simples'
      : 'o informado é MAIOR do que o livro registra')
    if (p.revisar > 0) pistas.push(`há ${fmt(p.revisar)} em CFOP genérico (x.949) fora das vendas`)
    if (p.naoVendaSaidas > 0) pistas.push(`há ${fmt(p.naoVendaSaidas)} em saídas que não são venda (remessa, bonificação, transferência)`)
    if (p.contraLancamento > 0) pistas.push(`há ${fmt(p.contraLancamento)} em contra-lançamento (x.922/x.929)`)
  } else {
    pistas.push(p.tipo === 'declaracao'
      ? 'a receita declarada no Simples é MAIOR do que o informado'
      : 'o livro registra MAIS do que o informado')
    if (p.devolucoes > 0) pistas.push(`as devoluções de venda já deduzidas somam ${fmt(p.devolucoes)}`)
  }
  if (p.desconhecido > 0) pistas.push(`${fmt(p.desconhecido)} está em CFOP não classificado`)
  return pistas.join('; ') + '.'
}

function resumir (linhas) {
  const r = { periodos: linhas.length, ok: 0, atencao: 0, divergente: 0, soLivro: 0, soPlanilha: 0,
    incompleto: 0, totalLivro: 0, totalPlanilha: 0, totalDiferenca: 0, maiorDivergencia: null }
  for (const l of linhas) {
    if (l.status === STATUS.OK) r.ok++
    else if (l.status === STATUS.ATENCAO) r.atencao++
    else if (l.status === STATUS.DIVERGENTE) r.divergente++
    else if (l.status === STATUS.SO_LIVRO) r.soLivro++
    else if (l.status === STATUS.INCOMPLETO) r.incompleto++
    else r.soPlanilha++
    r.totalLivro += l.vendasLiquidas || 0
    r.totalPlanilha += l.informado || 0
    // uma competência sem o livro de saídas não entra na diferença total
    if (l.diferenca != null && l.status !== STATUS.INCOMPLETO) {
      r.totalDiferenca += l.diferenca
      if (!r.maiorDivergencia || Math.abs(l.diferenca) > Math.abs(r.maiorDivergencia.diferenca)) r.maiorDivergencia = l
    }
  }
  r.totalLivro = round2(r.totalLivro)
  r.totalPlanilha = round2(r.totalPlanilha)
  r.totalDiferenca = round2(r.totalDiferenca)
  return r
}

function ordenar (a, b) {
  return (a.cnpj || '').localeCompare(b.cnpj || '') || (a.competencia || '').localeCompare(b.competencia || '')
}

function round2 (n) { return Math.round((Number(n) || 0) * 100) / 100 }

function fmt (n) {
  return (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
}

/* ------------------------------------------------------------------ export */

const CSV_COLUNAS = [
  ['cnpjFmt', 'CNPJ'], ['empresa', 'Empresa'], ['competenciaLabel', 'Competência'],
  ['vendasBrutas', 'Receita apurada (livro ou extrato)'], ['devolucoes', 'Devoluções de venda'],
  ['vendasLiquidas', 'Apurado líquido'], ['informado', 'Vendas informadas'],
  ['diferenca', 'Diferença'], ['percent', 'Diferença %'], ['status', 'Status'],
  ['naoVendaSaidas', 'Saídas que não são venda'], ['naoVendaEntradas', 'Entradas que não são devolução'],
  ['revisar', 'CFOP genérico (revisar)'],
  ['desconhecido', 'CFOP não classificado'], ['ativo', 'Venda de ativo'],
  ['servicoIss', 'Serviço ISS'], ['contraLancamento', 'Contra-lançamento'],
  ['explicacao', 'Observação'],
]

function paraCsv (linhas) {
  const esc = (v) => {
    if (v == null) return ''
    const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v)
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s
  }
  const out = [CSV_COLUNAS.map(c => c[1]).join(';')]
  for (const l of linhas) out.push(CSV_COLUNAS.map(c => esc(l[c[0]])).join(';'))
  return '﻿' + out.join('\r\n')
}

function detalhePorCfopCsv (periodos) {
  const esc = (v) => (v == null ? '' : typeof v === 'number' ? String(v).replace('.', ',') : String(v))
  const out = ['CNPJ;Empresa;Competência;Livro;CFOP;Natureza;Descrição;Qtd;Valor;Base de cálculo;ICMS']
  for (const p of periodos) {
    for (const c of p.cfops || []) {
      out.push([p.cnpjFmt, p.empresa, p.competenciaLabel, c.livro, c.cfop, c.natureza, c.descricao,
        c.qtd, c.valor, c.base, c.icms].map(esc).join(';'))
    }
  }
  return '﻿' + out.join('\r\n')
}


/* ===== src/ingest.js ===== */
/**
 * Camada de leitura de arquivos. Só roda no navegador.
 * Nada aqui envia dados para lugar nenhum: tudo é lido com FileReader e
 * processado em memória. pdf.js e SheetJS estão embutidos na própria página.
 */


const FORMATOS_ACEITOS = '.pdf,.txt,.csv,.xls,.xlsx,.xlsm,.png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp'
/** A triangulação recebe só o que sai da loja como documento: PDF ou foto. */
const FORMATOS_TRIANGULACAO = '.pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp,.heic'
const EXT_TRIANGULACAO = new Set(['pdf', 'png', 'jpg', 'jpeg', 'webp', 'tif', 'tiff', 'bmp', 'heic', 'gif'])
const ehFormatoDeTriangulacao = (nome) => EXT_TRIANGULACAO.has(ext(nome))
/** O NAPP chega em planilha, um valor por dia: é o único lançamento da triangulação que entra em Excel. */
const FORMATOS_NAPP = '.xlsx,.xls,.xlsm,.csv'
const EXT_NAPP = new Set(['xlsx', 'xls', 'xlsm', 'csv'])

const ext = (nome) => (String(nome).match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase()

/**
 * Lê um arquivo e devolve { tipo, texto?, paginas?, linhas?, aviso? }.
 * @param {File} file
 * @param {(msg:string)=>void} [progresso]
 */
async function lerArquivo (file, progresso = () => {}) {
  const e = ext(file.name)
  if (e === 'pdf') {
    progresso(pdfNaThreadPrincipal() ? 'lendo PDF (sem worker — pode travar a tela por alguns segundos)…' : 'lendo PDF…')
    const paginas = await textoDePdf(file, progresso)
    const vazio = paginas.every(p => !p.trim())
    return { tipo: 'pdf', paginas, texto: paginas.join('\n'), confianca: 'alta',
      aviso: vazio ? 'Este PDF não tem camada de texto (provavelmente é digitalizado). Ative o OCR ou exporte o livro em TXT/Excel.' : null }
  }
  if (['xls', 'xlsx', 'xlsm', 'xlsb', 'ods'].includes(e)) {
    progresso('lendo planilha…')
    return { tipo: 'planilha', abas: await linhasDePlanilha(file), confianca: 'alta' }
  }
  if (e === 'csv' || e === 'tsv') {
    progresso('lendo CSV…')
    const texto = await lerTexto(file)
    return { tipo: 'planilha', texto, abas: [{ nome: file.name, linhas: csvParaLinhas(texto) }], confianca: 'alta' }
  }
  if (['png', 'jpg', 'jpeg', 'webp', 'tif', 'tiff', 'bmp', 'gif'].includes(e)) {
    progresso('rodando OCR (pode demorar)…')
    const texto = await ocr(file, progresso)
    return { tipo: 'imagem', texto, paginas: [texto], confianca: 'baixa',
      aviso: 'Texto obtido por OCR de imagem. Confira valor por valor antes de usar o resultado como definitivo.' }
  }
  progresso('lendo texto…')
  const texto = await lerTexto(file)
  return { tipo: 'texto', texto, paginas: [texto], confianca: 'alta' }
}

/* ------------------------------------------------------------------- PDF */

let pdfPronto = false
function prepararPdfJs () {
  if (pdfPronto) return
  const lib = globalThis.pdfjsLib
  if (!lib) throw new Error('pdf.js não carregou.')
  if (globalThis.__PDF_ERRO__) throw new Error(globalThis.__PDF_ERRO__)
  if (globalThis.__PDF_WORKER_SRC__) lib.GlobalWorkerOptions.workerSrc = globalThis.__PDF_WORKER_SRC__
  else if (!globalThis.pdfjsWorker) throw new Error('O motor de leitura de PDF não carregou. Use SPED (.txt), Excel ou CSV.')
  pdfPronto = true
}

/** true quando o PDF é processado na thread principal (ambiente sem Worker). */
function pdfNaThreadPrincipal () {
  return !globalThis.__PDF_WORKER_SRC__ && !!globalThis.pdfjsWorker
}

/**
 * Descobre em que ângulo o texto da página foi desenhado.
 *
 * Livro fiscal em A4 retrato com conteúdo em paisagem é comum: o texto sai
 * com matriz [0,1,-1,0], girado 90°. Lido como se estivesse na horizontal,
 * ele vira "SOÇIVRES" em vez de "SERVIÇOS" e nenhum cabeçalho é reconhecido.
 * O peso é por quantidade de caracteres, para um carimbo solto de lado não
 * decidir a orientação da página inteira.
 */
function rotacaoDoTexto (items) {
  const peso = new Map()
  for (const it of items || []) {
    if (!it.str || !it.str.trim() || !it.transform) continue
    const g = (Math.round(Math.atan2(it.transform[1], it.transform[0]) * 180 / Math.PI / 90) * 90 + 360) % 360
    peso.set(g, (peso.get(g) || 0) + it.str.trim().length)
  }
  let melhor = 0; let max = -1
  for (const [g, n] of peso) if (n > max) { max = n; melhor = g }
  return melhor
}

/** Extrai o texto de cada página, endireitando o que estiver girado. */
async function textoDePdf (file, progresso = () => {}) {
  prepararPdfJs()
  const lib = globalThis.pdfjsLib
  const buf = await file.arrayBuffer()
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise
  const paginas = []
  for (let i = 1; i <= pdf.numPages; i++) {
    if (i % 10 === 0 || i === 1) progresso(`lendo PDF… página ${i}/${pdf.numPages}`)
    const page = await pdf.getPage(i)
    const conteudo = await page.getTextContent()
    const giro = rotacaoDoTexto(conteudo.items)
    /*
     * O viewport gira no MESMO ângulo do texto, não no oposto: compondo
     * V(θ)·T(θ) a matriz do fragmento volta a [s,0,0,-s], que é texto
     * horizontal no espaço da tela. Usar 360-θ deixa a página espelhada —
     * a ordem das linhas e a das palavras saem ambas de trás para frente.
     */
    const viewport = page.getViewport({ scale: 1, rotation: giro })
    paginas.push(montarLinhas(conteudo.items, { projetar: projetorDeViewport(lib, viewport) }))
    page.cleanup()
  }
  await pdf.destroy()
  return paginas
}

/** Leva cada fragmento para o espaço da tela já endireitado. */
function projetorDeViewport (lib, viewport) {
  return (it) => {
    const t = lib.Util.transform(viewport.transform, it.transform)
    return { x: t[4], y: t[5], w: it.width || 0 }   // no espaço da tela, y cresce para baixo
  }
}

/**
 * Agrupa os fragmentos de texto do pdf.js em linhas legíveis.
 * `projetar` converte um fragmento em {x, y, w} já endireitado; sem ele, o
 * fragmento é lido como está (usado nos testes e em páginas sem rotação).
 */
function montarLinhas (items, opts = {}) {
  const tolerancia = opts.tolerancia ?? 2.2
  const projetar = opts.projetar || (it => ({ x: it.transform[4], y: -it.transform[5], w: it.width || 0 }))
  const frags = items
    .filter(it => typeof it.str === 'string' && it.str.length)
    .map(it => { const q = projetar(it); return { x: q.x, y: q.y, s: it.str, w: q.w } })
  if (!frags.length) return ''
  frags.sort((a, b) => (a.y - b.y) || (a.x - b.x))
  const linhas = []
  let atual = null
  for (const f of frags) {
    if (!atual || Math.abs(atual.y - f.y) > tolerancia) {
      atual = { y: f.y, frags: [f] }
      linhas.push(atual)
    } else {
      atual.frags.push(f)
    }
  }
  return linhas.map(l => {
    l.frags.sort((a, b) => a.x - b.x)
    let texto = ''
    let fimAnterior = null
    for (const f of l.frags) {
      if (fimAnterior !== null && f.x - fimAnterior > 1 && !/\s$/.test(texto) && !/^\s/.test(f.s)) texto += ' '
      texto += f.s
      fimAnterior = f.x + f.w
    }
    return texto.trim()
  }).filter(Boolean).join('\n')
}

/* -------------------------------------------------------------- planilhas */

async function linhasDePlanilha (file) {
  const XLSX = globalThis.XLSX
  if (!XLSX) throw new Error('SheetJS não carregou.')
  const buf = await file.arrayBuffer()
  const wb = XLSX.read(buf, { type: 'array', cellDates: true, raw: false })
  return wb.SheetNames.map(nome => ({
    nome,
    linhas: XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: false, defval: '', blankrows: false }),
  }))
}

/** CSV/TSV simples com aspas, detectando ; , ou tab. */
function csvParaLinhas (texto) {
  const t = String(texto).replace(/^﻿/, '')
  const amostra = t.slice(0, 5000)
  const sep = [';', ',', '\t'].map(s => [s, (amostra.split(s).length - 1)]).sort((a, b) => b[1] - a[1])[0][0]
  const linhas = []
  let campo = ''; let linha = []; let aspas = false
  for (let i = 0; i < t.length; i++) {
    const c = t[i]
    if (aspas) {
      if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++ } else aspas = false }
      else campo += c
    } else if (c === '"') aspas = true
    else if (c === sep) { linha.push(campo); campo = '' }
    else if (c === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = '' }
    else if (c === '\r') { /* ignora */ }
    else campo += c
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha) }
  return linhas
}

function lerTexto (file) {
  return new Promise((ok, erro) => {
    const fr = new FileReader()
    fr.onerror = () => erro(new Error('Falha ao ler o arquivo.'))
    fr.onload = () => {
      const buf = new Uint8Array(fr.result)
      let txt = new TextDecoder('utf-8', { fatal: false }).decode(buf)
      // SPED e livros exportados costumam vir em latin-1
      if (/\uFFFD/.test(txt)) txt = new TextDecoder('windows-1252').decode(buf)
      ok(txt)
    }
    fr.readAsArrayBuffer(file)
  })
}

/* -------------------------------------------------------------------- OCR */

const OCR_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'
let ocrCarregando = null

/**
 * OCR é o único recurso que precisa de internet: a biblioteca e o modelo de
 * idioma são baixados sob demanda. Fora dele, a página funciona 100% offline.
 */
async function carregarOcr () {
  if (globalThis.Tesseract) return globalThis.Tesseract
  if (!ocrCarregando) {
    ocrCarregando = new Promise((ok, erro) => {
      const s = document.createElement('script')
      s.src = OCR_CDN
      s.onload = () => globalThis.Tesseract ? ok(globalThis.Tesseract) : erro(new Error('tesseract.js carregou vazio.'))
      s.onerror = () => erro(new Error('Não foi possível baixar o OCR (tesseract.js). Verifique a conexão ou converta a foto em PDF/Excel.'))
      document.head.appendChild(s)
    })
  }
  return ocrCarregando
}

async function ocr (file, progresso = () => {}) {
  const T = await carregarOcr()
  const worker = await T.createWorker('por', 1, {
    logger: (m) => { if (m.status === 'recognizing text') progresso(`OCR ${Math.round((m.progress || 0) * 100)}%`) },
  })
  try {
    const { data } = await worker.recognize(file)
    return data.text || ''
  } finally {
    await worker.terminate()
  }
}

/* -------------------------------------------------- conversão -> lançamentos */

/**
 * Converte um arquivo lido em lançamentos, escolhendo o parser certo.
 * @param {object} lido  saída de lerArquivo
 * @param {object} opts  { arquivo, fonteId, formatoForcado, livroPadrao, cnpjPadrao, competenciaPadrao, mapa, aba }
 */
function extrairLancamentos (lido, opts = {}) {
  const arquivo = opts.arquivo || ''
  const marcar = (r) => {
    for (const l of r.lancamentos || []) {
      l.origem = { ...(l.origem || {}), arquivo, fonteId: opts.fonteId }
      if (lido.confianca === 'baixa' && l.confianca === 'alta') l.confianca = 'baixa'
    }
    if (lido.aviso) r.avisos = [lido.aviso, ...(r.avisos || [])]
    return r
  }

  if (lido.tipo === 'planilha') {
    const aba = (lido.abas || []).find(a => a.nome === opts.aba) || (lido.abas || [])[0]
    if (!aba) return { lancamentos: [], avisos: ['Planilha sem abas legíveis.'], formato: 'Tabular' }
    return marcar(parseTabularLivro(aba.linhas, { ...opts, arquivo }))
  }

  const texto = lido.texto || ''
  const paginas = lido.paginas || [texto]
  if (ehPgdasD(texto)) {
    const r = parsePgdasD(paginas, arquivo)
    for (const x of r.registros || []) { x.arquivo = x.arquivo || arquivo; x.fonteId = opts.fonteId }
    if (lido.aviso) r.avisos = [lido.aviso, ...(r.avisos || [])]
    return { lancamentos: [], declaracoes: r.registros, avisos: r.avisos, formato: r.formato, competencia: r.competencia }
  }
  const rodar = (formato) => {
    switch (formato) {
      case 'sped': return parseSpedEfd(texto, arquivo)
      case 'livro-classico': return parseLivroClassico(paginas, arquivo)
      case 'resumo-cst': return parseResumoCstCfop(paginas, arquivo, lido.confianca || 'alta')
      default: return parseTexto(texto, arquivo, { paginas, confianca: lido.confianca })
    }
  }
  const forcado = opts.formatoForcado
  const r = rodar(forcado)
  /*
   * Formato escolhido na mão que não lê nada costuma ser formato errado, e a
   * mensagem do parser sozinha não diz isso. Se a detecção automática acha
   * lançamentos, o aviso passa a dizer qual formato usar.
   */
  if (forcado && forcado !== 'auto' && !(r.lancamentos || []).length) {
    const auto = rodar(null)
    if ((auto.lancamentos || []).length) {
      r.avisos = [`Nenhum lançamento foi lido com o formato escolhido. Este arquivo parece ser ` +
        `"${auto.formato}" — mude o Formato para "detectar" (ou para esse formato) e ele lê ` +
        `${auto.lancamentos.length} lançamento(s).`, ...(r.avisos || [])]
    }
  }
  return marcar(r)
}

/**
 * Vendas informadas: planilha, CSV ou extrato do Simples Nacional (PGDAS-D).
 * O extrato é a receita declarada à Receita — a versão oficial do "quanto a
 * empresa disse que vendeu" —, então entra por aqui e não pelo livro fiscal.
 */
function extrairVendasInformadas (lido, opts = {}) {
  const arquivo = opts.arquivo || ''
  const marcar = (r) => {
    for (const x of r.registros || []) { x.arquivo = x.arquivo || arquivo; x.fonteId = opts.fonteId }
    if (lido.aviso) r.avisos = [lido.aviso, ...(r.avisos || [])]
    return r
  }
  if (lido.tipo !== 'planilha') {
    const texto = lido.texto || ''
    if (ehPgdasD(texto)) {
      return { registros: [],
        avisos: ['Este é um Extrato do Simples Nacional (PGDAS-D): ele é a receita declarada à Receita, ' +
          'a referência contra a qual a venda informada é conferida. Carregue-o no Passo 1.'] }
    }
    return marcar(parseVendasInformadas(csvParaLinhas(texto), { ...opts, arquivo }))
  }
  const aba = (lido.abas || []).find(a => a.nome === opts.aba) || (lido.abas || [])[0]
  if (!aba) return { registros: [], avisos: ['Planilha sem abas legíveis.'] }
  return marcar(parseVendasInformadas(aba.linhas, { ...opts, arquivo }))
}


/**
 * Movimento diário para a triangulação: redução Z ou relatório de PDV.
 * Aceita os mesmos formatos dos livros — SPED, PDF, planilha, CSV e foto.
 */
function extrairMovimentos (lido, opts = {}) {
  const arquivo = opts.arquivo || ''
  const fonte = opts.fonte || 'pdv'
  if (fonte === 'napp') {
    if (!EXT_NAPP.has(ext(arquivo))) throw new Error('O NAPP entra em planilha (Excel ou CSV), com um valor por dia.')
  } else if (!ehFormatoDeTriangulacao(arquivo)) {
    throw new Error('A redução Z e o relatório de PDV entram só em PDF ou foto (como saem da loja). ' +
      'Planilha, CSV e SPED não entram aqui — a planilha diária vai na caixa do NAPP.')
  }
  const marcar = (r) => {
    for (const m of r.movimentos || []) {
      m.origem = { ...(m.origem || {}), arquivo, fonteId: opts.fonteId }
      if (!m.fonte) m.fonte = fonte
      if (!m.cnpj && opts.cnpjPadrao) m.cnpj = opts.cnpjPadrao
    }
    if (lido.aviso) r.avisos = [lido.aviso, ...(r.avisos || [])]
    return r
  }
  if (lido.tipo === 'planilha') {
    const aba = (lido.abas || []).find(a => a.nome === opts.aba) || (lido.abas || [])[0]
    if (!aba) return { movimentos: [], avisos: ['Planilha sem abas legíveis.'], formato: 'Tabular' }
    return marcar(parseMovimentoTabular(aba.linhas, { ...opts, arquivo, fonte }))
  }
  const texto = lido.texto || ''
  const r = parseMovimentoTexto(texto, arquivo, { paginas: lido.paginas })
  // CSV solto cai no leitor de texto e não casa com nenhum formato conhecido
  if (!(r.movimentos || []).length && texto.includes(',') === false && texto.includes(';') === false) return marcar(r)
  if (!(r.movimentos || []).length) {
    const tab = parseMovimentoTabular(csvParaLinhas(texto), { ...opts, arquivo, fonte })
    if ((tab.movimentos || []).length) return marcar(tab)
  }
  return marcar(r)
}

/**
 * Interface do Radar de Auditoria (2.0).
 *
 * Duas cadências: a auditoria fiscal é anual (o ciclo abre em 1º de abril e
 * cobre os livros do ano anterior); a triangulação entra dia a dia ou semana a
 * semana e é fechada por mês. O acompanhamento — carteira de lojistas, marcos
 * de cada ciclo, notificações e fechamentos mensais — fica no localStorage
 * deste navegador. Os arquivos fiscais continuam só em memória.
 */









const $ = (sel, raiz = document) => raiz.querySelector(sel)
const $$ = (sel, raiz = document) => [...raiz.querySelectorAll(sel)]
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

const CHAVE_PREFS = 'apurador-fiscal:prefs:v1'
const CHAVE_ACOMP = 'radar-dispersao:acompanhamento:v2'

const estado = {
  livros: [],            // { id, nome, lido, opts, resultado }
  vendas: [],            // mesma forma; planilha, CSV ou extrato do PGDAS-D
  z: [],                 // reduções Z
  pdv: [],               // relatórios de PDV
  napp: [],              // NAPP: planilha diária
  prefs: {
    medida: 'valorContabil',
    baseDeclaracao: 'total',
    toleranciaReais: 0.05,
    toleranciaPercent: 0.5,

    // triangulação: leitura pela maior variação em R$ entre os tipos de lançamento

/* ------------------------------------------------------------- preferências */

function carregarPrefs () {
  try {
    const s = localStorage.getItem(CHAVE_PREFS)
    if (s) Object.assign(estado.prefs, JSON.parse(s))
  } catch { /* localStorage pode estar bloqueado — segue com os padrões */ }
  aplicarTema()
}
function salvarPrefs () {
  try { localStorage.setItem(CHAVE_PREFS, JSON.stringify(estado.prefs)) } catch { /* sem persistência */ }
}
function aplicarTema () {
  document.documentElement.dataset.tema = estado.prefs.tema === 'auto' ? '' : estado.prefs.tema
}

function carregarAcomp () {
  try {
    const s = localStorage.getItem(CHAVE_ACOMP)
    if (s) {
      const dados = JSON.parse(s)
      if (dados && dados.versao === VERSAO_ACOMPANHAMENTO) estado.acomp = { ...acompanhamentoVazio(), ...dados }
    }
  } catch { /* sem persistência: começa vazio */ }
}
function salvarAcomp () {
  try { localStorage.setItem(CHAVE_ACOMP, JSON.stringify(estado.acomp)) } catch { avisarSalvamento('Não consegui gravar o acompanhamento neste navegador.') }
}
const ciclo = () => cicloAtual(new Date(), estado.acomp.prefs.mesInicio || 4)
const lojistaDe = (cnpj) => estado.acomp.lojistas.find(l => l.cnpj === cnpj)
/** Nome para mostrar numa linha: o do arquivo e, se ele não trouxer, o da carteira. */
const nomeDe = (l) => l.empresa || (lojistaDe(l.cnpj) || {}).nome || ''

/**
 * Arquivo carregado é livro entregue: quem está na carteira e teve livro lido
 * nesta sessão ganha a data de recebimento; quem teve conciliação, a de
 * auditoria. Só preenche o que está vazio — data marcada à mão não é mexida.
 */
function marcarPelosArquivos (r) {
  if (!estado.acomp.lojistas.length) return
  const c = ciclo()
  let mudou = false
  const comLivro = new Set(r.periodos.map(p => p.cnpj))
  const comConciliacao = new Set(r.linhas.filter(l => l.status !== STATUS.SO_PLANILHA).map(l => l.cnpj))
  for (const l of estado.acomp.lojistas) {
    if (comLivro.has(l.cnpj)) {
      const reg = registroDe(estado.acomp, c.chave, l.cnpj)
      if (!reg.recebido) { reg.recebido = hojeIso(); reg.recebidoAuto = true; mudou = true }
      if (comConciliacao.has(l.cnpj) && !reg.auditado) { reg.auditado = hojeIso(); reg.auditadoAuto = true; mudou = true }
    }
  }
  if (mudou) salvarAcomp()
}

/* ------------------------------------------------------------ carga de arquivo */

let seq = 0

async function carregar (files, destino) {
  if (!files || !files.length) return
  estado.ocupado = true
  for (const file of files) {
    const id = 'f' + (++seq)
    const entrada = { id, nome: file.name, tamanho: file.size, lido: null, resultado: null, erro: null,
      opts: { formatoForcado: 'auto', livroPadrao: '', cnpjPadrao: '', competenciaPadrao: '', aba: '', mapa: null } }
    if (destino === 'planilha') estado.vendas.push(entrada)
    else if (ehTri(destino)) estado[destino].push(entrada)
    else estado.livros.push(entrada)
    renderizar()
    progresso(`${file.name}: lendo…`)
    try {
      entrada.lido = await lerArquivo(file, (msg) => progresso(`${file.name}: ${msg}`))
      if (entrada.lido.abas && entrada.lido.abas.length) entrada.opts.aba = entrada.lido.abas[0].nome
      processar(entrada, destino)
    } catch (e) {
      entrada.erro = e && e.message ? e.message : String(e)
    }
    renderizar()
  }
  progresso('')
  estado.ocupado = false
  renderizar()
}

function processar (entrada, destino) {
  const opts = { ...entrada.opts, arquivo: entrada.nome, fonteId: entrada.id }
  if (opts.formatoForcado === 'auto') delete opts.formatoForcado
  if (!opts.livroPadrao) delete opts.livroPadrao
  opts.cnpjPadrao = normalizarCnpj(opts.cnpjPadrao) || undefined
  opts.competenciaPadrao = normalizarCompetencia(opts.competenciaPadrao) || undefined
  entrada.resultado = destino === 'planilha' ? extrairVendasInformadas(entrada.lido, opts)
    : ehTri(destino) ? extrairMovimentos(entrada.lido, { ...opts, fonte: destino })
    : extrairLancamentos(entrada.lido, opts)
  if (ehTri(destino)) resolverLuc(entrada.resultado)
}

/** Os três tipos de lançamento que entram por arquivo na triangulação. */
const ehTri = (destino) => destino === 'z' || destino === 'pdv' || destino === 'napp'

/**
 * Planilha que traz o número da loja em vez do CNPJ (é o caso do NAPP): a LUC
 * é trocada pelo CNPJ da carteira. LUC que não está na carteira fica avisada.
 */
function resolverLuc (res) {
  if (!res || !res.movimentos) return
  const porLuc = new Map(estado.acomp.lojistas.filter(l => l.luc).map(l => [String(l.luc).trim(), l.cnpj]))
  const semCarteira = new Set()
  for (const m of res.movimentos) {
    if (m.cnpj || !m.luc) continue
    const cnpj = porLuc.get(String(m.luc).trim())
    if (cnpj) m.cnpj = cnpj
    else semCarteira.add(m.luc)
  }
  if (semCarteira.size) {
    res.avisos = [...(res.avisos || []), `Loja(s) ${[...semCarteira].join(', ')} sem CNPJ na carteira — cadastre na aba Lojistas ou escolha o lojista abaixo.`]
  }
}

function reprocessar (entrada, destino) {
  if (!entrada.lido) return
  try { processar(entrada, destino) } catch (e) { entrada.erro = String(e.message || e) }
  renderizar()
}

function progresso (msg) {
  const el = $('#progresso')
  if (el) { el.textContent = msg; el.style.display = msg ? '' : 'none' }
}

/* ------------------------------------------------------------------ cálculo */

function calcular () {
  const lancamentos = estado.livros.flatMap(l => (l.resultado && l.resultado.lancamentos) || [])
  const declaracoes = estado.livros.flatMap(l => (l.resultado && l.resultado.declaracoes) || [])
  const informadas = estado.vendas.flatMap(v => (v.resultado && v.resultado.registros) || [])
  const ap = apurar(lancamentos, {
    medida: estado.prefs.medida,
    overrides: estado.prefs.overrides,
    fontePreferida: estado.fontePreferida,
  })
  const dec = apurarDeclaracoes(declaracoes, { baseDeclaracao: estado.prefs.baseDeclaracao })
  const periodos = mesclarApuracao(ap.periodos, dec.periodos)
  const co = conciliar(periodos, informadas, estado.prefs)

  // movimento sem CNPJ (nem LUC achada na carteira) fica fora: o cartão do arquivo já avisa e pede o lojista
  const movimentos = [...estado.z, ...estado.pdv, ...estado.napp].flatMap(f => (f.resultado && f.resultado.movimentos) || []).filter(m => m.cnpj)
  const tri = triangular(movimentos, informadas, estado.prefs)
  // o cruzamento final usa o histórico fechado mais os meses abertos nesta sessão
  const historico = historicoParaCruzamento(estado.acomp.fechamentos, tri.porMes)
  const cruz = cruzarComAuditoria(co.linhas, historico, estado.prefs)
  const painel = resumoPainel(estado.acomp, ciclo())
  const soc = resumoSocietario(estado.acomp)

  return { ...ap, ...co, periodos, lancamentos, declaracoes, informadas, movimentos, tri, historico, cruz, painel, soc }
}

/* ---------------------------------------------------------------- render */

function renderizar () {
  const app = $('#app')
  if (!app) return
  let r = calcular()
  marcarPelosArquivos(r)
  r = { ...r, painel: resumoPainel(estado.acomp, ciclo()) }
  r.dash = { fiscal: dashFiscal(estado.acomp, ciclo()), tri: dashTriangulacao(estado.acomp, r.historico, { atencaoPercent: estado.prefs.atencaoPercent, competencia: estado.dashComp }), soc: dashSocietario(estado.acomp) }
  const pend = r.painel.pendentes.length + r.soc.pendentes.length
  const pendSoc = r.soc.aValidar.length + r.soc.pendentes.length
  app.innerHTML = `
    <nav class="abas" role="tablist">
      ${[['dashboard', 'Dashboard'], ['painel', 'Painel'], ['lojistas', `Lojistas${estado.acomp.lojistas.length ? ` (${estado.acomp.lojistas.length})` : ''}`],
         ['notificacoes', `Notificações${pend ? ` <b class="pendencia">${pend}</b>` : ''}`],

         ['triangulacao', `Triangulação${r.tri.porMes.length ? ` (${r.tri.porMes.length})` : ''}`],
         ['auditoria', `Auditoria fiscal${r.linhas.length ? ` (${r.linhas.length})` : ''}`],
         ['tabela', 'Tabela de códigos'], ['ajuda', 'Como funciona']]
        .map(([k, t]) => `<button role="tab" data-aba="${k}" aria-selected="${estado.aba === k}">${t}</button>`).join('')}

      Tudo o que você fizer aqui fica só neste navegador. <button class="leve" id="limpar-ficticia">Apagar base fictícia</button></div>` : ''}
    <div id="conteudo">${

      : estado.aba === 'painel' ? viewPainel(r)
      : estado.aba === 'lojistas' ? viewLojistas(r)
      : estado.aba === 'notificacoes' ? viewNotificacoes(r)

      : viewAjuda()
    }</div>`

}

function cartaoArquivo (e, tipo) {
  const res = e.resultado || {}
  const ehDeclaracao = !!(res.declaracoes && res.declaracoes.length)
  const ehMovimento = ehTri(tipo)
  const lanc = tipo === 'planilha' ? (res.registros || [])
    : ehMovimento ? (res.movimentos || [])
    : ehDeclaracao ? res.declaracoes : (res.lancamentos || [])
  const n = lanc.length
  const unidade = tipo === 'planilha' ? 'linha(s) de venda'
    : ehMovimento ? ({ z: 'redução(ões) Z', pdv: 'dia(s) de PDV', napp: 'dia(s) de NAPP' })[tipo]
    : ehDeclaracao ? 'competência(s) declarada(s)' : 'lançamento(s)'
  const cnpjs = [...new Set(lanc.map(l => l.cnpj).filter(Boolean))]
  const comps = [...new Set(lanc.map(l => l.competencia).filter(Boolean))].sort()
  const abas = (e.lido && e.lido.abas) || []
  return `
  <div class="arquivo" data-arq="${e.id}" data-tipo="${tipo}">
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div style="flex:1;min-width:0">
        <div class="nome">${esc(e.nome)}</div>
        <div class="meta">
          ${e.erro ? `<span class="tag erro">erro</span> ${esc(e.erro)}`
            : `${res.formato ? esc(res.formato) + ' · ' : ''}${n} ${unidade}
               ${cnpjs.length ? ` · ${cnpjs.length === 1 ? formatarCnpj(cnpjs[0]) : cnpjs.length + ' CNPJ'}` : ''}
               ${comps.length ? ` · ${comps.length === 1 ? competenciaLabel(comps[0]) : competenciaLabel(comps[0]) + '–' + competenciaLabel(comps[comps.length - 1])}` : ''}
               ${e.lido && e.lido.confianca === 'baixa' ? ' <span class="tag atencao">OCR — conferir</span>' : ''}`}
        </div>
      </div>
      <button class="icone" data-remover="${e.id}" title="Remover arquivo">✕</button>
    </div>
    <div class="opcoes">
      ${tipo === 'livro' && !ehDeclaracao ? `
        <label class="campo">Formato
          <select data-opt="formatoForcado">
            ${[['auto', 'detectar'], ['livro-classico', 'livro impresso (P1/P2)'], ['resumo-cst', 'resumo por CST/CFOP'], ['sped', 'SPED EFD']]
              .map(([k, t]) => `<option value="${k}" ${e.opts.formatoForcado === k ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </label>
        <label class="campo">Livro
          <select data-opt="livroPadrao">
            ${[['', 'pelo CFOP'], ['entradas', 'entradas'], ['saidas', 'saídas']]
              .map(([k, t]) => `<option value="${k}" ${e.opts.livroPadrao === k ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </label>` : ''}
      ${abas.length > 1 ? `<label class="campo">Aba
          <select data-opt="aba">${abas.map(a => `<option ${e.opts.aba === a.nome ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}</select>
        </label>` : ''}
      ${estado.acomp.lojistas.length ? `<label class="campo">Lojista (se o arquivo não trouxer CNPJ)
        <select data-opt="cnpjPadrao">
          <option value="">— pelo arquivo —</option>
          ${estado.acomp.lojistas.filter(l => l.ativo !== false).map(l => `<option value="${l.cnpj}" ${normalizarCnpj(e.opts.cnpjPadrao) === l.cnpj ? 'selected' : ''}>${esc(l.nome || l.razao)} · ${formatarCnpj(l.cnpj)}</option>`).join('')}
        </select>
      </label>` : `<label class="campo">CNPJ (se faltar no arquivo)
        <input data-opt="cnpjPadrao" value="${esc(e.opts.cnpjPadrao)}" placeholder="00.000.000/0000-00" size="18">
      </label>`}
      <label class="campo">Competência (se faltar)
        <input data-opt="competenciaPadrao" value="${esc(e.opts.competenciaPadrao)}" placeholder="01/2025" size="9">
      </label>
    </div>
    ${abas.length ? mapeamento(e, tipo) : ''}
    ${(res.avisos || []).length ? `<ul class="avisos">${res.avisos.slice(0, 12).map(a => `<li>${esc(a)}</li>`).join('')}
      ${res.avisos.length > 12 ? `<li class="info">…e mais ${res.avisos.length - 12} aviso(s).</li>` : ''}</ul>` : ''}

const CAMPOS_MAPA = [
  ['cnpj', 'CNPJ'], ['empresa', 'Empresa'], ['competencia', 'Competência'],
  ['cfop', 'CFOP'], ['livro', 'Entrada/Saída'], ['valorContabil', 'Valor contábil'],
  ['baseCalculo', 'Base de cálculo'], ['icms', 'ICMS'], ['valorInformado', 'Venda informada'],
]

function mapeamento (e, tipo) {
  const aba = (e.lido.abas || []).find(a => a.nome === e.opts.aba) || (e.lido.abas || [])[0]
  if (!aba || !aba.linhas.length) return ''
  const { i, mapa: auto } = acharCabecalho(aba.linhas)
  if (i === -1) return ''
  const cabecalho = aba.linhas[i].map(c => String(c ?? ''))
  const mapa = e.opts.mapa || auto
  const campos = tipo === 'planilha'
    ? CAMPOS_MAPA.filter(c => ['cnpj', 'empresa', 'competencia', 'valorInformado'].includes(c[0]))
    : CAMPOS_MAPA.filter(c => c[0] !== 'valorInformado')
  return `<details class="cfops" style="margin-top:8px"><summary>Mapeamento de colunas</summary>
    <div class="opcoes">${campos.map(([campo, rot]) => `
      <label class="campo">${rot}
        <select data-mapa="${campo}">
          <option value="">— nenhuma —</option>
          ${cabecalho.map((h, idx) => `<option value="${idx}" ${mapa[campo] === idx ? 'selected' : ''}>${esc(h || 'coluna ' + (idx + 1))}</option>`).join('')}
        </select>
      </label>`).join('')}</div>
    <p class="nota">Cabeçalho detectado na linha ${i + 1}.</p>
  </details>`
}

function blocoConflitos (conflitos) {

const TAG_TRI = {

const TAG_VEREDITO = {

/**
 * Célula de valor da triangulação. O maior valor da linha fica em destaque e com
 * o rótulo "maior" escrito — a cor sozinha não pode ser a única pista.
 */
function celTri (v, fonte, maiores, destacar = false) {
  if (v == null) return '<td class="num">—</td>'
  const eMaior = destacar && (maiores || []).includes(fonte)
  return `<td class="num${eMaior ? ' maior' : ''}">${fmt(v)}${eMaior ? '<div class="rot-maior">maior</div>' : ''}</td>`
}

function viewTriangulacao (r) {
  const t = r.tri
  const temFontes = estado.z.length || estado.pdv.length || estado.napp.length
  const lim = limitesTri(estado.prefs)
  return `
  <section class="painel">
    <div class="cab"><span class="passo">Z</span><div>
      <h2>Triangulação de vendas — entrada diária ou semanal, fechamento mensal</h2>
      <p class="sub">Quatro tipos de lançamento de venda que deveriam contar a mesma história: o que o <strong>equipamento fiscal</strong>
        registrou (redução Z), o que o <strong>PDV</strong> registrou, o que entrou no <strong>NAPP</strong> e o que foi <strong>declarado</strong>.
        Em cada mês e em cada dia o <strong>maior valor</strong> fica em destaque, e a leitura é pela <strong>maior variação em R$</strong>
        entre eles. Lance conforme chega da loja e feche cada mês quando ele terminar: o fechado vira histórico e é o que o
        cruzamento final usa contra a auditoria anual.</p>
    </div></div>
    <div class="grade3">
      <div>
        <h3>Redução Z</h3>
        <div class="drop" id="drop-z" tabindex="0" role="button">
          Arraste as reduções Z ou <strong>clique para escolher</strong>
          <div class="sub" style="margin-top:6px">cupom de redução Z em PDF ou foto</div>
        </div>
        <input type="file" id="in-z" multiple accept="${FORMATOS_TRIANGULACAO}" hidden>
        ${estado.z.map(e => cartaoArquivo(e, 'z')).join('')}
      </div>
      <div>
        <h3>Relatório de PDV</h3>
        <div class="drop" id="drop-pdv" tabindex="0" role="button">
          Arraste os relatórios de PDV ou <strong>clique para escolher</strong>
          <div class="sub" style="margin-top:6px">relatório de vendas por dia em PDF ou foto</div>
        </div>
        <input type="file" id="in-pdv" multiple accept="${FORMATOS_TRIANGULACAO}" hidden>
        ${estado.pdv.map(e => cartaoArquivo(e, 'pdv')).join('')}
      </div>
      <div>
        <h3>NAPP</h3>
        <div class="drop" id="drop-napp" tabindex="0" role="button">
          Arraste a planilha do NAPP ou <strong>clique para escolher</strong>
          <div class="sub" style="margin-top:6px">Excel diário: data, valor e CNPJ ou número da loja</div>
        </div>
        <input type="file" id="in-napp" multiple accept="${FORMATOS_NAPP}" hidden>
        ${estado.napp.map(e => cartaoArquivo(e, 'napp')).join('')}
      </div>
    </div>
    <p class="nota">O <em>declarado</em> vem da ficha de vendas informadas (Auditoria fiscal → Dados → Vendas informadas).
      Linhas do mesmo dia são somadas, então relatório quebrado por caixa ou por forma de pagamento entra direto.
      O NAPP sem CNPJ é ligado ao lojista pelo número da loja (LUC) da carteira. Foto passa por OCR: confira os valores lidos antes de fechar o mês.</p>
    <details class="cfops"><summary>Limites da leitura em R$ — mês: até ${fmt(lim.coerente)} coerente, até ${fmt(lim.atencao)} atenção; dia: até ${fmt(lim.dia)}</summary>
      <div class="opcoes" style="margin-top:8px">
        <label class="campo">Mês: coerente até (R$)<input type="number" id="p-tri-coerente" step="10" min="0" value="${lim.coerente}"></label>
        <label class="campo">Mês: atenção até (R$)<input type="number" id="p-tri-atencao" step="10" min="0" value="${lim.atencao}"></label>
        <label class="campo">Dia: coerente até (R$)<input type="number" id="p-tri-dia" step="10" min="0" value="${lim.dia}"></label>
      </div>
      <p class="nota">A variação é o maior valor menos o menor, entre os tipos de lançamento presentes. Acima do limite de atenção o mês fica DISPERSO.
        Os limites valem também para o cruzamento final e ficam salvos neste navegador.</p>
    </details>
  </section>

  ${!temFontes ? `<div class="painel vazio">Carregue a redução Z, o relatório de PDV ou o NAPP acima para triangular.</div>` : `
  <div class="cards">
    <div class="card"><div class="rot">Redução Z</div><div class="val">${fmt(t.resumo.totalZ)}</div></div>
    <div class="card"><div class="rot">PDV</div><div class="val">${fmt(t.resumo.totalPdv)}</div></div>
    <div class="card"><div class="rot">NAPP</div><div class="val">${fmt(t.resumo.totalNapp)}</div></div>
    <div class="card"><div class="rot">Declarado (meses com Z/PDV/NAPP)</div><div class="val">${fmt(t.resumo.totalDeclarado)}</div></div>
    <div class="card ${t.resumo.totalNaoDeclarado ? 'atencao' : ''}"><div class="rot">Não declarado (maior − declarado)</div><div class="val">${fmt(t.resumo.totalNaoDeclarado)}</div></div>
    <div class="card ${t.resumo.disperso ? 'erro' : ''}"><div class="rot">Dispersas</div><div class="val">${t.resumo.disperso}</div></div>
    <div class="card ${t.resumo.atencao ? 'atencao' : ''}"><div class="rot">Atenção</div><div class="val">${t.resumo.atencao}</div></div>
    <div class="card ${t.resumo.alertasGraves ? 'erro' : ''}"><div class="rot">Alertas graves</div><div class="val">${t.resumo.alertasGraves}</div></div>
  </div>

  ${t.sequencia.length ? `<section class="painel">
    <h2>Sequência do equipamento fiscal</h2>
    <p class="sub">Duas conferências que só a redução Z permite: o contador CRZ sobe de um em um, e o Grande Total é acumulador que não zera.</p>
    <ul class="avisos">${t.sequencia.map(a => `<li>${esc(a.texto)}</li>`).join('')}</ul>
  </section>` : ''}

  <section class="painel">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <h2 style="margin:0">Mês a mês</h2><span class="espaco"></span>
      <button class="leve" id="exp-tri">Exportar triangulação (CSV)</button>
    </div>
    <div class="rolagem"><table>
      <thead><tr>
        <th>CNPJ</th><th>Competência</th>
        <th class="num">Redução Z</th><th class="num">PDV</th><th class="num">NAPP</th><th class="num">Declarado</th>
        <th class="num">Variação R$<div class="sub" style="font-size:10.5px;font-weight:400">maior − menor</div></th>
        <th class="num">Não declarado R$<div class="sub" style="font-size:10.5px;font-weight:400">maior − declarado</div></th>
        <th>Status</th>
      </tr></thead>
      <tbody>${t.porMes.map(p => linhaTri(p)).join('')}</tbody>
    </table></div>
    <p class="nota">Em cada linha o <strong>maior valor</strong> entre os tipos de lançamento fica em destaque. Variação = maior menos o menor;
      não declarado = quanto o maior passa do declarado. Com um tipo só a linha fica marcada como tal em vez de aparecer como se fechasse.</p>
    ${blocoFechamento(t)}
  </section>

  ${t.porDia.filter(d => d.variacao != null).length ? `<section class="painel">
    <h2>Dia a dia, onde dois ou mais tipos de lançamento se encontram</h2>
    <p class="sub">Ordenado pela maior variação em R$. É aqui que um dia específico aparece.</p>
    <div class="rolagem"><table>
      <thead><tr><th>CNPJ</th><th>Data</th><th class="num">Redução Z</th><th class="num">PDV</th><th class="num">NAPP</th>
        <th class="num">Variação R$</th><th>Status</th></tr></thead>
      <tbody>${t.porDia.filter(d => d.variacao != null)
        .sort((a, b) => b.variacao - a.variacao).slice(0, 60).map(d => `
        <tr class="${d.status === STATUS_TRI.DISPERSO ? 'grave' : ''}">
          <td>${formatarCnpj(d.cnpj)}</td><td>${dataLabel(d.data)}</td>
          ${celTri(d.z, 'z', d.fonteMaior, d.variacao > 0)}${celTri(d.pdv, 'pdv', d.fonteMaior, d.variacao > 0)}${celTri(d.napp, 'napp', d.fonteMaior, d.variacao > 0)}
          <td class="num">${fmt(d.variacao)}</td>
          <td><span class="tag ${TAG_TRI[d.status]}">${d.status}</span></td>
        </tr>`).join('')}</tbody>
    </table></div>
  </section>` : ''}
  `}

  ${viewHistorico(r)}
  ${viewCruzamento(r)}`
}

/** Fechar um mês: as linhas daquela competência viram histórico. */
function blocoFechamento (t) {
  const comps = [...new Set(t.porMes.filter(p => p.z != null || p.pdv != null).map(p => p.competencia))].sort()
  if (!comps.length) return ''
  const fechadas = new Set(estado.acomp.fechamentos.map(f => f.competencia))
  return `<div class="fechar">
    <label class="campo">Fechar o mês
      <select id="mes-fechar">${comps.map(c => `<option value="${c}">${competenciaLabel(c)}${fechadas.has(c) ? ' (já fechado — refaz)' : ''}</option>`).join('')}</select>
    </label>
    <button class="acao" id="fechar-mes">Fechar mês</button>
    <span class="sub">O fechamento grava Z, PDV, NAPP, declarado, o maior valor, a variação em R$ e os alertas de cada lojista no histórico deste navegador.
      Fechar de novo o mesmo mês substitui o fechamento anterior.</span>
  </div>`
}

/** O histórico dos meses fechados — é ele que o cruzamento final usa. */
function viewHistorico (r) {
  const f = estado.acomp.fechamentos
  if (!f.length) return ''
  return `<section class="painel">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <h2 style="margin:0">Histórico da triangulação (${f.length} fechamento(s))</h2><span class="espaco"></span>
      <button class="leve" id="exp-hist">Exportar histórico (CSV)</button>
    </div>
    <div class="rolagem"><table>
      <thead><tr><th>Competência</th><th>Lojista</th><th>Fechado em</th>
        <th class="num">Redução Z</th><th class="num">PDV</th><th class="num">NAPP</th><th class="num">Declarado</th><th class="num">Variação R$</th><th>Status</th><th></th></tr></thead>
      <tbody>${f.map(x => {
        const l = lojistaDe(x.cnpj)
        // fechamento antigo (sem NAPP nem maior gravados): o maior é calculado na hora
        const r = x.fonteMaior ? x : resumirFontes({ z: x.z, pdv: x.pdv, napp: x.napp, declarado: x.declarado }, estado.prefs)
        const destacar = (x.amplitude ?? r.amplitude) > 0
        return `<tr class="${(x.alertas || []).some(a => a.grave) ? 'grave' : ''}">
          <td>${competenciaLabel(x.competencia)}</td>
          <td>${l ? esc(l.nome) + '<div class="sub" style="font-size:11px">' + formatarCnpj(x.cnpj) + '</div>' : formatarCnpj(x.cnpj)}</td>
          <td>${dataBR(x.fechadoEm)}</td>
          ${celTri(x.z, 'z', r.fonteMaior, destacar)}${celTri(x.pdv, 'pdv', r.fonteMaior, destacar)}
          ${celTri(x.napp, 'napp', r.fonteMaior, destacar)}${celTri(x.declarado, 'declarado', r.fonteMaior, destacar)}
          <td class="num">${x.amplitude == null ? '—' : fmt(x.amplitude)}</td>
          <td><span class="tag ${TAG_TRI[x.status] || 'neutro'}">${x.status}</span>
            ${(x.alertas || []).length ? `<div class="sub" style="font-size:11px">${x.alertas.filter(a => a.grave).length} alerta(s) grave(s)</div>` : ''}</td>
          <td><button class="icone" data-reabrir="${x.cnpj}|${x.competencia}" title="Reabrir (apaga este fechamento)">✕</button></td>
        </tr>`
      }).join('')}</tbody>
    </table></div>
  </section>`
}

function linhaTri (p) {
  const grave = (p.alertas || []).some(a => a.grave)
  // só há "maior" quando os tipos de lançamento diferem; tudo igual não tem destaque
  const destacar = p.amplitude > 0
  return `<tr class="${grave ? 'grave' : ''}">
    <td>${formatarCnpj(p.cnpj)}${nomeDe(p) ? `<div class="sub" style="font-size:11px">${esc(nomeDe(p))}</div>` : ''}</td>
    <td>${p.competenciaLabel}<div class="sub" style="font-size:11px">${p.diasZ}d Z · ${p.diasPdv}d PDV · ${p.diasNapp || 0}d NAPP</div></td>
    ${celTri(p.z, 'z', p.fonteMaior, destacar)}${celTri(p.pdv, 'pdv', p.fonteMaior, destacar)}
    ${celTri(p.napp, 'napp', p.fonteMaior, destacar)}${celTri(p.declarado, 'declarado', p.fonteMaior, destacar)}
    <td class="num" title="${p.dispersao == null ? '' : 'equivale a ' + percentBR(p.dispersao) + ' do maior valor'}">${p.amplitude == null ? '—' : fmt(p.amplitude)}</td>
    <td class="num">${p.naoDeclarado == null ? '—' : fmt(p.naoDeclarado)}</td>
    <td><span class="tag ${TAG_TRI[p.status]}">${p.status}</span>
      <div class="sub" style="font-size:11.5px;min-width:190px;max-width:320px;white-space:normal">${esc(p.explicacao)}</div>
      ${(p.alertas || []).length ? `<details class="cfops"><summary>${p.alertas.length} alerta(s)</summary>
        <ul class="avisos">${p.alertas.map(a => `<li>${esc(a.texto)}</li>`).join('')}</ul></details>` : ''}
    </td>
  </tr>`
}

/* ---- cruzamento final: triangulação x auditoria fiscal ---- */

function viewCruzamento (r) {
  const c = r.cruz
  if (!c.linhas.length) return ''
  return `<section class="painel">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <h2 style="margin:0">Cruzamento final</h2><span class="espaco"></span>
      <button class="leve" id="exp-cruz">Exportar cruzamento (CSV)</button>
    </div>
    <p class="sub">Todas as fontes numa linha só: apurado, redução Z, PDV, NAPP e informado, com o <strong>maior valor</strong> em destaque.
      A referência é o <strong>apurado</strong> — o que sai do livro fiscal ou do extrato do Simples — porque é a peça que o fisco
      já tem; sem ele, a redução Z assume. A maior diferença em R$ contra a referência decide o veredito.</p>
    <div class="cards" style="margin-top:14px">
      <div class="card ${c.resumo.grave ? 'erro' : ''}"><div class="rot">Investigar</div><div class="val">${c.resumo.grave}</div></div>
      <div class="card ${c.resumo.atencao ? 'atencao' : ''}"><div class="rot">Atenção</div><div class="val">${c.resumo.atencao}</div></div>
      <div class="card ok"><div class="rot">Tudo fecha</div><div class="val">${c.resumo.coerente}</div></div>
      <div class="card"><div class="rot">Fontes de menos</div><div class="val">${c.resumo.parcial}</div></div>
    </div>
    <div class="rolagem"><table>
      <thead><tr>
        <th>CNPJ</th><th>Competência</th><th>Referência</th>
        <th class="num">Apurado</th><th class="num">Redução Z</th><th class="num">PDV</th><th class="num">NAPP</th><th class="num">Informado</th>
        <th class="num">Maior diferença R$</th><th>Veredito</th>
      </tr></thead>
      <tbody>${c.linhas.map(l => {
        const destacar = l.fontes >= 2 && l.piorValor > 0
        const dicas = Object.entries(l.desvios).filter(([, d]) => d).map(([k, d]) => `${k}: ${fmt(d.valor)}${d.percent == null ? '' : ' (' + percentBR(d.percent) + ')'}`).join(' · ')
        return `<tr class="${l.veredito === VEREDITO.GRAVE ? 'grave' : ''}">
          <td>${l.cnpjFmt}${nomeDe(l) ? `<div class="sub" style="font-size:11px">${esc(nomeDe(l))}</div>` : ''}</td>
          <td>${l.competenciaLabel}${l.fechado === false ? '<div class="sub" style="font-size:11px">mês aberto</div>' : l.fechado ? '<div class="sub" style="font-size:11px">fechado</div>' : ''}</td>
          <td><span class="tag neutro">${l.referencia === 'apurado' ? esc(l.tipoApurado || 'apurado') : l.referencia === 'z' ? 'redução Z' : '—'}</span></td>
          ${celTri(l.apurado, 'apurado', l.fonteMaior, destacar)}${celTri(l.z, 'z', l.fonteMaior, destacar)}
          ${celTri(l.pdv, 'pdv', l.fonteMaior, destacar)}${celTri(l.napp, 'napp', l.fonteMaior, destacar)}
          ${celTri(l.informado, 'informado', l.fonteMaior, destacar)}
          <td class="num" title="${esc(dicas)}">${l.fontes >= 2 ? fmt(l.piorValor) : '—'}</td>
          <td><span class="tag ${TAG_VEREDITO[l.veredito]}">${l.veredito}</span>
            <div class="sub" style="font-size:11.5px;max-width:320px;white-space:normal">${esc(l.leitura)}</div></td>
        </tr>`
      }).join('')}</tbody>
    </table></div>
    <p class="nota">Uma linha só vira <strong>${VEREDITO.COERENTE}</strong> com pelo menos duas fontes.
      Com uma só ela fica em <strong>${VEREDITO.PARCIAL}</strong> — ausência de divergência não é prova de acerto.</p>
  </section>`
}

/* ---- aba Detalhe ---- */

function viewDetalhe (r) {
  if (!r.periodos.length) return `<div class="painel vazio">Nenhum livro carregado ainda.</div>`
  return `<section class="painel">
    <h2>De onde saiu cada número</h2>
    <p class="sub">Para livro fiscal, todo CFOP lido e o que ele fez com o resultado — confira se algum caiu no balde errado e mude a regra na aba <strong>Tabela de códigos</strong>. Para o extrato do Simples, a quebra da receita declarada por atividade.</p>
    ${r.periodos.map(p => `
      <h3 style="margin-top:18px">${formatarCnpj(p.cnpj)} · ${p.competenciaLabel}
        <span class="tag neutro">${p.tipo === 'declaracao' ? 'PGDAS-D' : esc((p.livros || []).join(' + ') || 'sem livro')}</span>
        ${p.confiancaMinima !== 'alta' ? `<span class="tag atencao">confiança ${p.confiancaMinima}</span>` : ''}</h3>
      ${p.tipo === 'declaracao' ? blocoDeclaracao(p) : `
      <div class="rolagem"><table>
        <thead><tr><th>CFOP</th><th>Livro</th><th>Descrição</th><th>Tratamento</th>
          <th class="num">Valor</th><th class="num">Base</th><th class="num">ICMS</th></tr></thead>
        <tbody>${p.cfops.map(c => {
          const efeito = c.natureza === 'VENDA' ? 'ok' : (c.natureza === 'DEVOLUCAO_VENDA' || c.natureza === 'ANULACAO_SAIDA') ? 'atencao'
            : (c.natureza === 'DESCONHECIDO' || c.natureza === 'REVISAR') ? 'erro' : 'neutro'
          return `<tr>
            <td><code>${c.cfop}</code></td><td>${esc(c.livro || '—')}</td>
            <td style="white-space:normal;max-width:360px">${esc(c.descricao)}</td>
            <td><span class="tag ${efeito}">${esc(NATUREZA_LABEL[c.natureza] || c.natureza)}</span></td>
            <td class="num">${fmt(c.valor)}</td><td class="num">${fmt(c.base)}</td><td class="num">${fmt(c.icms)}</td>
          </tr>`
        }).join('')}
        <tr><td colspan="4"><strong>Vendas líquidas</strong></td>
          <td class="num"><strong>${fmt(p.vendasLiquidas)}</strong></td><td class="num"></td><td class="num"></td></tr>
        </tbody>
      </table></div>`}`).join('')}
  </section>`
}

/** Um período vindo do extrato do Simples não tem CFOP: mostra a quebra por atividade. */
function blocoDeclaracao (p) {
  const d = p.declarado || {}
  const linha = (rot, v, forte) => v == null ? '' :
    `<tr><td>${rot}</td><td class="num">${forte ? '<strong>' + fmt(v) + '</strong>' : fmt(v)}</td></tr>`
  return `<div class="rolagem"><table>
    <thead><tr><th>Receita declarada no PGDAS-D</th><th class="num">Valor</th></tr></thead>
    <tbody>
      ${linha('Revenda de mercadorias', d.mercadoria)}
      ${linha('Prestação de serviço (ISS)', d.servico)}
      ${linha('Receita bruta total', d.total)}
      ${linha('Usado na comparação', p.vendasLiquidas, true)}
    </tbody>
  </table></div>
  <p class="nota">${d.escopo === 'estabelecimento'
    ? 'Declaração do próprio estabelecimento, com a quebra por atividade.'
    : 'Mês vindo do histórico do extrato: receita consolidada da empresa, sem quebra por atividade.'}</p>`
}

/* ---- aba Dashboard: evolução e pendências dos três processos ---- */

const SERIE_FISCAL = {
  recebido: { rotulo: 'Recebidos', cor: 'var(--serie-1)' },
  auditado: { rotulo: 'Apurados', cor: 'var(--serie-2)' },
  cobrado: { rotulo: 'Cobrados', cor: 'var(--serie-3)' },
}
/** Tela de celular: os gráficos usam um viewBox mais estreito para o texto não ficar minúsculo. */
const estreito = () => typeof innerWidth !== 'undefined' && innerWidth < 640
const pctBR = (v) => (v == null ? '—' : String(Math.round(v * 10) / 10).replace('.', ',') + '%')

function viewDashboard (r) {
  const d = r.dash
  if (!estado.acomp.lojistas.length) {
    return `<div class="painel vazio">O dashboard acompanha a carteira. Lance os lojistas na aba <strong>Lojistas</strong> —
      ou, para conhecer o app, <button class="acao" data-carregar-ficticia>Carregar base fictícia</button></div>`
  }
  const f = d.fiscal; const t = d.tri; const s = d.soc
  const cen = estado.acomp.ficticia && estado.acomp.cenarios ? estado.acomp.cenarios : null
  return `${faixaCiclo(r.painel.ciclo)}
