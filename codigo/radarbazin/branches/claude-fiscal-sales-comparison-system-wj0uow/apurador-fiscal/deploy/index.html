/* ===== src/acompanhamento.js ===== */
/**
 * Acompanhamento do ciclo de auditoria: a carteira de lojistas do shopping, o
 * recebimento anual dos livros (a partir de 1º de abril), o fluxo mensal de
 * notificações para quem não entregou, e o fechamento mensal da triangulação.
 *
 * Funções puras: recebem o estado persistido e a data de hoje, devolvem o que
 * a tela precisa. Nada aqui toca localStorage nem DOM.
 *
 * Duas cadências convivem:
 *   - a auditoria fiscal é ANUAL: o ciclo abre em 1º de abril e cobre os livros
 *     do ano-calendário anterior;
 *   - a triangulação é DIÁRIA ou SEMANAL na entrada e FECHADA POR MÊS: cada
 *     fechamento vira uma linha do histórico, que o cruzamento final usa contra
 *     a auditoria anual.
 */

const VERSAO_ACOMPANHAMENTO = 2

/* --------------------------------------------------------------- o ciclo */

/**
 * Ciclo em vigor numa data. Abre em `mesInicio` (4 = abril) e audita os livros
 * do ano-calendário anterior: em setembro de 2026 o ciclo é 2026 e os livros
 * são os de 2025.
 */
function cicloAtual (hoje = new Date(), mesInicio = 4) {
  const d = paraData(hoje)
  const ano = d.getMonth() + 1 >= mesInicio ? d.getFullYear() : d.getFullYear() - 1
  const inicio = iso(new Date(ano, mesInicio - 1, 1))
  const mesesDecorridos = (d.getFullYear() - ano) * 12 + (d.getMonth() + 1) - mesInicio + 1  // abril = mês 1
  return { ano, chave: String(ano), inicio, anoLivros: ano - 1, mesesDecorridos, mesInicio }
}

/** Todos os meses do ciclo, do mês de abertura até o de hoje (para o gráfico de recebimento). */
function mesesDoCiclo (ciclo, hoje = new Date()) {
  const out = []
  for (let i = 0; i < ciclo.mesesDecorridos; i++) {
    const d = new Date(ciclo.ano, ciclo.mesInicio - 1 + i, 1)
    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`)
  }
  return out
}

/* ------------------------------------------------------------- o pipeline */

const STATUS_LIVRO = {
  NAO_RECEBIDO: 'NÃO RECEBIDO',
  RECEBIDO: 'RECEBIDO',
  AUDITADO: 'AUDITADO',
  NEGOCIADO: 'NEGOCIADO',
  COBRADO: 'COBRADO',
}
/** A ordem em que um lojista avança. A data de cada marco fica em registro[chave]. */
const MARCOS = [
  { chave: 'recebido', status: STATUS_LIVRO.RECEBIDO, rotulo: 'Livros recebidos' },
  { chave: 'auditado', status: STATUS_LIVRO.AUDITADO, rotulo: 'Auditado' },
  { chave: 'negociado', status: STATUS_LIVRO.NEGOCIADO, rotulo: 'Negociado' },
  { chave: 'cobrado', status: STATUS_LIVRO.COBRADO, rotulo: 'Cobrado' },
]

/**
 * O fluxo mensal para quem não entregou: uma etapa por mês, a partir da abertura
 * do ciclo. Em abril a 1ª notificação; maio a 2ª; junho a 3ª; julho o aviso de
 * multa; agosto o comando de enviar a multa.
 */
const ETAPAS = [
  { chave: 'n1', rotulo: '1ª notificação', curto: '1ª notif.', mes: 1 },
  { chave: 'n2', rotulo: '2ª notificação', curto: '2ª notif.', mes: 2 },
  { chave: 'n3', rotulo: '3ª notificação', curto: '3ª notif.', mes: 3 },
  { chave: 'aviso', rotulo: 'Aviso de multa', curto: 'aviso multa', mes: 4 },
  { chave: 'multa', rotulo: 'Multa enviada', curto: 'multa', mes: 5 },
]

/** Estado persistido vazio. */
function acompanhamentoVazio () {
  return { versao: VERSAO_ACOMPANHAMENTO, lojistas: [], ciclos: {}, fechamentos: [], societario: {}, prefs: {} }
}

/* --------------------------------------------------------------- carteira */

const SINONIMOS_LOJISTA = {
  nome: ['nome', 'loja', 'nomefantasia', 'fantasia', 'lojista', 'marca'],
  razao: ['razaosocial', 'razao', 'empresa', 'razão social'],
  cnpj: ['cnpj', 'cnpjcpf', 'documento'],
  luc: ['luc', 'unidade', 'sala', 'ponto', 'lojan', 'numeroloja', 'nloja'],
  email: ['email', 'e-mail', 'contato', 'emailcontato'],
  telefone: ['telefone', 'celular', 'whatsapp', 'fone', 'tel'],
  regime: ['regime', 'regimetributario', 'tributacao', 'simples'],
  segmento: ['segmento', 'ramo', 'categoria', 'atividade'],
  uf: ['uf', 'estado', 'ufcontrato', 'estadocontrato', 'ufdaloja'],
  inicioContrato: ['iniciocontrato', 'iniciodocontrato', 'datacontrato', 'datadocontrato', 'inicio', 'datainicio', 'contratodesde', 'vigenciainicio'],
}

/** Dígitos verificadores do CNPJ (os dois últimos), pela regra da Receita. */
function cnpjValido (bruto) {
  const d = String(bruto ?? '').replace(/\D/g, '')
  if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false
  const pesos = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
  const dv = (n) => {
    let soma = 0
    for (let i = 0; i < n.length; i++) soma += Number(n[i]) * pesos[pesos.length - n.length + i]
    const r = soma % 11
    return r < 2 ? 0 : 11 - r
  }
  const base = d.slice(0, 12)
  return d === base + dv(base) + dv(base + dv(base))
}

/** Um lojista limpo, com a chave que o resto do sistema usa (o CNPJ só com dígitos). */
function normalizarLojista (bruto = {}) {
  const cnpj = normalizarCnpj(bruto.cnpj) || ''
  const regime = /simples/i.test(String(bruto.regime || '')) ? 'simples' : (String(bruto.regime || '').trim() ? 'normal' : '')
  return {
    cnpj,
    nome: String(bruto.nome || bruto.razao || '').trim(),
    razao: String(bruto.razao || '').trim(),
    luc: String(bruto.luc || '').trim(),
    email: String(bruto.email || '').trim(),
    telefone: String(bruto.telefone || '').replace(/[^\d+]/g, ''),
    regime,
    segmento: String(bruto.segmento || '').trim(),
    uf: String(bruto.uf || '').trim().toUpperCase().slice(0, 2),
    inicioContrato: normalizarDataIso(bruto.inicioContrato),
    ativo: bruto.ativo === undefined ? true : !!bruto.ativo,
  }
}

/**
 * Lê a relação de lojistas de uma planilha (linhas já em matriz). As colunas
 * são reconhecidas pelo cabeçalho. Devolve o que entrou e o que foi recusado.
 */
function importarLojistas (linhas) {
  const avisos = []
  let iCab = -1; let mapa = null
  for (let i = 0; i < Math.min(linhas.length, 15); i++) {
    const m = mapearColunas((linhas[i] || []).map(c => String(c ?? '')), SINONIMOS_LOJISTA)
    if (m.cnpj != null && (m.nome != null || m.razao != null)) { iCab = i; mapa = m; break }
  }
  if (iCab === -1) return { lojistas: [], avisos: ['Não encontrei um cabeçalho com CNPJ e nome/loja.'] }
  const out = []
  const vistos = new Set()
  for (let r = iCab + 1; r < linhas.length; r++) {
    const l = linhas[r]
    if (!l || l.every(c => c === '' || c == null)) continue
    const pega = (k) => mapa[k] != null ? l[mapa[k]] : ''
    const loj = normalizarLojista({ nome: pega('nome'), razao: pega('razao'), cnpj: pega('cnpj'), luc: pega('luc'),
      email: pega('email'), telefone: pega('telefone'), regime: pega('regime'), segmento: pega('segmento'), uf: pega('uf'), inicioContrato: pega('inicioContrato') })
    if (!cnpjValido(pega('cnpj'))) { avisos.push(`Linha ${r + 1}: CNPJ inválido ("${pega('cnpj')}") — ignorada.`); continue }
    if (vistos.has(loj.cnpj)) { avisos.push(`Linha ${r + 1}: CNPJ ${formatarCnpj(loj.cnpj)} repetido — ignorada.`); continue }
    vistos.add(loj.cnpj)
    out.push(loj)
  }
  return { lojistas: out, avisos, mapa }
}

/** Junta lojistas importados à carteira: CNPJ já existente é atualizado, não duplicado. */
function mesclarLojistas (carteira, novos) {
  const porCnpj = new Map(carteira.map(l => [l.cnpj, l]))
  let inseridos = 0; let atualizados = 0
  for (const n of novos) {
    if (porCnpj.has(n.cnpj)) {
      const atual = porCnpj.get(n.cnpj)
      for (const k of Object.keys(n)) if (n[k] !== '' && n[k] != null && k !== 'ativo') atual[k] = n[k]
      atualizados++
    } else { porCnpj.set(n.cnpj, { ...n }); inseridos++ }
  }
  return { lojistas: [...porCnpj.values()], inseridos, atualizados }
}

/* --------------------------------------------------------- situação de cada um */

/** O registro de um lojista num ciclo, sempre com a forma completa. */
function registroDe (acomp, cicloChave, cnpj) {
  const c = acomp.ciclos[cicloChave] || (acomp.ciclos[cicloChave] = {})
  if (!c[cnpj]) c[cnpj] = { recebido: null, auditado: null, negociado: null, cobrado: null, notificacoes: {}, valores: {}, obs: '' }
  if (!c[cnpj].notificacoes) c[cnpj].notificacoes = {}
  if (!c[cnpj].valores) c[cnpj].valores = {}
  return c[cnpj]
}

/** Status atual pelo marco mais avançado com data. */
function statusDoRegistro (reg) {
  let status = STATUS_LIVRO.NAO_RECEBIDO
  for (const m of MARCOS) if (reg && reg[m.chave]) status = m.status
  return status
}

/**
 * Situação de um lojista no ciclo: status, quantas etapas de notificação já
 * foram cumpridas e qual é a etapa devida agora (se houver).
 *
 * A etapa devida é a próxima ainda não registrada cujo mês já chegou. Quem
 * entregou os livros sai do fluxo de notificação, com o histórico preservado.
 */
function situacao (lojista, reg, ciclo) {
  const status = statusDoRegistro(reg)
  const feitas = ETAPAS.filter(e => reg && reg.notificacoes && reg.notificacoes[e.chave])
  const recebido = status !== STATUS_LIVRO.NAO_RECEBIDO
  let devida = null
  let atrasadas = 0
  if (!recebido) {
    for (const e of ETAPAS) {
      if (reg && reg.notificacoes && reg.notificacoes[e.chave]) continue
      if (e.mes <= ciclo.mesesDecorridos) { if (!devida) devida = e; atrasadas++ }
    }
  }
  return {
    cnpj: lojista.cnpj, lojista, reg, status, recebido,
    etapasFeitas: feitas.map(e => e.chave),
    ultimaEtapa: feitas.length ? feitas[feitas.length - 1] : null,
    devida,                      // a etapa que o mês pede agora
    atrasadas,                   // quantas etapas o mês já deveria ter visto (1 = em dia, >1 = acumulou)
    multada: !!(reg && reg.notificacoes && reg.notificacoes.multa),
  }
}

/** O painel: contagem por status, recebimento mês a mês e a lista de situações. */
function resumoPainel (acomp, ciclo, opts = {}) {
  const ativos = acomp.lojistas.filter(l => l.ativo !== false)
  const situacoes = ativos.map(l => situacao(l, (acomp.ciclos[ciclo.chave] || {})[l.cnpj], ciclo))
  const contagem = { total: ativos.length }
  for (const s of Object.values(STATUS_LIVRO)) contagem[s] = 0
  for (const s of situacoes) contagem[s.status]++
  // a barra de recebimento: quantos entregaram até cada mês do ciclo
  const meses = mesesDoCiclo(ciclo)
  const porMes = meses.map(m => ({ mes: m, label: competenciaLabel(m), recebidos: 0, acumulado: 0 }))
  for (const s of situacoes) {
    const d = s.reg && s.reg.recebido
    if (!d) continue
    const i = meses.indexOf(String(d).slice(0, 7))
    if (i >= 0) porMes[i].recebidos++
  }
  let acc = 0
  for (const p of porMes) { acc += p.recebidos; p.acumulado = acc }
  const pendentes = situacoes.filter(s => s.devida)
  const multados = situacoes.filter(s => s.multada && !s.recebido)
  const valores = { divergencia: 0, negociado: 0, cobrado: 0 }
  for (const s of situacoes) for (const k of Object.keys(valores)) valores[k] += Number((s.reg && s.reg.valores && s.reg.valores[k]) || 0)
  return { ciclo, contagem, porMes, situacoes, pendentes, multados, valores,
    percentualRecebido: ativos.length ? Math.round((ativos.length - contagem[STATUS_LIVRO.NAO_RECEBIDO]) / ativos.length * 1000) / 10 : 0 }
}

/* ----------------------------------------------------------- notificações */

/**
 * O texto de cada etapa, pronto para copiar, mandar por e-mail ou WhatsApp.
 * `prefs.shopping`, `prefs.prazoDias`, `prefs.clausulaMulta` e `prefs.assinatura`
 * personalizam; o resto vem do lojista e do ciclo.
 */
function textoNotificacao (etapa, lojista, ciclo, prefs = {}) {
  const shopping = prefs.shopping || 'o Shopping'
  const prazo = Number(prefs.prazoDias) || 10
  const nome = lojista.nome || lojista.razao || formatarCnpj(lojista.cnpj)
  const luc = lojista.luc ? ` (LUC ${lojista.luc})` : ''
  const ano = ciclo.anoLivros
  const clausula = prefs.clausulaMulta || 'a cláusula de multa por não apresentação dos livros fiscais prevista no contrato de locação'
  const assinatura = prefs.assinatura || 'Equipe de Auditoria de Vendas'
  const pedido = `livros fiscais de Entradas e Saídas do exercício de ${ano} (ou do extrato do Simples Nacional, se for o caso), ` +
    'em PDF, SPED ou planilha, junto com a ficha de vendas informadas'
  const modelos = {
    n1: {
      assunto: `Auditoria de vendas ${ano} — envio dos livros fiscais — ${nome}`,
      corpo: `Prezados, ${nome}${luc},\n\nComo todo ano, a partir de 1º de abril ${shopping} realiza a auditoria das vendas declaradas. ` +
        `Pedimos o envio dos ${pedido}, no prazo de ${prazo} dias.\n\nQualquer dúvida sobre o formato, respondam esta mensagem.\n\n${assinatura}`,
    },
    n2: {
      assunto: `2ª notificação — livros fiscais ${ano} ainda não recebidos — ${nome}`,
      corpo: `Prezados, ${nome}${luc},\n\nNão recebemos até o momento os ${pedido}. ` +
        `Esta é a segunda solicitação. Pedimos o envio em ${prazo} dias.\n\n${assinatura}`,
    },
    n3: {
      assunto: `3ª e última notificação — livros fiscais ${ano} — ${nome}`,
      corpo: `Prezados, ${nome}${luc},\n\nEsta é a terceira e última solicitação dos ${pedido}. ` +
        `Sem o recebimento em ${prazo} dias, ${shopping} passará a aplicar ${clausula}.\n\n${assinatura}`,
    },
    aviso: {
      assunto: `Aviso de multa — não apresentação dos livros fiscais ${ano} — ${nome}`,
      corpo: `Prezados, ${nome}${luc},\n\nApós três solicitações sem retorno, comunicamos que a não apresentação dos ${pedido} ` +
        `caracteriza descumprimento contratual e enseja ${clausula}. Este é o aviso prévio: o envio dos documentos em ${prazo} dias ` +
        `evita a cobrança.\n\n${assinatura}`,
    },
    multa: {
      assunto: `Aplicação de multa contratual — livros fiscais ${ano} — ${nome}`,
      corpo: `Prezados, ${nome}${luc},\n\nEsgotado o prazo do aviso, fica aplicada ${clausula}, referente ao exercício de ${ano}, ` +
        `com lançamento no próximo boleto de encargos. A apresentação dos documentos continua obrigatória e não afasta a multa já aplicada.\n\n${assinatura}`,
    },
  }
  const m = modelos[etapa] || modelos.n1
  return { ...m, mailto: `mailto:${encodeURIComponent(lojista.email || '')}?subject=${encodeURIComponent(m.assunto)}&body=${encodeURIComponent(m.corpo)}`,
    whatsapp: lojista.telefone ? `https://wa.me/${lojista.telefone.replace(/\D/g, '')}?text=${encodeURIComponent(m.assunto + '\n\n' + m.corpo)}` : null }
}

/* ---------------------------------------------------- fechamento mensal */

/**
 * Fecha uma competência da triangulação: as linhas de `porMes` daquela
 * competência viram histórico. Fechar de novo substitui o fechamento anterior
 * da mesma competência e CNPJ (o mês foi reaberto e refeito).
 */
function fecharMes (fechamentos, porMes, competencia, hoje = new Date()) {
  const novas = porMes.filter(p => p.competencia === competencia).map(p => ({
    competencia, cnpj: p.cnpj, fechadoEm: iso(paraData(hoje)),
    z: p.z ?? null, pdv: p.pdv ?? null, napp: p.napp ?? null, declarado: p.declarado ?? null,
    diasZ: p.diasZ || 0, diasPdv: p.diasPdv || 0, diasNapp: p.diasNapp || 0,
    maior: p.maior ?? null, fonteMaior: p.fonteMaior || [], naoDeclarado: p.naoDeclarado ?? null,
    amplitude: p.amplitude ?? null, dispersao: p.dispersao ?? null, status: p.status,
    alertas: (p.alertas || []).map(a => ({ tipo: a.tipo, grave: !!a.grave, texto: a.texto })),
    explicacao: p.explicacao || '',
  }))
  const chaves = new Set(novas.map(n => n.cnpj + '|' + n.competencia))
  const mantidas = (fechamentos || []).filter(f => !chaves.has(f.cnpj + '|' + f.competencia))
  return { fechamentos: [...mantidas, ...novas].sort((a, b) => a.competencia.localeCompare(b.competencia) || a.cnpj.localeCompare(b.cnpj)), fechadas: novas.length }
}

/**
 * O que vai para o cruzamento final: o histórico fechado mais os meses ainda
 * abertos nesta sessão. Um mês aberto não substitui o fechado — o fechamento é
 * o registro; o aberto aparece marcado como tal.
 */
function historicoParaCruzamento (fechamentos, porMesAberto = []) {
  const out = (fechamentos || []).map(f => ({ ...f, competenciaLabel: competenciaLabel(f.competencia), fechado: true }))
  const chaves = new Set(out.map(f => f.cnpj + '|' + f.competencia))
  for (const p of porMesAberto) {
    if (chaves.has(p.cnpj + '|' + p.competencia)) continue
    out.push({ ...p, fechado: false })
  }
  return out
}

function carteiraCsv (lojistas) {

}

function csv (matriz) {
  const cel = (v) => {
    if (v == null) return ''
    if (typeof v === 'number') return String(Math.round(v * 100) / 100).replace('.', ',')
    const s = String(v)
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s
  }
  return '﻿' + matriz.map(l => l.map(cel).join(';')).join('\r\n') + '\r\n'
}

/* -------------------------------------------------------------- utilidades */

function paraData (d) {
  if (d instanceof Date) return d
  if (typeof d === 'string') { const [a, m, dia] = d.split('-').map(Number); return new Date(a, m - 1, dia || 1) }
  return new Date(d)
}
/** Data vinda de planilha (dd/mm/aaaa, aaaa-mm-dd, serial do Excel ou Date) para aaaa-mm-dd; vazio se não der. */
function normalizarDataIso (bruto) {
  if (bruto == null || bruto === '') return ''
  if (bruto instanceof Date) return Number.isNaN(bruto.getTime()) ? '' : iso(bruto)
  if (typeof bruto === 'number' && bruto > 20000 && bruto < 80000) return iso(new Date(Math.round((bruto - 25569) * 86400000)))  // serial do Excel
  const s = String(bruto).trim()
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)
  if (m) return `${m[1]}-${m[2]}-${m[3]}`
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/)
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`
  return ''
}
function iso (d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`

/**
 * O checklist por lojista da skill. Itens que dependem de haver gatilho de TT
 * (certidão, download, encaminhamento) não se aplicam a quem não tem gatilho
 * depois do início do contrato — e não contam contra o progresso.
 */
function checklistTT (lojista, reg) {
  const r = reg || {}
  const respondeu = r.houveMudanca != null || r.indicio === 'nao'
  const gatilho = r.houveMudanca === true && normalizarTipo(r.tipo) !== 'outra' &&
    (!lojista.inicioContrato || !r.dataMudanca || String(r.dataMudanca).slice(0, 10) >= String(lojista.inicioContrato).slice(0, 10))
  const semGatilho = respondeu && !gatilho
  const protocolo = r.protocolo || r.guiaNumero
  const itens = [
    { chave: 'cnpj', rotulo: 'CNPJ / NIRE confirmado', feito: !!r.nireConfirmado },
    { chave: 'inicio', rotulo: 'Data de início do contrato anotada', feito: !!lojista.inicioContrato, auto: true },
    { chave: 'atos', rotulo: 'Atos posteriores à data do contrato listados', feito: !!r.atosListados },
    { chave: 'gatilho', rotulo: 'Gatilho de TT avaliado (capital / sócio / administrador / objeto)', feito: respondeu, auto: true },
    { chave: 'certidao', rotulo: 'Certidão solicitada, protocolo anotado, guia paga', feito: !!(protocolo && r.guiaPagaEm), naoAplica: semGatilho },
    { chave: 'baixada', rotulo: 'Certidão baixada e arquivada', feito: !!r.certidaoBaixadaEm, naoAplica: semGatilho },
    { chave: 'encaminhado', rotulo: 'Caso encaminhado para cobrança / jurídico', feito: !!(r.encaminhadoEm || (r.validadoEm && r.cobrar === true)), naoAplica: semGatilho || (!!r.validadoEm && r.cobrar === false) },
  ]
  const aplicaveis = itens.filter(i => !i.naoAplica)
  const feitos = aplicaveis.filter(i => i.feito).length
  return { itens, feitos, total: aplicaveis.length, completo: feitos === aplicaveis.length, gatilho }
}

/** A mudança é recente se a data cai nos 12 meses anteriores a hoje. */
function mudancaRecente (dataMudanca, hoje = new Date()) {
  if (!dataMudanca) return false
  const d = new Date(String(dataMudanca).slice(0, 10) + 'T00:00:00')
  if (Number.isNaN(d.getTime())) return false
  const limite = new Date(hoje.getFullYear() - 1, hoje.getMonth(), hoje.getDate())
  return d >= limite && d <= hoje
}

/** Meses inteiros decorridos desde uma data (contando o mês da data como 1º). */
function mesesDesde (dataIso, hoje) {
  const d = new Date(String(dataIso).slice(0, 10) + 'T00:00:00')
  return (hoje.getFullYear() - d.getFullYear()) * 12 + (hoje.getMonth() - d.getMonth()) + 1
}

/**
 * Situação societária de um lojista. O fluxo de notificação começa na data da
 * validação (não na abertura do ciclo), uma etapa por mês — a mesma régua da
 * auditoria fiscal.
 */
function situacaoSocietaria (lojista, reg, hoje = new Date()) {
  const r = reg || {}
  // só interessa alteração registrada depois do início do contrato com o shopping
  const inicio = lojista.inicioContrato ? String(lojista.inicioContrato).slice(0, 10) : null
  const aposContrato = !inicio || !r.dataMudanca || String(r.dataMudanca).slice(0, 10) >= inicio
  const causaTT = !r.tipo || normalizarTipo(r.tipo) !== 'outra'
  const recente = r.houveMudanca === true && mudancaRecente(r.dataMudanca, hoje) && aposContrato && causaTT
  let status = STATUS_SOC.NAO_CONSULTADO
  if (r.houveMudanca == null && r.indicio === 'nao') status = STATUS_SOC.SEM_INDICIO
  if (r.houveMudanca === false) status = STATUS_SOC.SEM_MUDANCA
  else if (r.houveMudanca === true && !aposContrato) status = STATUS_SOC.ANTERIOR_CONTRATO
  else if (r.houveMudanca === true && !causaTT) status = STATUS_SOC.OUTRA_ALTERACAO
  else if (r.houveMudanca === true && !r.dataMudanca) status = STATUS_SOC.FALTA_DATA
  else if (r.houveMudanca === true && !recente) status = STATUS_SOC.MUDANCA_ANTIGA
  else if (recente) status = STATUS_SOC.SINALIZADO
  // a janela de 12 meses vale para sinalizar; caso já validado pelo time não some quando ela passa
  const validado = r.houveMudanca === true && aposContrato && causaTT && !!r.validadoEm && (recente || r.cobrar != null)
  if (validado && r.isencao === 'sim' && r.cobrar !== true) status = STATUS_SOC.ISENTO
  const emCobranca = validado && r.cobrar === true
  if (emCobranca) status = r.cobrado ? STATUS_SOC.COBRADO : r.negociado ? STATUS_SOC.NEGOCIADO : STATUS_SOC.EM_COBRANCA

  const feitas = ETAPAS.filter(e => r.notificacoes && r.notificacoes[e.chave]).map(e => e.chave)
  let devida = null; let atrasadas = 0
  if (status === STATUS_SOC.EM_COBRANCA) {
    const meses = mesesDesde(r.validadoEm, hoje)
    for (const e of ETAPAS) {
      if (r.notificacoes && r.notificacoes[e.chave]) continue
      if (e.mes <= meses) { if (!devida) devida = e; atrasadas++ }
    }
  }
  return {
    cnpj: lojista.cnpj, lojista, reg: r, status, recente, aposContrato, inicioContrato: inicio,
    semInicioContrato: !inicio,
    guiaAPagar: r.indicio === 'sim' && !r.guiaPagaEm,
    aguardandoDownload: !!r.guiaPagaEm && !r.certidaoBaixadaEm,
    checklist: checklistTT(lojista, r),
    precisaValidar: recente && !r.validadoEm,
    emCobranca, devida, atrasadas, etapasFeitas: feitas,
    multada: !!(r.notificacoes && r.notificacoes.multa),
  }
}

function resumoSocietario (acomp, hoje = new Date()) {
  const ativos = (acomp.lojistas || []).filter(l => l.ativo !== false)
  const situacoes = ativos.map(l => situacaoSocietaria(l, (acomp.societario || {})[l.cnpj], hoje))
  const contagem = { total: ativos.length }
  for (const s of Object.values(STATUS_SOC)) contagem[s] = 0
  for (const s of situacoes) contagem[s.status]++
  const valores = { taxa: 0, negociado: 0, cobrado: 0 }
  for (const s of situacoes) for (const k of Object.keys(valores)) valores[k] += Number((s.reg.valores && s.reg.valores[k]) || 0)
  return { situacoes, contagem, valores,
    aValidar: situacoes.filter(s => s.precisaValidar),
    guiasAPagar: situacoes.filter(s => s.guiaAPagar),
    aguardandoDownload: situacoes.filter(s => s.aguardandoDownload),
    checklistCompleto: situacoes.filter(s => s.checklist.completo),
    semInicioContrato: situacoes.filter(s => s.semInicioContrato),
    pendentes: situacoes.filter(s => s.devida),
    sinalizados: situacoes.filter(s => s.recente) }
}

        `no próximo boleto de encargos. A apresentação do contrato social consolidado continua obrigatória.\n\n${assinatura}`,
    },
  }
  const m = modelos[etapa] || modelos.n1
  return { ...m,
    mailto: `mailto:${encodeURIComponent(lojista.email || '')}?subject=${encodeURIComponent(m.assunto)}&body=${encodeURIComponent(m.corpo)}`,
    whatsapp: lojista.telefone ? `https://wa.me/${String(lojista.telefone).replace(/\D/g, '')}?text=${encodeURIComponent(m.assunto + '\n\n' + m.corpo)}` : null }
}

function rotuloEtapaTaxa (etapa) {

function societarioCsv (resumo) {

  const linhas = resumo.situacoes.map(s => {
    const r = s.reg; const n = r.notificacoes || {}; const v = r.valores || {}; const j = JUNTAS[String(s.lojista.uf || '').toUpperCase()]
    return [formatarCnpj(s.cnpj), s.lojista.nome, s.lojista.luc, s.lojista.uf, j ? j.sigla : '', s.lojista.inicioContrato, s.status,

      r.houveMudanca == null ? '' : r.houveMudanca ? 'sim' : 'não', r.dataMudanca, r.tipo, r.registro, r.isencao, r.limite, r.validadoEm,

/**
 * Dashboard: os números de acompanhamento dos três processos, e as pendências
 * de cada um. Funções puras — recebem o acompanhamento persistido, o histórico
 * da triangulação e a data; a tela só desenha.
 *
 *   Auditoria fiscal (anual)  % recebidos, auditados, negociados, cobrados;
 *                             evolução acumulada mês a mês do ciclo.
 *   Triangulação (mensal)     % de lojistas com cada etapa na competência de
 *                             referência (Z, PDV, NAPP, declarado, mês fechado);
 *                             variação em R$ (maior − menor) média e máxima, e
 *                             venda não declarada, por competência.
 *   Societário / TT           % pesquisados na Junta, % contatados, TT
 *                             contratual encontrada e % faturado sobre ela.
 */




const pct = (n, d) => d ? Math.round(n / d * 1000) / 10 : 0
const ORDEM_LIVRO = [STATUS_LIVRO.NAO_RECEBIDO, STATUS_LIVRO.RECEBIDO, STATUS_LIVRO.AUDITADO, STATUS_LIVRO.NEGOCIADO, STATUS_LIVRO.COBRADO]
const alcancou = (status, alvo) => ORDEM_LIVRO.indexOf(status) >= ORDEM_LIVRO.indexOf(alvo)

/* ------------------------------------------------------ auditoria fiscal */

function dashFiscal (acomp, ciclo) {
  const ativos = acomp.lojistas.filter(l => l.ativo !== false)
  const regs = acomp.ciclos[ciclo.chave] || {}
  const sit = ativos.map(l => situacao(l, regs[l.cnpj], ciclo))
  const n = ativos.length
  const conta = (alvo) => sit.filter(s => alcancou(s.status, alvo)).length
  const etapas = [
    { chave: 'recebido', rotulo: 'Livros recebidos', qtd: conta(STATUS_LIVRO.RECEBIDO) },
    { chave: 'auditado', rotulo: 'Apurados (auditados)', qtd: conta(STATUS_LIVRO.AUDITADO) },
    { chave: 'negociado', rotulo: 'Negociados', qtd: conta(STATUS_LIVRO.NEGOCIADO) },
    { chave: 'cobrado', rotulo: 'Cobrados', qtd: conta(STATUS_LIVRO.COBRADO) },
  ].map(e => ({ ...e, total: n, pct: pct(e.qtd, n) }))

  // evolução: quantos tinham cada marco ao fim de cada mês do ciclo
  const meses = mesesDoCiclo(ciclo)
  const series = ['recebido', 'auditado', 'cobrado'].map(chave => ({
    chave,
    pontos: meses.map(m => ({ mes: m, label: competenciaLabel(m),
      qtd: sit.filter(s => s.reg && s.reg[chave] && String(s.reg[chave]).slice(0, 7) <= m).length })),
  }))
  for (const s of series) for (const p of s.pontos) p.pct = pct(p.qtd, n)

  const valores = { divergencia: 0, negociado: 0, cobrado: 0 }
  for (const s of sit) for (const k of Object.keys(valores)) valores[k] += Number((s.reg && s.reg.valores && s.reg.valores[k]) || 0)

  const pendencias = [
    { rotulo: 'Livros não recebidos', lista: sit.filter(s => s.status === STATUS_LIVRO.NAO_RECEBIDO),
      detalhe: s => s.multada ? 'multado' : s.devida ? `devida: ${s.devida.rotulo}` : 'em dia no fluxo' },
    { rotulo: 'Recebidos, aguardando apuração', lista: sit.filter(s => s.status === STATUS_LIVRO.RECEBIDO),
      detalhe: s => `recebido em ${dataBR(s.reg.recebido)}` },
    { rotulo: 'Apurados, aguardando negociação', lista: sit.filter(s => s.status === STATUS_LIVRO.AUDITADO),
      detalhe: s => `apurado em ${dataBR(s.reg.auditado)}` },
    { rotulo: 'Negociados, aguardando cobrança', lista: sit.filter(s => s.status === STATUS_LIVRO.NEGOCIADO),
      detalhe: s => `negociado em ${dataBR(s.reg.negociado)}` },
  ]
  return { total: n, etapas, series, valores, pendencias, notificacoesDevidas: sit.filter(s => s.devida).length }
}

/* ---------------------------------------------------------- triangulação */

/**
 * Etapas por lojista ativo numa competência: redução Z, relatório de PDV,
 * declarado e mês fechado. `historico` é o que `historicoParaCruzamento`
 * devolve: fechamentos persistidos mais os meses abertos da sessão.
 */
function dashTriangulacao (acomp, historico, opts = {}) {
  const ativos = acomp.lojistas.filter(l => l.ativo !== false)
  const n = ativos.length
  const atencao = limitesTri(opts).atencao
  const comps = [...new Set((historico || []).map(h => h.competencia))].sort()
  const referencia = opts.competencia && comps.includes(opts.competencia) ? opts.competencia : comps[comps.length - 1] || null
  const daComp = (c) => (historico || []).filter(h => h.competencia === c)
  const linhasRef = referencia ? daComp(referencia) : []
  const porCnpj = new Map(linhasRef.map(h => [h.cnpj, h]))
  const tem = (h, campo) => h && h[campo] != null
  const etapa = (rotulo, teste) => { const qtd = ativos.filter(l => teste(porCnpj.get(l.cnpj))).length; return { rotulo, qtd, total: n, pct: pct(qtd, n) } }
  const etapas = referencia ? [
    etapa('Redução Z recebida', h => tem(h, 'z')),
    etapa('Relatório de PDV recebido', h => tem(h, 'pdv')),
    etapa('NAPP recebido', h => tem(h, 'napp')),
    etapa('Declarado (ficha) presente', h => tem(h, 'declarado')),
    etapa('Mês fechado', h => !!(h && h.fechado)),
  ] : []

  // variação em R$ por competência: média e máxima entre os lojistas com 2+ tipos de lançamento
  const dispersao = comps.slice(-12).map(c => {
    const vals = daComp(c).map(h => h.amplitude).filter(v => v != null)
    const naoDeclarado = daComp(c).reduce((a, h) => a + (Number(h.naoDeclarado) || 0), 0)
    return { competencia: c, label: competenciaLabel(c), lojistas: vals.length,
      media: vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 100) / 100 : null,
      maxima: vals.length ? Math.max(...vals) : null,
      naoDeclarado: Math.round(naoDeclarado * 100) / 100,
      fechada: daComp(c).length > 0 && daComp(c).every(h => h.fechado) }
  })
  const nome = (cnpj) => (ativos.find(l => l.cnpj === cnpj) || { nome: cnpj }).nome
  const item = (h, detalhe) => ({ cnpj: h.cnpj, lojista: ativos.find(l => l.cnpj === h.cnpj) || { cnpj: h.cnpj, nome: nome(h.cnpj) }, detalhe })
  const pendencias = referencia ? [
    { rotulo: `Sem redução Z em ${competenciaLabel(referencia)}`, lista: ativos.filter(l => !tem(porCnpj.get(l.cnpj), 'z')).map(l => ({ cnpj: l.cnpj, lojista: l, detalhe: 'pedir os cupons Z do mês' })) },
    { rotulo: `Sem relatório de PDV em ${competenciaLabel(referencia)}`, lista: ativos.filter(l => !tem(porCnpj.get(l.cnpj), 'pdv')).map(l => ({ cnpj: l.cnpj, lojista: l, detalhe: 'pedir o relatório do caixa' })) },
    { rotulo: 'Meses com dados e ainda não fechados', lista: (historico || []).filter(h => !h.fechado).map(h => item(h, `${competenciaLabel(h.competencia)} aberto`)) },
    { rotulo: `Variação acima de ${moedaBR(atencao)}`, lista: (historico || []).filter(h => h.amplitude != null && h.amplitude > atencao)
      .sort((a, b) => b.amplitude - a.amplitude).map(h => item(h, `${competenciaLabel(h.competencia)}: ${moedaBR(h.amplitude)}`)) },
  ] : [
    { rotulo: 'Nenhuma competência triangulada ainda', lista: ativos.map(l => ({ cnpj: l.cnpj, lojista: l, detalhe: 'sem Z nem PDV' })) },
  ]
  return { total: n, referencia, competencias: comps, etapas, dispersao, atencao, pendencias }
}

/* -------------------------------------------------------------- societário */

function dashSocietario (acomp, hoje = new Date()) {
  const ativos = acomp.lojistas.filter(l => l.ativo !== false)
  const sit = ativos.map(l => situacaoSocietaria(l, (acomp.societario || {})[l.cnpj], hoje))
  const n = ativos.length
  const pesquisados = sit.filter(s => s.status !== STATUS_SOC.NAO_CONSULTADO || s.reg.consultadoEm || s.reg.indicio)
  const confirmados = sit.filter(s => s.emCobranca)
  const contatados = confirmados.filter(s => s.etapasFeitas.length)
  // encontrada: sinalizada nos 12 meses ou já em cobrança (que segue valendo depois da janela), menos as isentas
  const encontrada = sit.filter(s => (s.recente || s.emCobranca) && s.status !== STATUS_SOC.ISENTO)
  const soma = (lista, k) => lista.reduce((a, s) => a + Number((s.reg.valores && s.reg.valores[k]) || 0), 0)
  const ttEncontrada = soma(encontrada, 'taxa')
  // negociada e faturada sobre o mesmo conjunto da encontrada, para o % fazer sentido
  const ttFaturada = soma(encontrada, 'cobrado')
  const ttNegociada = soma(encontrada, 'negociado')
  const etapas = [
    { rotulo: 'Pesquisados na Junta', qtd: pesquisados.length, total: n },
    { rotulo: 'Checklist da skill completo', qtd: sit.filter(s => s.checklist.completo).length, total: n },
    { rotulo: 'Sinalizados (causa de TT, 12 meses)', qtd: sit.filter(s => s.recente).length, total: n },
    { rotulo: 'TT confirmada pelo time', qtd: confirmados.length, total: n },
    { rotulo: 'Contatados (1ª notificação ou além)', qtd: contatados.length, total: confirmados.length, base: 'das confirmadas' },
    { rotulo: 'Cobrados', qtd: sit.filter(s => s.status === STATUS_SOC.COBRADO).length, total: confirmados.length, base: 'das confirmadas' },
  ].map(e => ({ ...e, pct: pct(e.qtd, e.total) }))
  const pendencias = [
    { rotulo: 'Não pesquisados na Junta', lista: sit.filter(s => !pesquisados.includes(s)), detalhe: s => s.lojista.uf ? `Junta de ${s.lojista.uf}` : 'falta UF do contrato' },
    { rotulo: 'Guias a pagar (indício na triagem)', lista: sit.filter(s => s.guiaAPagar), detalhe: () => 'pedir a certidão' },
    { rotulo: 'Certidão paga, aguardando download', lista: sit.filter(s => s.aguardandoDownload), detalhe: s => `protocolo ${s.reg.protocolo || s.reg.guiaNumero || '—'} · pago em ${dataBR(s.reg.guiaPagaEm)}` },
    { rotulo: 'Sinalizados aguardando validação do time', lista: sit.filter(s => s.precisaValidar), detalhe: s => `alteração em ${dataBR(s.reg.dataMudanca)}` },
    { rotulo: 'TT confirmada sem contato', lista: confirmados.filter(s => !s.etapasFeitas.length), detalhe: s => `confirmada em ${dataBR(s.reg.validadoEm)}` },
    { rotulo: 'Notificações de TT devidas', lista: sit.filter(s => s.devida), detalhe: s => s.devida.rotulo },
    { rotulo: 'Sem data de início do contrato', lista: sit.filter(s => s.semInicioContrato), detalhe: () => 'não dá para separar alteração anterior' },
  ]
  return { total: n, etapas, ttEncontrada, ttNegociada, ttFaturada, pctFaturado: pct(ttFaturada, ttEncontrada), pendencias }
}

/** Gerador pseudoaleatório com semente (mulberry32). */
function semente (s) {
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0
    let t = Math.imul(s ^ s >>> 15, 1 | s)
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t
    return ((t ^ t >>> 14) >>> 0) / 4294967296
  }
}

function cnpjComDv (base12) {
  const pesos = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
  const dv = (n) => { let s = 0; for (let i = 0; i < n.length; i++) s += Number(n[i]) * pesos[pesos.length - n.length + i]; const r = s % 11; return r < 2 ? 0 : 11 - r }
  const d1 = dv(base12)
  return base12 + d1 + dv(base12 + d1)
}

/** Um mês fechado da triangulação, com a mesma conta do app (maior valor e variação em R$). */
function fechamento (competencia, cnpj, fechadoEm, { z = null, pdv = null, napp = null, declarado = null, diasZ, diasPdv, diasNapp }) {
  const r = resumirFontes({ z, pdv, napp, declarado })
  const alertas = []
  if (pdv != null && z != null && pdv - z > 100) alertas.push({ tipo: 'venda_sem_documento', grave: true, texto: `O PDV registra R$ ${(pdv - z).toLocaleString('pt-BR')} a mais do que a redução Z.` })
  if (r.naoDeclarado > 100) alertas.push({ tipo: 'declarado_a_menor', grave: true, texto: `Foi declarado R$ ${r.naoDeclarado.toLocaleString('pt-BR')} a menos do que o maior valor registrado.` })
  const nomes = { z: 'Redução Z', pdv: 'PDV', napp: 'NAPP', declarado: 'Declarado' }
  return { competencia, cnpj, fechadoEm, z, pdv, napp, declarado, diasZ: diasZ ?? (z == null ? 0 : 30), diasPdv: diasPdv ?? (pdv == null ? 0 : 30),
    diasNapp: diasNapp ?? (napp == null ? 0 : 30), ...r, alertas,
    explicacao: r.amplitude == null ? 'Só uma fonte.' : `Maior valor: ${r.fonteMaior.map(k => nomes[k]).join(' e ')}; variação de R$ ${r.amplitude.toLocaleString('pt-BR')} entre os tipos de lançamento.` }
}

/** Monta o acompanhamento fictício completo (a mesma forma que o app guarda). */
function gerarBaseFicticia (hoje = new Date()) {
  const rnd = semente(20261018)
  // sequência à parte para os campos da skill de TT: não altera o resto da base
  const rnd2 = semente(7)
  const sorte2 = (p) => rnd2() < p
  const entre2 = (a, b) => a + Math.floor(rnd2() * (b - a + 1))
  // outra sequência à parte para o NAPP, que veio depois: a base de antes não muda
  const rnd3 = semente(11)
  const entre = (a, b) => a + Math.floor(rnd() * (b - a + 1))
  const sorte = (p) => rnd() < p
  const ciclo = cicloAtual(hoje)
  const inicioCiclo = new Date(ciclo.ano, 3, 1)
  const diaDoCiclo = (minMes, maxMes) => {
    const m = entre(minMes, maxMes); const d = new Date(ciclo.ano, 3 + m, entre(2, 27))
    return d > hoje ? hoje : d
  }
  const depois = (data, minDias, maxDias) => { const d = new Date(data); d.setDate(d.getDate() + entre(minDias, maxDias)); return d > hoje ? null : d }
  const dIso = (d) => d ? iso(d) : null
  const decorridos = ciclo.mesesDecorridos

  const lojistas = LOJAS.map(([nome, segmento], i) => {
    const cnpj = i === 0 ? '11222333000181' : i === 1 ? '11222333000262'
      : cnpjComDv(String(10 + entre(0, 89)).padStart(2, '0') + String(entre(100000, 999999)) + '0001')
    const uf = i < 30 ? 'SP' : ['RJ', 'MG', 'PR', 'RJ', 'MG', 'SC', 'BA', 'RS', 'GO', 'DF'][i - 30]
    const ini = new Date(entre(2015, 2026), entre(0, 11), entre(1, 28))
    const inicio = ini > hoje ? new Date(hoje.getFullYear() - 1, 5, 1) : ini
    return {
      cnpj, nome, razao: i < 2 ? 'BELA COSMETICOS LTDA' : `${nome.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z0-9 ]/g, '').trim()} ${SOBRENOMES[i % SOBRENOMES.length]} LTDA`,
      luc: String(100 + i * 7 + entre(0, 5)),
      email: i % 9 === 5 ? '' : `fiscal@${nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '')}.com.br`,
      telefone: i % 7 === 3 ? '' : `1198${String(entre(1000000, 9999999))}`,
      regime: sorte(0.45) ? 'simples' : 'normal', segmento, uf, inicioContrato: iso(inicio), ativo: i !== 39,
    }
  })

  /* ---- auditoria fiscal do ciclo: marcos, valores, notificações ---- */
  const regs = {}
  for (const l of lojistas) {
    const reg = { recebido: null, auditado: null, negociado: null, cobrado: null, notificacoes: {}, valores: {}, obs: '' }
    const entregou = sorte(0.58)
    if (entregou) {
      const rec = diaDoCiclo(0, Math.max(0, decorridos - 1)); reg.recebido = dIso(rec)
      const aud = sorte(0.72) ? depois(rec, 12, 60) : null; reg.auditado = dIso(aud)
      if (aud) {
        const div = sorte(0.35) ? 0 : Math.round(entre(800, 85000) / 10) * 10
        reg.valores.divergencia = div
        const neg = div && sorte(0.65) ? depois(aud, 10, 45) : null; reg.negociado = dIso(neg)
        if (neg) {
          reg.valores.negociado = Math.round(div * (0.6 + rnd() * 0.35) / 10) * 10
          const cob = sorte(0.7) ? depois(neg, 7, 40) : null; reg.cobrado = dIso(cob)
          if (cob) reg.valores.cobrado = reg.valores.negociado
        }
      }
      // quem entregou tarde passou por notificações antes
      const mesRec = (rec.getFullYear() - ciclo.ano) * 12 + rec.getMonth() - 3
      ;['n1', 'n2', 'n3', 'aviso'].slice(0, Math.max(0, mesRec)).forEach((e, k) => { reg.notificacoes[e] = iso(new Date(ciclo.ano, 3 + k, 5)) })
    } else {
      // em dia, atrasado ou multado no fluxo
      const feitas = sorte(0.35) ? Math.min(5, decorridos) : Math.max(0, Math.min(4, decorridos - 1) - entre(0, 3))   // multados × atrasados no fluxo
      ;['n1', 'n2', 'n3', 'aviso', 'multa'].slice(0, Math.min(5, feitas)).forEach((e, k) => { reg.notificacoes[e] = iso(new Date(ciclo.ano, 3 + k, entre(3, 9))) })
    }
    regs[l.cnpj] = reg
  }

  /* ---- triangulação: seis meses fechados antes do mês corrente ---- */
  const fechamentos = []
  for (let k = 6; k >= 1; k--) {
    const ref = new Date(hoje.getFullYear(), hoje.getMonth() - k, 1)
    const comp = `${ref.getFullYear()}-${String(ref.getMonth() + 1).padStart(2, '0')}`
    const fechadoEm = iso(new Date(ref.getFullYear(), ref.getMonth() + 1, entre(3, 12)))
    const cobertura = 0.45 + (6 - k) * 0.07   // a adesão cresce mês a mês
    for (const l of lojistas.filter(x => x.ativo)) {
      if (!sorte(cobertura)) continue
      const base = entre(30000, 260000)
      const temPdv = sorte(0.9); const temDec = sorte(0.85)
      // desvio grande em ~18%; o pequeno fica na casa das dezenas a poucas centenas de reais
      const desvio = sorte(0.18) ? 0.04 + rnd() * 0.16 : rnd() * 0.0012
      const z = base
      const pdv = temPdv ? Math.round(base * (1 + (sorte(0.7) ? desvio : -desvio / 2))) : null
      const dec = temDec ? Math.round(base * (1 - (sorte(0.6) ? desvio : rnd() * 0.0004))) : null
      // NAPP em pouco mais da metade dos lojistas; às vezes acima de todos os outros lançamentos
      const napp = rnd3() < 0.55 ? Math.round(base * (rnd3() < 0.12 ? 1.03 + rnd3() * 0.05 : 0.9997 + rnd3() * 0.0008)) : null
      const diasZ = 28 + entre(0, 3); const diasPdv = temPdv ? 28 + entre(0, 3) : 0
      fechamentos.push(fechamento(comp, l.cnpj, fechadoEm, { z, pdv, napp, declarado: dec, diasZ, diasPdv, diasNapp: napp == null ? 0 : diasZ }))
    }
  }

  /* ---- societário ---- */
  const societario = {}
  const causas = ['capital', 'socio_admin', 'entrada_saida', 'objeto']
  for (const l of lojistas) {
    if (!sorte(0.78)) continue    // ainda não pesquisado
    const r = { indicio: null, guiaPagaEm: null, guiaNumero: '', consultadoEm: dIso(diaDoCiclo(0, Math.max(0, decorridos - 1))), houveMudanca: null, dataMudanca: null,
      tipo: '', registro: '', descricao: '', isencao: null, limite: '', validadoEm: null, cobrar: null, notificacoes: {}, negociado: null, cobrado: null,
      valores: { taxa: null, negociado: null, cobrado: null }, obs: '' }
    r.motivo = sorte2(0.75) ? 'periodica' : sorte2(0.5) ? 'renovacao' : 'suspeita'
    r.nire = String(entre2(31200000000, 35299999999)); r.nireConfirmado = sorte2(0.85); r.atosListados = sorte2(0.8)
    const x = rnd()
    if (x < 0.42) { r.indicio = 'nao' } else if (x < 0.5) { r.indicio = 'sim' } else if (x < 0.62) { r.indicio = 'nao'; r.houveMudanca = false } else {
      r.indicio = 'sim'; r.guiaPagaEm = r.consultadoEm; entre(10000, 99999) /* mantém a sequência da base original */; r.protocolo = `${ciclo.ano}${entre2(1000000, 9999999)}`
      if (sorte2(0.75)) { const b = new Date(r.guiaPagaEm + 'T12:00:00'); b.setDate(b.getDate() + entre2(2, 8)); if (b <= hoje) r.certidaoBaixadaEm = iso(b) }
      r.houveMudanca = true
      const meses = sorte(0.15) ? entre(13, 16) : entre(1, 11)
      const dm = new Date(hoje.getFullYear(), hoje.getMonth() - meses, entre(1, 27))
      r.dataMudanca = iso(dm); r.tipo = sorte(0.12) ? 'outra' : causas[entre(0, 3)]
      r.registro = `${entre(100000, 999999)}/${dm.getFullYear()}`
      r.descricao = { capital: 'aumento de capital social', socio_admin: 'troca de administrador', entrada_saida: 'saída de sócio e entrada de novo sócio', objeto: 'inclusão de atividade no objeto social', outra: 'mudança de endereço da sede' }[r.tipo]
      const taxa = Math.round(entre(8000, 45000) / 100) * 100
      const y = rnd()
      if (y < 0.25) { /* sinalizado, aguardando validação */ } else if (y < 0.4) {
        r.isencao = 'sim'; r.limite = 'até 25% das quotas entre sócios atuais'; r.validadoEm = dIso(depois(dm, 5, 40)) || iso(hoje); r.cobrar = false
      } else {
        r.isencao = 'nao'; r.limite = 'até 25% das quotas entre sócios atuais'; r.valores.taxa = taxa
        const val = depois(dm, 10, 60) || new Date(hoje.getFullYear(), hoje.getMonth() - 1, 10)
        r.validadoEm = iso(val); r.cobrar = true; r.encaminhadoEm = iso(val)
        const mesesVal = (hoje.getFullYear() - val.getFullYear()) * 12 + hoje.getMonth() - val.getMonth() + 1
        ;['n1', 'n2', 'n3', 'aviso', 'multa'].slice(0, Math.max(0, mesesVal - entre(0, 2))).forEach((e, k) => { r.notificacoes[e] = iso(new Date(val.getFullYear(), val.getMonth() + k, Math.min(28, val.getDate() + 1))) })
        if (sorte(0.55)) {
          const neg = depois(val, 20, 90); if (neg) { r.negociado = iso(neg); r.valores.negociado = Math.round(taxa * (0.7 + rnd() * 0.3) / 100) * 100 }
          if (neg && sorte(0.6)) { const cob = depois(neg, 10, 40); if (cob) { r.cobrado = iso(cob); r.valores.cobrado = r.valores.negociado } }
        }
      }
    }
    societario[l.cnpj] = r
  }

  const cenarios = aplicarCenarios({ lojistas, regs, fechamentos, societario, ciclo, hoje })

  return {
    versao: VERSAO_ACOMPANHAMENTO, ficticia: true, geradaEm: iso(hoje),
    lojistas, ciclos: { [ciclo.chave]: regs }, fechamentos, societario, cenarios,
    prefs: {
      shopping: 'o Shopping Parque Exemplo', prazoDias: 10, assinatura: 'Equipe de Auditoria — Shopping Parque Exemplo',
      clausulaMulta: 'a multa de 1 (um) aluguel mínimo prevista na cláusula 18.3 do contrato de locação',
      clausulaTaxa: 'a taxa de transferência de 3 (três) aluguéis mínimos prevista na cláusula 22 do contrato de locação',
    },
    _inicioCiclo: iso(inicioCiclo),
  }
}

/**
 * Cenários fixos: os 22 primeiros lojistas deixam de ser aleatórios e passam a
 * cobrir, de propósito, cada situação que o app sabe mostrar — para o time
 * testar sabendo o que deve aparecer. Devolve o roteiro (quem, processo, o que
 * ver e onde).

function aplicarCenarios ({ lojistas, regs, fechamentos, societario, ciclo, hoje }) {
  const L = (i) => lojistas[i]
  const dCiclo = (mes, dia) => { const d = new Date(ciclo.ano, 3 + mes, dia); return iso(d > hoje ? hoje : d) }

  const soc = (i, r) => {
    societario[L(i).cnpj] = { motivo: 'periodica', nire: String(31200000000 + i * 7919), nireConfirmado: true, atosListados: true, protocolo: '', certidaoBaixadaEm: null,

      descricao: '', isencao: null, limite: '', validadoEm: null, cobrar: null, notificacoes: {}, negociado: null, cobrado: null,

  const cobranca = (taxa, mesesValidado, extra = {}) => ({ isencao: 'nao', limite: 'até 25% das quotas entre sócios atuais', validadoEm: mesesAtras(mesesValidado, 5), cobrar: true,

  fiscal(6, { recebido: dCiclo(0, 22), auditado: dCiclo(1, 25), negociado: dCiclo(3, 2), valores: { divergencia: 9600, negociado: 8000 } })
  fiscal(7, {})
  L(7).email = ''; L(7).telefone = ''
  // ---- cadastro incompleto ----
  L(8).uf = ''; L(8).inicioContrato = ''
  // ---- triangulação: a competência de referência é o mês passado ----
  const ref = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1)
  const comp = `${ref.getFullYear()}-${String(ref.getMonth() + 1).padStart(2, '0')}`
  const fechadoEm = iso(new Date(hoje.getFullYear(), hoje.getMonth(), 3))
  const tri = (i, z, pdv, dec, napp = null) => {
    const cnpj = L(i).cnpj
    for (let k = fechamentos.length - 1; k >= 0; k--) if (fechamentos[k].cnpj === cnpj && fechamentos[k].competencia === comp) fechamentos.splice(k, 1)
    if (z == null && pdv == null && dec == null && napp == null) return
    fechamentos.push(fechamento(comp, cnpj, fechadoEm, { z, pdv, napp, declarado: dec }))
  }
  tri(0, 121196, 129076, 108050)

  // ---- societário ----

  soc(21, { indicio: 'nao', houveMudanca: false })

  const nome = (i) => L(i).nome

    { loja: nome(4), cnpj: L(4).cnpj, processo: 'Auditoria fiscal', situacao: 'Livro não recebido, só a 1ª notificação: etapas acumuladas', onde: 'Notificações' },
    { loja: nome(5), cnpj: L(5).cnpj, processo: 'Auditoria fiscal', situacao: 'Apurado com divergência de R$ 18.400, aguardando negociação', onde: 'Dashboard (pendências)' },
    { loja: nome(6), cnpj: L(6).cnpj, processo: 'Auditoria fiscal', situacao: 'Negociado (R$ 8.000), aguardando cobrança', onde: 'Dashboard (pendências)' },
    { loja: nome(7), cnpj: L(7).cnpj, processo: 'Auditoria fiscal', situacao: 'Livro não recebido, sem e-mail nem WhatsApp, nenhuma notificação', onde: 'Notificações' },
