<body>
<header>
  <div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L8 21H3v-5z"/><path d="M12 7l5 5"/><path d="M19 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="currentColor" stroke="none"/></svg></div>

<main>
  <section class="lado">
    <nav id="abas"></nav>
    <div id="painel"></div>
  </section>
  <section class="palco" id="palco">
    <div class="barra">
      <select id="qual-peca" aria-label="Peça em prévia"></select>
      <label class="check"><input type="checkbox" id="guias"> Guias</label>
      <span class="legenda"><i class="mg"></i>corte <i class="cy"></i>segurança</span>
    </div>
    <canvas id="previa"></canvas>
    <h3>Revisão do designer</h3>
    <ul id="relatorio"></ul>
  </section>
</main>
<script src="js/pdf.js"></script>
<script src="js/layout.js"></script>
